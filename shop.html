<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NexusFlow | Shop</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f7f9; padding: 20px; margin: 0; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; max-width: 1200px; margin: auto; }
        .product-card { background: white; padding: 15px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); cursor: pointer; text-align: center; transition: 0.3s; }
        .product-card:hover { transform: translateY(-5px); box-shadow: 0 6px 12px rgba(0,0,0,0.15); }
        .product-img { width: 100%; height: 180px; object-fit: contain; background: #fafafa; border-radius: 5px; }
        .price { color: #b12704; font-size: 1.2rem; font-weight: bold; margin: 10px 0; }
        .btn-view { background: #232f3e; color: white; border: none; padding: 10px; border-radius: 5px; width: 100%; cursor: pointer; }
    </style>
</head>
<body>
    <h1 style="text-align:center; color: #232f3e;">Our Inventory</h1>
    <div id="productGrid" class="grid">Fetching products...</div>

    <script>
        const API_URL = 'https://yskkdnff93.execute-api.us-east-1.amazonaws.com/prod/products';

        window.onload = function() {
            fetch(API_URL)
                .then(res => res.json())
                .then(products => {
                    const grid = document.getElementById('productGrid');
                    if (products.length === 0) {
                        grid.innerHTML = "<p>No products found in database.</p>";
                        return;
                    }
                    grid.innerHTML = products.map(p => `
                        <div class="product-card" onclick="goToDetails('${p.productId}')">
                            <img src="${p.imageUrl || 'https://via.placeholder.com/200'}" class="product-img">
                            <h3>${p.name}</h3>
                            <div class="price">$${p.price}</div>
                            <button class="btn-view">View Product</button>
                        </div>
                    `).join('');
                })
                .catch(err => console.error("Error:", err));
        };

        function goToDetails(id) {
            window.location.href = `product-details.html?id=${id}`;
        }
    </script>
</body>
</html>
