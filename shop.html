<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusFlow | Inventory</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Shop Specific Layout */
        .shop-header {
            text-align: center;
            padding: 60px 20px;
            background: linear-gradient(to bottom, rgba(245, 158, 11, 0.05), transparent);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            padding-bottom: 80px;
        }

        .product-card {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid rgba(255, 255, 255, 0.05);
            overflow: hidden;
            background: rgba(255, 255, 255, 0.02);
        }

        .product-card:hover {
            transform: translateY(-8px);
            border-color: var(--accent);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
        }

        .img-container {
            width: 100%;
            height: 220px;
            background: #fff; /* White background for product photos looks cleaner */
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            box-sizing: border-box;
        }

        .product-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .product-info {
            padding: 20px;
            text-align: left;
        }

        .product-info h3 {
            margin: 0 0 10px 0;
            font-size: 1.1rem;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .price {
            color: var(--accent);
            font-size: 1.4rem;
            font-weight: 800;
            margin-bottom: 15px;
        }

        #status-msg {
            text-align: center;
            grid-column: 1 / -1;
            padding: 100px 0;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>

<nav class="navbar">
    <a href="index.html" class="logo">NEXUS<span style="color:white">FLOW</span></a>
    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="shop.html" class="active">Shop</a>
        <a href="services.html">Services</a>
        <a href="cart.html" class="cart-link">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="var(--accent)">
                <path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/>
            </svg>
            <span class="cart-count" id="cart-badge">0</span>
        </a>
    </div>
</nav>

<header class="shop-header">
    <div class="container">
        <h1 style="font-size: 3rem; margin-bottom: 10px;">Hardware <span style="color:var(--accent)">Vault</span></h1>
        <p style="color: var(--text-secondary); font-size: 1.1rem;">Precision engineered components for the next generation.</p>
    </div>
</header>

<div class="container">
    <div id="productGrid" class="grid">
        <div id="status-msg">
            <h3 class="loading-pulse">Scanning Inventory...</h3>
        </div>
    </div>
</div>

<script>
    const API_URL = 'https://yskkdnff93.execute-api.us-east-1.amazonaws.com/prod/products';

    window.onload = function() {
        updateCartBadge();
        
        fetch(API_URL)
            .then(res => {
                if (!res.ok) throw new Error("Connection failed");
                return res.json();
            })
            .then(products => {
                const grid = document.getElementById('productGrid');
                
                if (!products || products.length === 0) {
                    grid.innerHTML = "<div id='status-msg'><h3>Inventory currently empty.</h3></div>";
                    return;
                }

                grid.innerHTML = products.map(p => `
                    <div class="card product-card">
                        <div class="img-container">
                            <img src="${p.imageUrl || 'https://via.placeholder.com/300?text=NexusFlow'}" class="product-img" alt="${p.name}">
                        </div>
                        <div class="product-info">
                            <h3>${p.name}</h3>
                            <div class="price">$${parseFloat(p.price).toFixed(2)}</div>
                            <button class="btn btn-primary" style="width:100%" onclick="goToDetails('${p.productId}')">
                                Initialize Purchase
                            </button>
                        </div>
                    </div>
                `).join('');
            })
            .catch(err => {
                document.getElementById('productGrid').innerHTML = 
                    "<div id='status-msg'><h3 style='color:var(--danger)'>System Error: Failed to retrieve catalog.</h3></div>";
            });
    };

    function goToDetails(id) {
        window.location.href = `product-details.html?id=${id}`;
    }

    function updateCartBadge() {
        const cart = JSON.parse(localStorage.getItem('nexus_cart')) || [];
        const badge = document.getElementById('cart-badge');
        if(badge) {
            badge.innerText = cart.length;
            badge.style.display = cart.length > 0 ? 'block' : 'none';
        }
    }
</script>
</body>
</html>
