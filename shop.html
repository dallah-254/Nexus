<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusFlow | Inventory Vault</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/aws-sdk/2.1522.0/aws-sdk.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@6.3.7/dist/amazon-cognito-identity.min.js"></script>
    <script src="auth-config.js"></script>
    
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="header.css"> 

    <style>
        .shop-header {
            text-align: center;
            padding: 40px 20px;
            background: linear-gradient(to bottom, rgba(0, 243, 255, 0.03), transparent);
        }

        /* Compact Grid: Smaller min-width for cards */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 15px;
            padding: 20px;
            padding-bottom: 80px;
        }

        .product-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            transition: all 0.25s ease;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .product-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent);
            background: rgba(255, 255, 255, 0.05);
        }

        /* Scaled down Image Container */
        .img-container {
            width: 100%;
            height: 160px;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
        }

        .product-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .product-info {
            padding: 15px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        /* Smaller Typography for compact look */
        .product-info h3 {
            margin: 0 0 8px 0;
            font-size: 0.95rem;
            line-height: 1.2;
            height: 2.4em; /* Allows for 2 lines of text */
            overflow: hidden;
            color: var(--text-primary);
        }

        .price {
            color: var(--accent);
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 12px;
            font-family: 'JetBrains Mono', monospace;
        }

        .btn-init {
            width: 100%;
            background: transparent;
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 8px;
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.2s;
            font-family: 'JetBrains Mono', monospace;
        }

        .btn-init:hover {
            background: var(--accent);
            color: #000;
        }

        #status-msg {
            grid-column: 1 / -1;
            text-align: center;
            padding: 100px 0;
            font-family: 'JetBrains Mono', monospace;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>

<div id="nexus-header-wrapper"></div>

<header class="shop-header">
    <div class="container">
        <h1 style="font-size: 2.5rem; margin-bottom: 5px;">Hardware <span style="color:var(--accent)">Vault</span></h1>
        <p style="color: var(--text-secondary); font-size: 0.9rem;">Next-Gen Component Registry</p>
    </div>
</header>

<div class="container">
    <div id="productGrid" class="grid">
        <div id="status-msg">
            <h3 class="loading-pulse">> ACCESSING_INVENTORY...</h3>
        </div>
    </div>
</div>

<script src="header.js"></script>

<script>
    const API_URL = 'https://yskkdnff93.execute-api.us-east-1.amazonaws.com/prod/products';

    window.onload = function() {
        // Data fetch from your API
        fetch(API_URL)
            .then(res => res.json())
            .then(products => {
                const grid = document.getElementById('productGrid');
                if (!products || products.length === 0) {
                    grid.innerHTML = "<div id='status-msg'><h3>REGISTRY_EMPTY</h3></div>";
                    return;
                }

                grid.innerHTML = products.map(p => `
                    <div class="product-card">
                        <div class="img-container">
                            <img src="${p.imageUrl || p.imageURL || 'placeholder.png'}" class="product-img" alt="Component">
                        </div>
                        <div class="product-info">
                            <div style="font-size: 0.65rem; color: var(--accent); text-transform: uppercase; margin-bottom: 4px;">
                                ${p.category || 'Unit'}
                            </div>
                            <h3>${p.name || p.productName}</h3>
                            <div class="price">$${parseFloat(p.price).toFixed(2)}</div>
                            <button class="btn-init" onclick="window.location.href='product-details.html?id=${p.productId || p.id}'">
                                View Specs
                            </button>
                        </div>
                    </div>
                `).join('');
            })
            .catch(err => {
                document.getElementById('productGrid').innerHTML = `<div id='status-msg'>CONNECTION_FAILURE</div>`;
            });
    };
</script>
</body>
</html>
