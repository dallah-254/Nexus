<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop | NexusFlow</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/aws-sdk/2.1522.0/aws-sdk.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@6.3.7/dist/amazon-cognito-identity.min.js"></script>
    
    <script src="auth-config.js"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="header.css">

    <style>
        :root {
            --n-cyan: #00f3ff;
            --n-bg: #0a0a0a;
            --n-border: rgba(0, 243, 255, 0.15);
            --n-panel: rgba(255, 255, 255, 0.03);
            --accent: #00f3ff;
        }

        body { 
            padding-top: 100px; 
            font-family: 'Inter', sans-serif; 
            background: var(--n-bg); 
            color: white; 
            margin: 0;
        }

        .shop-container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Toast Notification */
        #nexus-toast {
            position: fixed; bottom: 30px; right: 30px;
            padding: 15px 25px; background: #111;
            border-left: 4px solid var(--n-cyan);
            border-radius: 4px; color: white;
            font-family: 'JetBrains Mono', monospace; font-size: 0.85rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            z-index: 9999; display: none;
            animation: slideIn 0.3s ease-out;
        }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        /* Filter Bar */
        .filter-bar {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 30px; background: var(--n-panel);
            padding: 15px 25px; border-radius: 8px; border: 1px solid var(--n-border);
        }

        .search-box {
            background: #000; border: 1px solid #333;
            padding: 8px 15px; color: white; border-radius: 4px;
            width: 250px; font-family: 'JetBrains Mono';
        }

        /* Product Grid */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }

        .product-card {
            background: var(--n-panel);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            overflow: hidden;
            transition: 0.3s;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .product-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent);
            background: rgba(255, 255, 255, 0.06);
        }

        /* Wishlist Heart Icon */
        .wishlist-btn {
            position: absolute; top: 10px; right: 10px;
            background: rgba(0,0,0,0.6); color: #fff;
            border: 1px solid rgba(255,255,255,0.1);
            width: 32px; height: 32px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; z-index: 10; transition: 0.2s;
        }
        .wishlist-btn:hover { background: #ff4444; color: white; border-color: #ff4444; }

        .product-image-link { display: block; width: 100%; height: 160px; background: #000; }
        .product-image { width: 100%; height: 100%; object-fit: contain; }

        .product-info { padding: 15px; flex-grow: 1; display: flex; flex-direction: column; }
        .product-category { font-size: 0.65rem; color: var(--accent); font-weight: 700; margin-bottom: 5px; text-transform: uppercase; }
        .product-name { font-size: 0.95rem; font-weight: 600; margin-bottom: 8px; color: #fff; height: 2.3rem; overflow: hidden; }
        .product-price { font-size: 1.1rem; font-weight: 800; color: #fff; margin-bottom: 15px; }

        .btn-add {
            background: var(--accent); color: #000; border: none;
            padding: 10px; border-radius: 5px; font-weight: 700;
            font-size: 0.8rem; cursor: pointer; transition: 0.2s;
            text-transform: uppercase;
        }
        .btn-add:hover { background: #fff; }

        .btn-details {
            text-align: center; text-decoration: none; color: #666;
            font-size: 0.7rem; padding-top: 10px; transition: 0.2s;
            font-family: 'JetBrains Mono';
        }
        .btn-details:hover { color: var(--accent); }

        #loading-state { text-align: center; padding: 100px; color: #666; font-family: 'JetBrains Mono'; }
    </style>
</head>
<body>

<div id="nexus-header-wrapper"></div>
<div id="nexus-toast"></div>

<div class="shop-container">
    <div class="filter-bar">
        <div style="color: #888; font-size: 0.85rem; font-family: 'JetBrains Mono';">
            ACTIVE_UNITS: <span id="product-count"></span>
        </div>
    </div>

    <div id="loading-state">ESTABLISHING_INVENTORY_LINK...</div>
    <div id="product-grid" class="product-grid"></div>
</div>

<script src="header.js"></script>
<script>
    let allProducts = [];

    // Notification System
    function showToast(message) {
        const toast = document.getElementById('nexus-toast');
        toast.innerText = `> ${message}`;
        toast.style.display = 'block';
        setTimeout(() => { toast.style.display = 'none'; }, 3000);
    }

    // Real-Time Header Update Hook
    function syncHeader() {
        if (typeof window.updateHeaderBadges === 'function') {
            window.updateHeaderBadges();
        } else {
            // Fallback: Dispatch custom event if your header listens for it
            window.dispatchEvent(new Event('cartUpdated'));
        }
    }

    window.onload = async function() {
        try {
            const response = await fetch(`${NEXUS_CONFIG.api.baseUrl}/products`);
            allProducts = await response.json();
            document.getElementById('loading-state').style.display = 'none';
            renderProducts(allProducts);
        } catch (error) {
            document.getElementById('loading-state').innerText = "SYSTEM_OFFLINE: API_CONNECTION_FAILED";
        }
    };

    function renderProducts(products) {
        const grid = document.getElementById('product-grid');
        document.getElementById('product-count').innerText = products.length;
        
        grid.innerHTML = products.map(p => `
            <div class="product-card">
                <div class="wishlist-btn" onclick="addToWishlist('${p.productId}')">♥</div>
                
                <a href="product-details.html?id=${p.productId}" class="product-image-link">
                    <img src="${p.imageUrl || 'https://via.placeholder.com/250'}" class="product-image">
                </a>

                <div class="product-info">
                    <span class="product-category">${p.category || 'Hardware'}</span>
                    <h2 class="product-name">${p.name}</h2>
                    <div class="product-price">$${p.price.toFixed(2)}</div>
                    
                    <div class="product-actions">
                        <button onclick="quickAdd('${p.productId}')" class="btn-add">ADD TO CART</button>
                        <a href="product-details.html?id=${p.productId}" class="btn-details">VIEW_SPECIFICATIONS</a>
                    </div>
                </div>
            </div>
        `).join('');
    }

    function filterProducts() {
        const query = document.getElementById('shop-search').value.toLowerCase();
        const filtered = allProducts.filter(p => p.name.toLowerCase().includes(query));
        renderProducts(filtered);
    }

    function quickAdd(id) {
        const product = allProducts.find(p => p.productId === id);
        if (!product) return;

        let cart = JSON.parse(localStorage.getItem('nexus_cart')) || [];
        cart.push({
            productId: product.productId,
            name: product.name,
            price: product.price,
            imageUrl: product.imageUrl
        });
        
        localStorage.setItem('nexus_cart', JSON.stringify(cart));
        
        // REAL-TIME UPDATES
        syncHeader(); 
        showToast("ADDED TO CART");
    }

    function addToWishlist(id) {
        let wishlist = JSON.parse(localStorage.getItem('nexus_wishlist')) || [];
        if (!wishlist.includes(id)) {
            wishlist.push(id);
            localStorage.setItem('nexus_wishlist', JSON.stringify(wishlist));
            
            syncHeader(); // Real-time update for wishlist count
            showToast("ADDED TO WISHLIST");
        } else {
            showToast("ALREADY IN WISHLIST");
        }
    }
</script>
</body>
</html>
