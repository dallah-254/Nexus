<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusFlow | Secure Authentication</title>
    <script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@6.3.16/dist/amazon-cognito-identity.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .auth-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .auth-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .auth-header h2 {
            font-size: 1.8rem;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        .auth-header p {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        #status {
            text-align: center;
            margin-top: 20px;
            font-size: 0.85rem;
            min-height: 20px;
            padding: 10px;
            border-radius: 6px;
        }

        .form-footer {
            text-align: center;
            margin-top: 25px;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .form-footer a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
        }

        .form-footer a:hover {
            text-decoration: underline;
        }

        /* Input overrides for login page specifically */
        input {
            margin-bottom: 15px;
            background: rgba(15, 23, 42, 0.8);
        }
    </style>
</head>
<body>

<nav class="navbar">
    <a href="index.html" class="logo">NEXUS<span style="color:white">FLOW</span></a>
    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="shop.html">Shop</a>
        <a href="book-repair.html">Book Repair</a>
    </div>
</nav>

<div class="auth-wrapper">
    <div class="card login-card">
        <div class="auth-header">
            <h2>Authorized <span style="color:var(--accent)">Access</span></h2>
            <p>Enter your credentials to manage your tech flow.</p>
        </div>

        <form id="loginForm">
            <label>Corporate / Personal Email</label>
            <input type="email" id="email" placeholder="name@company.com" required>
            
            <label>Password</label>
            <input type="password" id="password" placeholder="••••••••" required>
            
            <button type="submit" id="loginBtn" class="btn btn-primary" style="width: 100%; margin-top: 10px; font-size: 1rem;">
                Secure Sign In
            </button>
        </form>

        <div id="status"></div>

        <div class="form-footer">
            Don't have an account? <a href="registration.html">Create Access Profile</a>
        </div>
    </div>
</div>

<script>
    const poolData = { 
        UserPoolId: 'us-east-1_IK57zG64M', 
        ClientId: '668q6c6krjv8b6n81cfc78n9a4' 
    };
    const userPool = new AmazonCognitoIdentity.CognitoUserPool(poolData);

    document.getElementById('loginForm').onsubmit = function(e) {
        e.preventDefault();
        const status = document.getElementById('status');
        const btn = document.getElementById('loginBtn');
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        // Reset UI
        btn.disabled = true;
        btn.innerText = "Authenticating...";
        status.style.display = "block";
        status.style.background = "rgba(255, 255, 255, 0.05)";
        status.style.color = "var(--text-secondary)";
        status.innerText = "Verifying with AWS Cloud Security...";

        const authDetails = new AmazonCognitoIdentity.AuthenticationDetails({
            Username: email, Password: password
        });

        const cognitoUser = new AmazonCognitoIdentity.CognitoUser({
            Username: email, Pool: userPool
        });

        cognitoUser.authenticateUser(authDetails, {
            onSuccess: function(result) {
                const idToken = result.getIdToken().getJwtToken();
                localStorage.setItem('nexus_id_token', idToken);
                
                status.style.color = "var(--success)";
                status.style.background = "rgba(16, 185, 129, 0.1)";
                status.innerText = "✓ Access Granted. Redirecting...";
                
                setTimeout(() => { window.location.href = 'profile.html'; }, 800);
            },
            onFailure: function(err) {
                btn.disabled = false;
                btn.innerText = "Secure Sign In";
                status.style.color = "var(--danger)";
                status.style.background = "rgba(239, 68, 68, 0.1)";
                status.innerText = err.message || "Authentication failed.";
            }
        });
    };
</script>
</body>
</html>
