<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusFlow | Secure Authentication</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/aws-sdk/2.1522.0/aws-sdk.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@6.3.7/dist/amazon-cognito-identity.min.js"></script>
    
    <script src="auth-config.js"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="header.css">

    <style>
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding-top: 100px; /* Uniform offset for header */
        }

        .auth-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            animation: slideUp 0.5s ease;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-cyan);
            padding: 40px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .auth-header h1 {
            font-size: 1.5rem;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            font-size: 0.7rem;
            text-transform: uppercase;
            color: var(--text-dim);
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 243, 255, 0.2);
            border-radius: 4px;
            color: #fff;
            outline: none;
            transition: all 0.3s;
        }

        .input-group input:focus {
            border-color: var(--accent);
            background: rgba(0, 243, 255, 0.05);
        }

        .btn-auth {
            width: 100%;
            padding: 14px;
            background: var(--accent);
            color: #000;
            border: none;
            border-radius: 4px;
            font-weight: 800;
            text-transform: uppercase;
            cursor: pointer;
            letter-spacing: 1px;
            margin-top: 10px;
        }

        #login-status {
            margin-top: 20px;
            padding: 12px;
            border-radius: 4px;
            font-size: 0.8rem;
            display: none;
            text-align: center;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>


<div class="auth-wrapper">
    <div class="login-card">
        <div class="auth-header">
            <h1 class="text-accent">IDENTITY_CHECK</h1>
            <p class="text-dim" style="font-size: 0.8rem;">Enter credentials to access the Nexus.</p>
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="input-group">
                <label>Operator Email</label>
                <input type="email" id="email" required placeholder="name@domain.com">
            </div>
            <div class="input-group">
                <label>Security Key</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>

            <button type="submit" class="btn-auth" id="loginBtn">Secure Sign In</button>
        </form>

        <div id="login-status"></div>

        <div style="margin-top: 25px; text-align: center; font-size: 0.8rem;">
            <span class="text-dim">New Operator?</span>
            <a href="registration.html" class="text-accent" style="text-decoration: none; margin-left: 5px;">Initialize Enrollment</a>
        </div>
    </div>
</div>

<script src="header.js"></script>
<script>
    const poolData = {
        UserPoolId: NEXUS_CONFIG.auth.UserPoolId,
        ClientId: NEXUS_CONFIG.auth.ClientId
    };
    const userPool = new AmazonCognitoIdentity.CognitoUserPool(poolData);
    const cognitoUser = userPool.getCurrentUser();

    // --- NEW: AUTO-REDIRECT IF ALREADY LOGGED IN ---
    if (cognitoUser) {
        cognitoUser.getSession((err, session) => {
            if (!err && session.isValid()) {
                window.location.href = 'profile.html';
            }
        });
    }

    function handleLogin(event) {
        event.preventDefault();
        
        const status = document.getElementById('login-status');
        const btn = document.getElementById('loginBtn');
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        btn.disabled = true;
        btn.innerText = "Authenticating...";
        status.style.display = "block";
        status.style.background = "rgba(255, 255, 255, 0.05)";
        status.innerText = "Verifying with AWS Cloud Security...";

        const authDetails = new AmazonCognitoIdentity.AuthenticationDetails({
            Username: email, Password: password
        });

        const user = new AmazonCognitoIdentity.CognitoUser({
            Username: email, Pool: userPool
        });

        user.authenticateUser(authDetails, {
            onSuccess: function(result) {
                const userEmail = result.getIdToken().payload.email;
                const fullName = result.getIdToken().payload.name || userEmail.split('@')[0];
                
                localStorage.setItem('nexusEmail', userEmail);
                localStorage.setItem('nexusUserFullname', fullName);

                status.style.color = "var(--accent)";
                status.style.background = "rgba(0, 243, 255, 0.1)";
                status.innerText = "✓ Access Granted. Redirecting...";
                
                setTimeout(() => { window.location.href = 'profile.html'; }, 800);
            },
            onFailure: function(err) {
                btn.disabled = false;
                btn.innerText = "Secure Sign In";
                status.style.color = "#ff4444";
                status.style.background = "rgba(255, 68, 68, 0.1)";
                status.innerText = "Error: " + (err.message || "Invalid credentials");
            }
        });
    }
</script>
</body>
</html>
