<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusFlow | Secure Authentication</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/aws-sdk/2.1522.0/aws-sdk.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@6.3.7/dist/amazon-cognito-identity.min.js"></script>
    
    <script src="auth-config.js"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="header.css">

    <style>
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding-top: 100px; /* Uniform offset for header */
        }

        .auth-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            animation: slideUp 0.5s ease;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-cyan);
            backdrop-filter: blur(10px);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .auth-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .auth-header h2 {
            font-size: 1.8rem;
            margin-bottom: 8px;
            font-family: 'JetBrains Mono', monospace;
        }

        #status {
            text-align: center;
            margin-top: 20px;
            font-size: 0.85rem;
            min-height: 20px;
            padding: 12px;
            border-radius: 6px;
            display: none;
            font-family: 'JetBrains Mono', monospace;
        }

        .form-footer {
            text-align: center;
            margin-top: 25px;
            font-size: 0.9rem;
            color: var(--text-dim);
        }

        .form-footer a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
        }

        /* Input styling to match the "Digital Flow" theme */
        input {
            margin-bottom: 15px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-cyan);
            color: white;
            padding: 12px;
            border-radius: 4px;
            width: 100%;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-dim);
        }
    </style>
</head>
<body>


<div class="auth-wrapper">
    <div class="card login-card">
        <div class="auth-header">
            <h2>Authorized <span class="text-accent">Access</span></h2>
            <p class="text-dim">Enter your credentials to manage your tech flow.</p>
        </div>

        <form id="loginForm">
            <label>Corporate / Personal Email</label>
            <input type="email" id="email" placeholder="name@company.com" required>
            
            <label>Password</label>
            <input type="password" id="password" placeholder="••••••••" required>
            
            <button type="submit" id="loginBtn" class="btn btn-primary" style="width: 100%; margin-top: 10px; font-size: 1rem;">
                Secure Sign In
            </button>
        </form>

        <div id="status"></div>

        <div class="form-footer">
            Don't have an account? <a href="registration.html">Create Access Profile</a>
        </div>
    </div>
</div>

<script src="header.js"></script>
<script>
    // Using NEXUS_CONFIG from auth-config.js for uniformity
    const userPool = new AmazonCognitoIdentity.CognitoUserPool({ 
        UserPoolId: NEXUS_CONFIG.auth.UserPoolId, 
        ClientId: NEXUS_CONFIG.auth.ClientId 
    });

    document.getElementById('loginForm').onsubmit = function(e) {
        e.preventDefault();
        const status = document.getElementById('status');
        const btn = document.getElementById('loginBtn');
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        btn.disabled = true;
        btn.innerText = "Authenticating...";
        status.style.display = "block";
        status.style.background = "rgba(255, 255, 255, 0.05)";
        status.innerText = "Verifying with AWS Cloud Security...";

        const authDetails = new AmazonCognitoIdentity.AuthenticationDetails({
            Username: email, Password: password
        });

        const cognitoUser = new AmazonCognitoIdentity.CognitoUser({
            Username: email, Pool: userPool
        });

        cognitoUser.authenticateUser(authDetails, {
            onSuccess: function(result) {
                status.style.color = "var(--accent)";
                status.style.background = "rgba(0, 243, 255, 0.1)";
                status.innerText = "✓ Access Granted. Redirecting...";
                
                setTimeout(() => { window.location.href = 'profile.html'; }, 800);
            },
            onFailure: function(err) {
                btn.disabled = false;
                btn.innerText = "Secure Sign In";
                status.style.color = "#ff4444";
                status.style.background = "rgba(255, 68, 68, 0.1)";
                status.innerText = err.message || "Authentication failed.";
            }
        });
    };
</script>
</body>
</html>
