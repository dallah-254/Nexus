<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NexusFlow | Secure Login</title>
    <script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@6.3.16/dist/amazon-cognito-identity.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 100%; max-width: 350px; }
        h2 { color: #232f3e; text-align: center; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%; }
        button:disabled { background: #ccc; }
        #status { color: #d9534f; font-size: 14px; text-align: center; margin-top: 15px; min-height: 20px; }
    </style>
</head>
<body>

<div class="login-card">
    <h2>NexusFlow Login</h2>
    <form id="loginForm">
        <input type="email" id="email" placeholder="Email Address" required>
        <input type="password" id="password" placeholder="Password" required>
        <button type="submit" id="loginBtn">Sign In</button>
    </form>
    <div id="status"></div>
</div>

<script>
    const poolData = { 
        UserPoolId: 'us-east-1_IK57zG64M', 
        ClientId: '668q6c6krjv8b6n81cfc78n9a4' 
    };
    const userPool = new AmazonCognitoIdentity.CognitoUserPool(poolData);

    document.getElementById('loginForm').onsubmit = function(e) {
        e.preventDefault();
        const status = document.getElementById('status');
        const btn = document.getElementById('loginBtn');
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        btn.disabled = true;
        status.style.color = "blue";
        status.innerText = "Authenticating with AWS...";

        const authDetails = new AmazonCognitoIdentity.AuthenticationDetails({
            Username: email, Password: password
        });

        const cognitoUser = new AmazonCognitoIdentity.CognitoUser({
            Username: email, Pool: userPool
        });

        cognitoUser.authenticateUser(authDetails, {
            onSuccess: function(result) {
                // 1. Success Verified
                console.log("Authentication successful.");
                
                // 2. Extract and Store Tokens
                const idToken = result.getIdToken().getJwtToken();
                localStorage.setItem('nexus_id_token', idToken);
                
                // 3. Redirect
                status.innerText = "Redirecting to profile...";
                setTimeout(() => { window.location.href = 'profile.html'; }, 500);
            },
            onFailure: function(err) {
                btn.disabled = false;
                status.style.color = "red";
                status.innerText = err.message || "Invalid credentials.";
            }
        });
    };
</script>
</body>
</html>
