<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus | Secure Sign In</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/aws-sdk/2.1522.0/aws-sdk.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@6.3.7/dist/amazon-cognito-identity.min.js"></script>
    
    <script src="auth-config.js"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="header.css">

    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-light: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }

        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background-color: var(--bg-light);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding-top: 80px; /* Offset for fixed header */
        }

        .auth-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
            animation: slideUp 0.5s ease-out;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 35px;
        }

        .auth-header h1 {
            font-size: 1.75rem;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }

        .auth-header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .input-group {
            margin-bottom: 24px;
        }

        .input-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        .input-group input {
            width: 100%;
            padding: 12px 16px;
            background: #fff;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
            transition: all 0.2s;
            box-sizing: border-box;
        }

        .input-group input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        }

        .btn-auth {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }

        .btn-auth:hover {
            background: var(--primary-hover);
        }

        .btn-auth:disabled {
            background: var(--text-muted);
            cursor: not-allowed;
        }

        #login-status {
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            display: none;
            text-align: center;
            font-weight: 500;
        }

        .status-loading { background: #f1f5f9; color: var(--text-muted); }
        .status-success { background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; }
        .status-error { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }

        .footer-links {
            margin-top: 30px;
            text-align: center;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .footer-links a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            margin-left: 5px;
        }

        .footer-links a:hover {
            text-decoration: underline;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="auth-wrapper">
    <div class="login-card">
        <div class="auth-header">
            <h1>Secure Sign In</h1>
            <p>Access your technical dashboard and inventory.</p>
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="input-group">
                <label>Email Address</label>
                <input type="email" id="email" required placeholder="e.g. name@company.com">
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" required placeholder="Enter your password">
            </div>

            <button type="submit" class="btn-auth" id="loginBtn">Sign In</button>
        </form>

        <div id="login-status"></div>

        <div class="footer-links">
            New to Nexus?
            <a href="registration.html">Create an Account</a>
        </div>
    </div>
</div>

<script src="header.js"></script>
<script>
    const poolData = {
        UserPoolId: NEXUS_CONFIG.auth.UserPoolId,
        ClientId: NEXUS_CONFIG.auth.ClientId
    };
    const userPool = new AmazonCognitoIdentity.CognitoUserPool(poolData);
    const cognitoUser = userPool.getCurrentUser();

    // Auto-redirect if already logged in
    if (cognitoUser) {
        cognitoUser.getSession((err, session) => {
            if (!err && session.isValid()) {
                window.location.href = 'profile.html';
            }
        });
    }

    function handleLogin(event) {
        event.preventDefault();
        
        const status = document.getElementById('login-status');
        const btn = document.getElementById('loginBtn');
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        btn.disabled = true;
        btn.innerText = "Authenticating...";
        
        status.className = "status-loading";
        status.style.display = "block";
        status.innerText = "Verifying credentials...";

        const authDetails = new AmazonCognitoIdentity.AuthenticationDetails({
            Username: email, Password: password
        });

        const user = new AmazonCognitoIdentity.CognitoUser({
            Username: email, Pool: userPool
        });

        user.authenticateUser(authDetails, {
            onSuccess: function(result) {
                const userEmail = result.getIdToken().payload.email;
                const fullName = result.getIdToken().payload.name || userEmail.split('@')[0];
                
                localStorage.setItem('nexusEmail', userEmail);
                localStorage.setItem('nexusUserFullname', fullName);

                status.className = "status-success";
                status.innerText = "✓ Access granted. Redirecting...";
                
                setTimeout(() => { window.location.href = 'profile.html'; }, 800);
            },
            onFailure: function(err) {
                btn.disabled = false;
                btn.innerText = "Sign In";
                status.className = "status-error";
                status.innerText = err.message || "Invalid email or password.";
            }
        });
    }
</script>
</body>
</html>
