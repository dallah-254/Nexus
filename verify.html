<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusFlow | Identity Verification</title>
    
    <script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@6.3.16/dist/amazon-cognito-identity.min.js"></script>
    <script src="auth-config.js"></script>
    
    <link rel="stylesheet" href="style.css">
    <style>
        .auth-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 70vh;
            padding: 20px;
        }

        .verify-card {
            max-width: 400px;
            width: 100%;
            text-align: center;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 40px;
            border-radius: 16px;
        }

        .code-input {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-cyan);
            color: var(--accent);
            font-family: 'JetBrains Mono', monospace;
            font-size: 2rem;
            letter-spacing: 8px;
            text-align: center;
            padding: 15px;
            margin: 25px 0;
            border-radius: 8px;
            width: 100%;
            box-sizing: border-box;
            outline: none;
        }

        .code-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.1);
        }

        #msg {
            margin-top: 20px;
            font-size: 0.85rem;
            padding: 12px;
            border-radius: 6px;
            display: none;
            font-family: 'JetBrains Mono', monospace;
        }

        .resend-link {
            display: inline-block;
            margin-top: 25px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .resend-link:hover {
            color: var(--accent);
        }

        .status-neutral { background: rgba(255,255,255,0.05); color: var(--text-secondary); }
        .status-success { background: rgba(16, 185, 129, 0.1); color: #10b981; }
        .status-danger { background: rgba(239, 68, 68, 0.1); color: #ef4444; }
    </style>
</head>
<body>

<nav class="navbar" style="justify-content: center;">
    <a href="index.html" class="logo">NEXUS<span style="color:white">FLOW</span></a>
</nav>

<div class="auth-container">
    <div class="verify-card">
        <div style="margin-bottom: 20px;">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"/>
                <path d="m9 12 2 2 4-4"/>
            </svg>
        </div>
        
        <h2 style="margin: 0; font-weight: 800;">Identity <span class="text-accent">Verification</span></h2>
        <p style="color: var(--text-dim); font-size: 0.85rem; margin-top: 10px; line-height: 1.5;" id="target-email">
            Initialising security handshake...
        </p>

        <input type="text" id="verificationCode" placeholder="000000" maxlength="6" class="code-input" autofocus>
        
        <button id="verifyBtn" class="btn btn-primary" style="width: 100%; padding: 16px; font-weight: bold;">
            CONFIRM ACTIVATION
        </button>

        <div id="msg"></div>

        <div onclick="resendCode()" class="resend-link">
            Protocol not received? <span style="text-decoration: underline;">Resend Signal</span>
        </div>
    </div>
</div>

<script>
    // Configuration pulled from auth-config.js
    const userPool = new AmazonCognitoIdentity.CognitoUserPool({
        UserPoolId: CONFIG.UserPoolId,
        ClientId: CONFIG.ClientId
    });
    
    const userEmail = localStorage.getItem('nexusEmail');

    window.onload = function() {
        if (!userEmail) {
            window.location.href = 'registration.html';
            return;
        }
        document.getElementById('target-email').innerText = `Enter the 6-digit sequence transmitted to: ${userEmail}`;
    };

    document.getElementById('verifyBtn').onclick = function() {
        const code = document.getElementById('verificationCode').value;
        const btn = document.getElementById('verifyBtn');

        if (code.length < 6) {
            showStatus("Sequence incomplete. 6 digits required.", "status-danger");
            return;
        }

        btn.disabled = true;
        showStatus("Synchronizing identity with Central Command...", "status-neutral");

        const cognitoUser = new AmazonCognitoIdentity.CognitoUser({
            Username: userEmail,
            Pool: userPool
        });

        cognitoUser.confirmRegistration(code, true, function(err, result) {
            if (err) {
                showStatus(err.message || "Verification failed.", "status-danger");
                btn.disabled = false;
                return;
            }
            
            showStatus("Identity confirmed. Redirecting to terminal...", "status-success");
            setTimeout(() => { window.location.href = 'login.html'; }, 2000);
        });
    };

    function resendCode() {
        const cognitoUser = new AmazonCognitoIdentity.CognitoUser({
            Username: userEmail,
            Pool: userPool
        });
        
        cognitoUser.resendConfirmationCode(function(err, result) {
            if (err) {
                showStatus(err.message, "status-danger");
            } else {
                showStatus("New verification protocol transmitted.", "status-success");
            }
        });
    }

    function showStatus(text, className) {
        const msg = document.getElementById('msg');
        msg.style.display = "block";
        msg.className = ''; // reset
        msg.classList.add(className);
        msg.innerText = text;
    }
</script>

</body>
</html>
