<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Identity | Nexus</title>
    
    <script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@6.3.16/dist/amazon-cognito-identity.min.js"></script>
    <script src="auth-config.js"></script>
    
    <link rel="stylesheet" href="style.css">
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-light: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }

        body { 
            background: var(--bg-light); 
            color: var(--text-main); 
            font-family: 'Inter', sans-serif; 
            margin: 0; 
        }

        .auth-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .verify-card {
            max-width: 440px;
            width: 100%;
            text-align: center;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 50px 40px;
            border-radius: 24px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05);
        }

        .code-input {
            background: var(--bg-light);
            border: 2px solid var(--border-color);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: 12px;
            text-align: center;
            padding: 15px;
            margin: 30px 0;
            border-radius: 12px;
            width: 100%;
            box-sizing: border-box;
            outline: none;
            transition: all 0.2s;
        }

        .code-input:focus {
            border-color: var(--primary);
            background: white;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        }

        .code-input::placeholder {
            letter-spacing: normal;
            font-size: 1rem;
            font-weight: 400;
            color: var(--text-muted);
        }

        #msg {
            margin-top: 20px;
            font-size: 0.9rem;
            font-weight: 600;
            padding: 14px;
            border-radius: 10px;
            display: none;
        }

        .resend-link {
            display: inline-block;
            margin-top: 30px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .resend-link span {
            color: var(--primary);
            text-decoration: underline;
        }

        .resend-link:hover span {
            color: var(--primary-hover);
        }

        .btn-verify {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 18px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-verify:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        .btn-verify:disabled {
            background: var(--text-muted);
            cursor: not-allowed;
            transform: none;
        }

        .status-neutral { background: #f1f5f9; color: #475569; }
        .status-success { background: #ecfdf5; color: #059669; }
        .status-danger { background: #fef2f2; color: #dc2626; }

        .logo-box {
            font-weight: 900;
            font-size: 1.5rem;
            letter-spacing: -1px;
            margin-bottom: 40px;
            display: inline-block;
            text-decoration: none;
            color: var(--text-main);
        }
    </style>
</head>
<body>

<div class="auth-container">
    <div class="verify-card">
        <a href="index.html" class="logo-box">NEXUS<span style="color:var(--primary)">.</span></a>
        
        <h2 style="margin: 0; font-weight: 800; font-size: 1.75rem;">Account Verification</h2>
        <p style="color: var(--text-muted); font-size: 0.95rem; margin-top: 12px; line-height: 1.5;" id="target-email">
            Authenticating security protocols...
        </p>

        <input type="text" id="verificationCode" placeholder="Enter 6-digit code" maxlength="6" class="code-input" autofocus autocomplete="off">
        
        <button id="verifyBtn" class="btn-verify">
            Verify & Activate Account
        </button>

        <div id="msg"></div>

        <div onclick="resendCode()" class="resend-link">
            Didn't receive the code? <span>Resend code</span>
        </div>
    </div>
</div>

<script>
    const userPool = new AmazonCognitoIdentity.CognitoUserPool({
        UserPoolId: CONFIG.UserPoolId,
        ClientId: CONFIG.ClientId
    });
    
    const userEmail = localStorage.getItem('nexusEmail');

    window.onload = function() {
        if (!userEmail) {
            window.location.href = 'registration.html';
            return;
        }
        document.getElementById('target-email').innerHTML = `We sent a 6-digit verification code to <br><strong>${userEmail}</strong>`;
    };

    document.getElementById('verifyBtn').onclick = function() {
        const code = document.getElementById('verificationCode').value;
        const btn = document.getElementById('verifyBtn');

        if (code.length < 6) {
            showStatus("Please enter the full 6-digit code.", "status-danger");
            return;
        }

        btn.disabled = true;
        showStatus("Validating with security server...", "status-neutral");

        const cognitoUser = new AmazonCognitoIdentity.CognitoUser({
            Username: userEmail,
            Pool: userPool
        });

        cognitoUser.confirmRegistration(code, true, function(err, result) {
            if (err) {
                showStatus(err.message || "Invalid verification code.", "status-danger");
                btn.disabled = false;
                return;
            }
            
            showStatus("Success! Your account is active.", "status-success");
            setTimeout(() => { window.location.href = 'login.html'; }, 2000);
        });
    };

    function resendCode() {
        const cognitoUser = new AmazonCognitoIdentity.CognitoUser({
            Username: userEmail,
            Pool: userPool
        });
        
        cognitoUser.resendConfirmationCode(function(err, result) {
            if (err) {
                showStatus(err.message, "status-danger");
            } else {
                showStatus("A new verification code has been sent.", "status-success");
            }
        });
    }

    function showStatus(text, className) {
        const msg = document.getElementById('msg');
        msg.style.display = "block";
        msg.className = ''; 
        msg.classList.add(className);
        msg.innerText = text;
    }
</script>

</body>
</html>
