<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusFlow | Transmission Successful</title>
    
    <link rel="stylesheet" href="style.css">
    <script src="auth-config.js"></script>
    
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: radial-gradient(circle at center, #0a0a0a 0%, #000 100%);
            margin: 0;
            padding: 20px;
        }

        .success-wrapper {
            max-width: 500px;
            width: 100%;
            text-align: center;
            animation: fadeIn 0.8s ease-out;
        }

        .success-icon {
            font-size: 4rem;
            color: var(--accent);
            margin-bottom: 20px;
            filter: drop-shadow(0 0 15px var(--accent-glow));
        }

        .status-header {
            text-transform: uppercase;
            letter-spacing: 4px;
            font-size: 0.8rem;
            color: var(--accent);
            margin-bottom: 10px;
        }

        /* Technical Data Grid */
        .receipt-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-cyan);
            border-radius: 12px;
            padding: 30px;
            margin: 30px 0;
            text-align: left;
            position: relative;
        }

        .receipt-card::before {
            content: "SECURE LOG";
            position: absolute;
            top: -10px;
            right: 20px;
            background: var(--bg);
            padding: 0 10px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            color: var(--text-dim);
        }

        .data-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .data-row:last-child { border: none; margin: 0; padding: 0; }

        .label {
            color: var(--text-secondary);
            font-size: 0.75rem;
            text-transform: uppercase;
            font-weight: 700;
        }

        .value {
            font-family: 'JetBrains Mono', monospace;
            color: #fff;
            font-size: 0.9rem;
        }

        .footer-note {
            color: var(--text-dim);
            font-size: 0.8rem;
            margin-top: 20px;
        }

        .action-btns {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        .btn { width: 100%; }

        /* Animation for the checkmark */
        .checkmark-circle {
            width: 80px;
            height: 80px;
            border: 3px solid var(--accent);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 25px;
            box-shadow: 0 0 20px var(--accent-glow);
        }
    </style>
</head>
<body>

<div class="success-wrapper">
    <div class="checkmark-circle">
        <span style="font-size: 2.5rem;">✓</span>
    </div>
    
    <div class="status-header">Transmission Received</div>
    <h1>Request <span class="text-accent">Confirmed</span></h1>
    
    <div class="receipt-card">
        <div class="data-row">
            <span class="label">Booking ID</span>
            <span class="value" id="disp-id">#NX-0000</span>
        </div>
        <div class="data-row">
            <span class="label">Component</span>
            <span class="value" id="disp-device">Hardware Unit</span>
        </div>
        <div class="data-row">
            <span class="label">Priority</span>
            <span class="value" style="color: var(--warning);">Urgent Diagnostic</span>
        </div>
        <div class="data-row">
            <span class="label">Deployment</span>
            <span class="value" id="disp-date">Pending Sync</span>
        </div>
    </div>

    <p class="footer-note">A technician has been assigned to your case. Check your profile for real-time status updates.</p>

    <div class="action-btns">
        <a href="index.html" class="btn btn-outline">Return Home</a>
        <a href="profile.html" class="btn btn-primary">Go to Profile</a>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        // Retrieve the data saved by the previous page
        const bookingData = JSON.parse(sessionStorage.getItem('lastBooking'));

        if (bookingData) {
            document.getElementById('disp-id').innerText = `#${bookingData.id}`;
            document.getElementById('disp-device').innerText = bookingData.device;
            document.getElementById('disp-date').innerText = bookingData.date || 'Scheduled';
        } else {
            // If someone lands here without a booking, redirect them
            window.location.href = 'index.html';
        }

        // Clean up session storage after display if desired, 
        // or keep it so they can refresh the page.
    });
</script>

</body>
</html>
