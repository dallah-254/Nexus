<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusFlow | Service Catalog</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/aws-sdk/2.1522.0/aws-sdk.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@6.3.7/dist/amazon-cognito-identity.min.js"></script>
    <script src="auth-config.js"></script>
    
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="header.css">
    <style>
        .page-header {
            text-align: center;
            padding: 80px 20px 40px 20px;
            background: linear-gradient(to bottom, rgba(0, 243, 255, 0.05), transparent);
        }

        .service-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 25px;
            margin-bottom: 50px;
            padding: 20px;
        }

        .service-card {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 25px;
            border-radius: 16px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .service-card:hover {
            border-color: var(--accent);
            transform: translateY(-8px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
            background: rgba(255, 255, 255, 0.04);
        }

        /* The accent border animation */
        .service-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 0;
            background: var(--accent);
            transition: height 0.3s ease;
        }

        .service-card:hover::before {
            height: 100%;
        }

        .category-pill {
            display: inline-block;
            font-size: 0.7rem;
            font-weight: 800;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 12px;
            font-family: 'JetBrains Mono', monospace;
        }

        .service-name {
            font-size: 1.4rem;
            margin: 0 0 15px 0;
            color: var(--text-primary);
        }

        .service-desc {
            color: var(--text-secondary);
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 25px;
            flex-grow: 1;
        }

        .price-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .price-label {
            font-size: 0.7rem;
            color: var(--text-secondary);
            display: block;
            text-transform: uppercase;
        }

        .price-amount {
            font-size: 1.3rem;
            font-weight: 700;
            color: white;
        }

        #loading-state {
            text-align: center;
            padding: 100px 0;
            grid-column: 1 / -1;
        }

        .btn-initialize {
            background: transparent;
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 10px 20px;
            border-radius: 4px;
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: bold;
            transition: 0.3s;
            font-family: 'JetBrains Mono', monospace;
        }

        .btn-initialize:hover {
            background: var(--accent);
            color: black;
        }
    </style>
</head>
<body>

<div id="nexus-header-wrapper"></div>

<header class="page-header">
    <div class="container">
        <h1 style="font-size: 3.5rem; margin-bottom: 10px; font-weight: 800;">Service <span style="color:var(--accent)">Protocols</span></h1>
        <p style="color: var(--text-secondary); font-size: 1.1rem; max-width: 600px; margin: 0 auto;">Precision repair solutions for mission-critical hardware deployments.</p>
    </div>
</header>

<div class="container">
    <div id="service-list" class="service-grid">
        <div id="loading-state">
            <h3 style="color: var(--text-secondary); font-family: 'JetBrains Mono', monospace;">> SCANNIG_SERVICE_DATABASE...</h3>
        </div>
    </div>
</div>

<script src="header.js"></script>
<script>
    const API_URL = 'https://yskkdnff93.execute-api.us-east-1.amazonaws.com/prod/Services';

    window.onload = async function() {
        try {
            const res = await fetch(API_URL);
            const services = await res.json();
            const container = document.getElementById('service-list');

            if (!services || services.length === 0) {
                container.innerHTML = "<div id='loading-state'><h3>No active service protocols found.</h3></div>";
                return;
            }

            container.innerHTML = services.map(s => `
                <div class="service-card">
                    <div>
                        <span class="category-pill">${s.category || 'Maintenance'}</span>
                        <h3 class="service-name">${s.serviceName}</h3>
                        <p class="service-desc">${s.shortDescription}</p>
                    </div>
                    
                    <div class="price-footer">
                        <div>
                            <span class="price-label">Baseline</span>
                            <span class="price-amount">$${parseFloat(s.basePrice).toFixed(2)}</span>
                        </div>
                        <a href="service-details.html?id=${s.serviceId}" class="btn-initialize">INITIALIZE</a>
                    </div>
                </div>
            `).join('');
        } catch (err) {
            document.getElementById('service-list').innerHTML = `
                <div id='loading-state'>
                    <h3 style='color:var(--danger)'>FATAL_ERROR: Hardware interface not responding.</h3>
                    <p style="color:var(--text-secondary)">Please check your network uplink.</p>
                </div>`;
        }
    };
</script>

</body>
</html>
