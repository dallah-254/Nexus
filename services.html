<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus | Technical Service Hub</title>
    
    <script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@6.3.7/dist/amazon-cognito-identity.min.js"></script>
    <script src="auth-config.js"></script>
    <script src="header.js" defer></script>
    <script src="footer.js" defer></script>
    <link rel="stylesheet" href="style.css">
    
    <style>
        :root { 
            --primary: #2563eb; 
            --bg: #f8fafc; 
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0; 
        }
        
        body { 
            background: var(--bg); 
            color: var(--text-main); 
            font-family: 'Inter', sans-serif; 
            padding-top: 110px; /* Tightest spacing yet */
            margin: 0; 
        }

        .container { max-width: 1200px; margin: 0 auto; padding: 15px; }

        /* --- CATEGORY TABS --- */
        .tabs-container {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 10px 0;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border);
            scrollbar-width: none; /* Hide scrollbar Firefox */
        }
        .tabs-container::-webkit-scrollbar { display: none; } /* Hide scrollbar Chrome */

        .cat-tab {
            padding: 8px 16px;
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 50px;
            white-space: nowrap;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-muted);
            transition: 0.2s;
        }
        .cat-tab.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
            box-shadow: 0 4px 10px rgba(37, 99, 235, 0.2);
        }

        /* --- ULTRA COMPACT GRID (50% Smaller) --- */
        .nexus-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); /* Half the size of previous 320px */
            gap: 12px; 
        }
        
        .service-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            text-decoration: none;
            color: inherit;
        }

        .service-card:hover {
            transform: translateY(-3px);
            border-color: var(--primary);
        }

        .service-tag {
            font-size: 0.55rem;
            color: var(--primary);
            text-transform: uppercase;
            font-weight: 800;
            margin-bottom: 4px;
        }

        .service-name {
            font-size: 0.8rem; /* Smaller Font */
            font-weight: 700;
            margin: 0 0 8px 0;
            line-height: 1.2;
            height: 2.4em; /* Max 2 lines */
            overflow: hidden;
        }

        .service-footer {
            margin-top: auto;
            padding-top: 8px;
            border-top: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .price { font-weight: 800; color: var(--text-main); font-size: 0.9rem; }
        .price span { font-size: 0.6rem; color: var(--text-muted); display: block; }

        .btn-book {
            font-size: 0.65rem;
            font-weight: 700;
            color: var(--primary);
            text-align: right;
        }

        #loader { text-align: center; padding: 50px; font-size: 0.8rem; color: var(--text-muted); }
    </style>
</head>
<body>

    <div id="nexus-header-wrapper"></div>

    <main class="container">
        <div id="category-tabs" class="tabs-container">
            </div>

        <div id="loader">Syncing database...</div>
        <div id="service-display-area" class="nexus-grid"></div>
    </main>

    <footer id="nexus-footer-wrapper"></footer>

    <script>
        let rawData = [];
        let categories = [];
        let currentCategory = 'ALL';

        async function load() {
            try {
                const res = await fetch(`${NEXUS_CONFIG.api.baseUrl}/services`);
                rawData = await res.json();
                
                // Extract unique categories
                categories = ['ALL', ...new Set(rawData.map(s => s.serviceCategory || "General"))];
                
                document.getElementById('loader').style.display = 'none';
                renderTabs();
                renderServices();
            } catch (e) {
                document.getElementById('loader').innerHTML = "Database Connection Offline";
            }
        }

        function renderTabs() {
            const container = document.getElementById('category-tabs');
            container.innerHTML = categories.map(cat => `
                <div class="cat-tab ${currentCategory === cat ? 'active' : ''}" 
                     onclick="filterCategory('${cat}')">
                    ${cat}
                </div>
            `).join('');
        }

        function filterCategory(cat) {
            currentCategory = cat;
            renderTabs(); // Update active state
            renderServices();
        }

        function renderServices() {
            const container = document.getElementById('service-display-area');
            const filteredData = currentCategory === 'ALL' 
                ? rawData 
                : rawData.filter(s => (s.serviceCategory || "General") === currentCategory);

            container.innerHTML = filteredData.map(s => `
                <a href="service-details.html?id=${s.serviceId}" class="service-card">
                    <div class="service-tag">#${s.serviceId.substring(0,8)}</div>
                    <h3 class="service-name">${s.serviceName}</h3>
                    
                    <div class="service-footer">
                        <div class="price">
                            <span>Starting at</span>
                            $${parseFloat(s.basePrice || 0).toFixed(2)}
                        </div>
                        <span class="btn-book">Details <i class="fa-solid fa-arrow-right"></i></span>
                    </div>
                </a>
            `).join('');
        }

        window.onload = load;
    </script>
</body>
</html>
