<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusFlow | Service Hub</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/aws-sdk/2.1522.0/aws-sdk.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@6.3.7/dist/amazon-cognito-identity.min.js"></script>
    <script src="auth-config.js"></script>
    <script src="header.js" defer></script>
    
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="header.css">
    <style>
        :root {
            --n-cyan: #00f3ff;
            --n-bg: #0a0a0a;
            --n-border: rgba(0, 243, 255, 0.2);
            --n-panel: rgba(255, 255, 255, 0.03);
        }

        body { 
            background: var(--n-bg); 
            color: white; 
            margin: 0; 
            font-family: 'Inter', sans-serif; 
            padding-top: 100px; 
            scroll-behavior: smooth; 
        }

        .container { max-width: 1400px; margin: 0 auto; padding: 0 20px; }

        /* Page Header */
        .page-header {
            text-align: center;
            padding: 40px 20px;
        }

        .page-header h1 {
            font-family: 'JetBrains Mono', monospace;
            font-size: 2rem;
            letter-spacing: 4px;
            color: var(--n-cyan);
            margin: 0;
        }

        /* 2-Row Category Grid Navigation */
        .category-menu-container {
            background: var(--n-panel);
            border: 1px solid var(--n-border);
            padding: 20px;
            margin-bottom: 50px;
            border-radius: 8px;
        }

        .category-grid-nav {
            display: grid;
            /* Creates 5 columns on desktop, wrapping to 2 rows for 10 categories */
            grid-template-columns: repeat(5, 1fr); 
            gap: 10px;
        }

        .nav-tab {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--n-border);
            color: #888;
            padding: 12px 5px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            text-transform: uppercase;
            text-align: center;
            cursor: pointer;
            transition: 0.3s ease;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .nav-tab.active, .nav-tab:hover {
            color: var(--n-cyan);
            border-color: var(--n-cyan);
            background: rgba(0, 243, 255, 0.1);
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.15);
        }

        /* Responsive rows */
        @media (max-width: 1024px) { .category-grid-nav { grid-template-columns: repeat(3, 1fr); } }
        @media (max-width: 600px) { .category-grid-nav { grid-template-columns: repeat(2, 1fr); } }

        /* Service Cards */
        .service-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 60px;
        }

        .category-group-section {
            margin-bottom: 80px;
            scroll-margin-top: 120px;
        }

        .section-label {
            font-family: 'JetBrains Mono', monospace;
            color: var(--n-cyan);
            font-size: 1.2rem;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .section-label::after {
            content: "";
            flex-grow: 1;
            height: 1px;
            background: linear-gradient(to right, var(--n-border), transparent);
        }

        .service-card {
            background: var(--n-panel);
            border: 1px solid var(--n-border);
            padding: 25px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: 0.3s;
        }

        .service-card:hover {
            border-color: var(--n-cyan);
            background: rgba(255, 255, 255, 0.05);
        }

        .service-name { font-family: 'JetBrains Mono'; font-size: 1rem; margin: 0 0 10px 0; }
        .service-desc { font-size: 0.85rem; color: #aaa; line-height: 1.5; margin-bottom: 20px; }
        
        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 15px;
            border-top: 1px solid rgba(255,255,255,0.05);
        }

        .price-tag { color: var(--n-cyan); font-weight: bold; font-family: 'JetBrains Mono'; }
        .btn-init { background: #fff; color: #000; padding: 8px 15px; text-decoration: none; font-size: 0.7rem; font-weight: 900; }

        .hidden { display: none; }
        #loading-state { text-align: center; padding: 100px; font-family: 'JetBrains Mono'; color: var(--n-cyan); }
    </style>
</head>
<body>

<div id="nexus-header-wrapper"></div>


<main class="container">
    <div class="category-menu-container">
        <nav class="category-grid-nav" id="tab-bar">
            <a href="javascript:void(0)" class="nav-tab active" onclick="showView('all')">ALL_PROTOCOLS</a>
            </nav>
    </div>

    <div id="loading-state">SYNCHRONIZING_DATA_STREAM...</div>

    <div id="view-all" class="service-grid"></div>

    <div id="view-categorized" class="hidden"></div>
</main>

<script>
    const ORIGINAL_API = 'https://yskkdnff93.execute-api.us-east-1.amazonaws.com/prod/Services';
    const CATEGORY_API = 'https://yskkdnff93.execute-api.us-east-1.amazonaws.com/prod/service-categories';

    async function initPage() {
        try {
            const [resAll, resCat] = await Promise.all([
                fetch(ORIGINAL_API),
                fetch(CATEGORY_API)
            ]);

            const allData = await resAll.json();
            const catData = await resCat.json();

            document.getElementById('loading-state').style.display = 'none';
            renderAll(allData);
            renderCategorized(catData);
        } catch (err) {
            document.getElementById('loading-state').innerHTML = "UPLINK_ERROR: Check Backend Status";
        }
    }

    function renderAll(data) {
        document.getElementById('view-all').innerHTML = data.map(s => createCard(s)).join('');
    }

    function renderCategorized(data) {
        const container = document.getElementById('view-categorized');
        const tabBar = document.getElementById('tab-bar');

        const groups = data.reduce((acc, item) => {
            const cat = item.serviceCategory || "General";
            if (!acc[cat]) acc[cat] = [];
            acc[cat].push(item);
            return acc;
        }, {});

        Object.keys(groups).forEach(catName => {
            // Add Tab to the Grid
            const tab = document.createElement('a');
            tab.className = 'nav-tab';
            tab.innerText = catName;
            tab.onclick = (e) => {
                document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
                e.currentTarget.classList.add('active');
                showView(catName);
            };
            tabBar.appendChild(tab);

            // Add Section
            const section = document.createElement('div');
            section.id = `section-${catName.replace(/\s+/g, '-')}`;
            section.className = 'category-group-section hidden';
            section.innerHTML = `
                <div class="section-label">${catName}</div>
                <div class="service-grid">${groups[catName].map(s => createCard(s)).join('')}</div>
            `;
            container.appendChild(section);
        });
    }

    function createCard(s) {
        const name = s.serviceName || s.name || "Unknown";
        const price = s.basePrice || s.price || 0;
        const id = s.serviceId || s.productId;
        return `
            <div class="service-card">
                <div>
                    <h3 class="service-name">${name}</h3>
                    <p class="service-desc">${s.shortDescription || s.description || ''}</p>
                </div>
                <div class="card-footer">
                    <span class="price-tag">$${parseFloat(price).toFixed(2)}</span>
                    <a href="service-details.html?id=${id}" class="btn-init">INITIALIZE</a>
                </div>
            </div>`;
    }

    function showView(target) {
        const viewAll = document.getElementById('view-all');
        const viewCat = document.getElementById('view-categorized');
        
        if (target === 'all') {
            viewAll.classList.remove('hidden');
            viewCat.classList.add('hidden');
        } else {
            viewAll.classList.add('hidden');
            viewCat.classList.remove('hidden');
            document.querySelectorAll('.category-group-section').forEach(sec => sec.classList.add('hidden'));
            document.getElementById(`section-${target.replace(/\s+/g, '-')}`).classList.remove('hidden');
        }
    }

    window.onload = initPage;
</script>

</body>
</html>
