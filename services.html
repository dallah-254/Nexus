<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusFlow | Service Intelligence</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/aws-sdk/2.1522.0/aws-sdk.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@6.3.7/dist/amazon-cognito-identity.min.js"></script>
    
    <script src="auth-config.js"></script>
    <script src="header.js" defer></script>
    <link rel="stylesheet" href="style.css">
    
    <style>
        :root { 
            --accent: #00f3ff; 
            --bg: #0a0a0a; 
            --panel: rgba(255,255,255,0.03); 
            --border: rgba(0,243,255,0.15); 
        }
        
        body { background: var(--bg); color: white; font-family: 'Inter', sans-serif; padding-top: 140px; margin: 0; }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }

        /* --- CONTROL PANEL (Search + Filter) --- */
        .control-panel {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 50px;
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 20px;
            align-items: center;
        }

        .search-box { position: relative; }
        .service-search-input {
            width: 100%;
            background: #000;
            border: 1px solid rgba(255,255,255,0.1);
            padding: 15px 20px 15px 45px;
            border-radius: 8px;
            color: var(--accent);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            outline: none;
            transition: 0.3s;
        }
        .service-search-input:focus { border-color: var(--accent); box-shadow: 0 0 15px rgba(0,243,255,0.1); }
        .search-icon { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #444; }

        /* --- CATEGORY SECTIONING --- */
        .category-block { margin-bottom: 60px; }
        .category-title {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.2rem;
            letter-spacing: 2px;
            color: #fff;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .category-title::after {
            content: "";
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, var(--border), transparent);
        }

        /* --- SERVICE CARDS (Marketing Optimized) --- */
        .nexus-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 25px; }
        
        .service-card {
            background: var(--panel);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 24px;
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            text-decoration: none;
            color: inherit;
        }

        .service-card:hover {
            background: rgba(0, 243, 255, 0.03);
            border-color: var(--accent);
            transform: translateY(-5px);
        }

        .service-tag {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.65rem;
            color: var(--accent);
            text-transform: uppercase;
            margin-bottom: 12px;
            opacity: 0.8;
        }

        .service-name {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.1rem;
            margin: 0 0 15px 0;
            line-height: 1.3;
        }

        .activity-preview {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 20px;
        }

        .pill {
            font-size: 0.65rem;
            background: rgba(255,255,255,0.05);
            padding: 4px 10px;
            border-radius: 4px;
            color: #aaa;
        }

        .service-footer {
            margin-top: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 15px;
            border-top: 1px solid rgba(255,255,255,0.05);
        }

        .price { font-weight: 700; color: #fff; }
        .price span { font-size: 0.7rem; color: #666; font-weight: 400; margin-right: 4px; }

        .init-link {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            color: var(--accent);
            text-decoration: underline;
        }

        #loader { text-align: center; padding: 100px; font-family: 'JetBrains Mono'; color: var(--accent); }
    </style>
</head>
<body>

    <div id="nexus-header-wrapper"></div>

    <main class="container">
        <div class="control-panel">
            <div class="search-box">
                <span class="search-icon">⚡</span>
                <input type="text" id="serviceSearch" class="service-search-input" 
                       placeholder="SCAN_SYSTEM_PROTOCOLS..." oninput="handleSearch()">
            </div>
            <div id="status-tag" style="font-family: 'JetBrains Mono'; font-size: 0.7rem; color: #444;">
                SYSTEM_STABLE // DATA_SYNCED
            </div>
        </div>

        <div id="loader">ACCESSING_CENTRAL_REGISTRY...</div>
        <div id="service-display-area"></div>
    </main>

    <script>
        let rawData = [];

        async function load() {
            try {
                const res = await fetch(`${NEXUS_CONFIG.api.baseUrl}/services`);
                rawData = await res.json();
                document.getElementById('loader').style.display = 'none';
                renderCategorized(rawData);
            } catch (e) {
                document.getElementById('loader').innerHTML = `<span style="color:#ff4444">LINK_FAILURE</span>`;
            }
        }

        function handleSearch() {
            const query = document.getElementById('serviceSearch').value.toLowerCase();
            const filtered = rawData.filter(s => 
                s.serviceName.toLowerCase().includes(query) || 
                (s.serviceCategory && s.serviceCategory.toLowerCase().includes(query))
            );
            renderCategorized(filtered);
        }

        function renderCategorized(data) {
            const container = document.getElementById('service-display-area');
            container.innerHTML = '';

            // Grouping logic
            const groups = data.reduce((acc, item) => {
                const cat = item.serviceCategory || "GENERAL_OPERATIONS";
                if (!acc[cat]) acc[cat] = [];
                acc[cat].push(item);
                return acc;
            }, {});

            for (const [category, services] of Object.entries(groups)) {
                const section = document.createElement('div');
                section.className = 'category-block';
                
                // Only show 10 if we're not searching, otherwise show all matches
                const isSearching = document.getElementById('serviceSearch').value.length > 0;
                const displayItems = isSearching ? services : services.slice(0, 10);

                section.innerHTML = `
                    <div class="category-title">${category.toUpperCase()}</div>
                    <div class="nexus-grid">
                        ${displayItems.map(s => renderServiceCard(s)).join('')}
                    </div>
                `;
                container.appendChild(section);
            }
        }

        function renderServiceCard(s) {
            const activities = s.activities ? s.activities.slice(0, 3).map(a => `<span class="pill">${a}</span>`).join('') : '';
            return `
                <a href="service-details.html?id=${s.serviceId}" class="service-card">
                    <div class="service-tag">${s.serviceId}</div>
                    <h3 class="service-name">${s.serviceName}</h3>
                    
                    <div class="activity-preview">
                        ${activities}
                    </div>

                    <div class="service-footer">
                        <div class="price"><span>FROM</span>$${parseFloat(s.basePrice || 0).toFixed(2)}</div>
                        <span class="init-link">INITIALIZE_UNIT</span>
                    </div>
                </a>
            `;
        }

        window.onload = load;
    </script>
</body>
</html>
