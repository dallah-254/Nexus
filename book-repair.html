<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus | Book a Repair</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/aws-sdk/2.1522.0/aws-sdk.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@6.3.7/dist/amazon-cognito-identity.min.js"></script>
    
    <script src="auth-config.js"></script>
    <link rel="stylesheet" href="style.css"> 
    <link rel="stylesheet" href="header.css">
    
    <style>
        body { padding-top: 100px; background-color: #f8fafc; } /* Light Nexus Background */

        #main-content { display: none; }

        .repair-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        .form-section { margin-bottom: 40px; }

        .section-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 10px;
        }

        .step-number {
            background: var(--primary); /* Royal Blue */
            color: #fff;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.85rem;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .full-width { grid-column: span 2; }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.85rem;
            color: #475569;
            font-weight: 600;
        }

        input, select, textarea {
            width: 100%;
            background: #ffffff;
            border: 1px solid #cbd5e1;
            color: #1e293b;
            padding: 12px;
            border-radius: 8px;
            font-family: inherit;
        }

        input:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1); }

        .checkbox-group {
            display: flex;
            gap: 30px;
            background: #f1f5f9;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
        }

        .check-item {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            font-size: 0.95rem;
            color: #334155;
        }

        .check-item input { width: auto; margin: 0; }

        #msg-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(4px);
            z-index: 20000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            color: var(--primary);
        }

        .brand-name {
            font-weight: 800;
            font-size: 1.5rem;
            color: var(--dark);
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

<div id="nexus-header-wrapper"></div>

<div id="main-content" class="repair-container">
    <div style="margin-bottom: 50px;">
        <h1 style="font-size: 2.5rem; color: var(--dark);">Device <span style="color:var(--primary)">Repair Service</span></h1>
        <p style="color: #64748b;">Schedule a professional diagnostic and repair for your device.</p>
    </div>

    <div class="card">
        <form id="repairForm">
            <div class="form-section">
                <div class="section-header">
                    <div class="step-number">1</div>
                    <h3 style="font-size: 1.1rem; color: var(--dark);">Device Details</h3>
                </div>
                <div class="grid">
                    <div>
                        <label>Device Type</label>
                        <select id="deviceType" required>
                            <option value="Smartphone">Smartphone</option>
                            <option value="Laptop">Laptop</option>
                            <option value="Gaming Console">Gaming Console</option>
                            <option value="Other">Other Electronics</option>
                        </select>
                    </div>
                    <div>
                        <label>Manufacturer</label>
                        <input type="text" id="brand" placeholder="e.g. Apple, Samsung, HP" required>
                    </div>
                    <div>
                        <label>Model Name/Number</label>
                        <input type="text" id="model" placeholder="e.g. iPhone 15, MacBook Pro" required>
                    </div>
                    <div>
                        <label>Serial Number (Optional)</label>
                        <input type="text" id="serialNumber" placeholder="For warranty verification">
                    </div>
                </div>
            </div>

            <div class="form-section">
                <div class="section-header">
                    <div class="step-number">2</div>
                    <h3 style="font-size: 1.1rem; color: var(--dark);">Issue Description</h3>
                </div>
                <label>Problem Description</label>
                <textarea id="issueDescription" rows="4" placeholder="Please describe the issue you are experiencing..." required></textarea>
                
                <div class="checkbox-group" style="margin-top: 15px;">
                    <label class="check-item">
                        <input type="checkbox" id="liquidDamage"> Liquid Damage
                    </label>
                    <label class="check-item">
                        <input type="checkbox" id="previousRepair"> Previously Repaired Elsewhere
                    </label>
                </div>
            </div>

            <div class="form-section">
                <div class="section-header">
                    <div class="step-number">3</div>
                    <h3 style="font-size: 1.1rem; color: var(--dark);">Logistics & Schedule</h3>
                </div>
                <div class="grid">
                    <div class="full-width">
                        <label>Pickup Address</label>
                        <input type="text" id="pickupAddress" placeholder="Street name, Building, Apartment number" required>
                    </div>
                    <div>
                        <label>City</label>
                        <input type="text" id="city" placeholder="e.g. Nairobi" required>
                    </div>
                    <div>
                        <label>Preferred Date</label>
                        <input type="date" id="bookingDate" required>
                    </div>
                </div>
            </div>

            <button type="submit" id="submitBtn" class="btn btn-primary" style="width: 100%; margin-top: 20px; height: 55px; font-size: 1.1rem;">
                Confirm Repair Booking
            </button>
        </form>
    </div>
</div>

<div id="msg-overlay">
    <div class="brand-name">NEXUS</div>
    <p id="overlay-text" style="font-weight: 500;">Connecting to service center...</p>
</div>
<footer id="nexus-footer-wrapper"></footer>
<script src="header.js"></script>
<script src="footer.js"></script>
<script>
    // 1. SESSION GUARD
    const userPool = new AmazonCognitoIdentity.CognitoUserPool({
        UserPoolId: NEXUS_CONFIG.auth.UserPoolId,
        ClientId: NEXUS_CONFIG.auth.ClientId
    });
    const cognitoUser = userPool.getCurrentUser();

    if (!cognitoUser) {
        window.location.href = 'login.html?redirect=book-repair.html';
    } else {
        cognitoUser.getSession((err, session) => {
            if (err || !session.isValid()) {
                window.location.href = 'login.html';
            } else {
                document.getElementById('main-content').style.display = 'block';
            }
        });
    }

    // 2. FORM SUBMISSION
    document.getElementById('repairForm').onsubmit = function(e) {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        const overlay = document.getElementById('msg-overlay');
        const overlayText = document.getElementById('overlay-text');
        
        btn.disabled = true;
        overlay.style.display = "flex";

        cognitoUser.getSession((err, session) => {
            if (err || !session.isValid()) { 
                window.location.href = 'login.html';
                return; 
            }
            
            const formData = {
                deviceType: document.getElementById('deviceType').value,
                brand: document.getElementById('brand').value,
                model: document.getElementById('model').value,
                serialNumber: document.getElementById('serialNumber').value,
                issueDescription: document.getElementById('issueDescription').value,
                liquidDamage: document.getElementById('liquidDamage').checked,
                previousRepair: document.getElementById('previousRepair').checked,
                pickupAddress: document.getElementById('pickupAddress').value,
                city: document.getElementById('city').value,
                bookingDate: document.getElementById('bookingDate').value
            };

            fetch(NEXUS_CONFIG.api.baseUrl + '/bookings', {
                method: 'POST',
                headers: {
                    'Authorization': session.getIdToken().getJwtToken(),
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(formData)
            })
            .then(res => res.json())
            .then(data => {
                overlayText.innerText = "Booking confirmed. Redirecting...";
                
                const bookingId = data.bookingId || data.id || `NX-${Math.floor(1000 + Math.random() * 9000)}`;

                sessionStorage.setItem('lastBooking', JSON.stringify({
                    id: bookingId,
                    device: `${formData.brand} ${formData.model}`,
                    date: formData.bookingDate
                }));

                setTimeout(() => window.location.href = 'booking-success.html', 1200);
            })
            .catch(error => {
                alert("Could not process booking. Please try again.");
                btn.disabled = false;
                overlay.style.display = "none";
            });
        });
    };
</script>
</body>
</html>
