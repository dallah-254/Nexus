<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusFlow | Secure Repair Protocol</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/aws-sdk/2.1522.0/aws-sdk.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@6.3.7/dist/amazon-cognito-identity.min.js"></script>
    
    <script src="auth-config.js"></script>
    <link rel="stylesheet" href="style.css"> 
    <link rel="stylesheet" href="header.css">
    
    <style>
        body { padding-top: 100px; } /* Offset for fixed header */

        /* Prevent flashing of content before login check */
        #main-content { display: none; }

        .repair-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        .form-section { margin-bottom: 40px; }

        .section-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
            border-bottom: 1px solid rgba(0, 243, 255, 0.1);
            padding-bottom: 10px;
        }

        .step-number {
            background: var(--nexus-cyan, #00f3ff);
            color: #000;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 0.8rem;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .full-width { grid-column: span 2; }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.75rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input, select, textarea {
            width: 100%;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.1);
            color: white;
            padding: 12px;
            border-radius: 5px;
            font-family: inherit;
        }

        input:focus { border-color: var(--nexus-cyan); outline: none; }

        .checkbox-group {
            display: flex;
            gap: 30px;
            background: rgba(0, 243, 255, 0.03);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid rgba(0, 243, 255, 0.1);
        }

        .check-item {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .check-item input { width: auto; margin: 0; }

        #msg-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(5px);
            z-index: 20000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            color: var(--nexus-cyan);
        }
    </style>
</head>
<body>

<div id="nexus-header-wrapper"></div>

<div id="main-content" class="repair-container">
    <div style="margin-bottom: 50px;">
        <h1 style="font-size: 2.5rem; letter-spacing: -1px;">Hardware <span style="color:var(--nexus-cyan)">Recovery</span></h1>
        <p style="color: #666;">Initiate a technical diagnostic request for your malfunctioning gear.</p>
    </div>

    <div class="card" style="background: rgba(255,255,255,0.02); padding: 40px; border: 1px solid rgba(255,255,255,0.05);">
        <form id="repairForm">
            <div class="form-section">
                <div class="section-header">
                    <div class="step-number">01</div>
                    <h3 style="text-transform: uppercase; font-size: 0.9rem; letter-spacing: 2px;">Device Specifications</h3>
                </div>
                <div class="grid">
                    <div>
                        <label>Category</label>
                        <select id="deviceType" required>
                            <option value="Smartphone">Smartphone</option>
                            <option value="Laptop">Laptop</option>
                            <option value="Gaming Console">Gaming Console</option>
                            <option value="Other">Custom Rig</option>
                        </select>
                    </div>
                    <div>
                        <label>Manufacturer</label>
                        <input type="text" id="brand" placeholder="e.g. Razer, Apple" required>
                    </div>
                    <div>
                        <label>Model Number</label>
                        <input type="text" id="model" placeholder="e.g. Blade 15, iPhone 15 Pro" required>
                    </div>
                    <div>
                        <label>Serial / IMEI</label>
                        <input type="text" id="serialNumber" placeholder="For parts verification">
                    </div>
                </div>
            </div>

            <div class="form-section">
                <div class="section-header">
                    <div class="step-number">02</div>
                    <h3 style="text-transform: uppercase; font-size: 0.9rem; letter-spacing: 2px;">Failure Analysis</h3>
                </div>
                <label>Symptom Log</label>
                <textarea id="issueDescription" rows="4" placeholder="Describe the erratic behavior..." required></textarea>
                
                <div class="checkbox-group" style="margin-top: 15px;">
                    <label class="check-item">
                        <input type="checkbox" id="liquidDamage"> Liquid Intrusion
                    </label>
                    <label class="check-item">
                        <input type="checkbox" id="previousRepair"> Third-party Tampering
                    </label>
                </div>
            </div>

            <div class="form-section">
                <div class="section-header">
                    <div class="step-number">03</div>
                    <h3 style="text-transform: uppercase; font-size: 0.9rem; letter-spacing: 2px;">Logistics Link</h3>
                </div>
                <div class="grid">
                    <div class="full-width">
                        <label>Pickup Coordinates (Address)</label>
                        <input type="text" id="pickupAddress" placeholder="Building, Floor, Unit Number" required>
                    </div>
                    <div>
                        <label>City Hub</label>
                        <input type="text" id="city" placeholder="e.g. Nairobi" required>
                    </div>
                    <div>
                        <label>Deployment Date</label>
                        <input type="date" id="bookingDate" required>
                    </div>
                </div>
            </div>

            <button type="submit" id="submitBtn" class="btn btn-primary" style="width: 100%; margin-top: 20px; height: 60px; font-size: 1rem;">
                TRANSMIT RECOVERY REQUEST
            </button>
        </form>
    </div>
</div>

<div id="msg-overlay">
    <div class="brand-logo" style="margin-bottom: 20px;">NEXUS<span>FLOW</span></div>
    <p id="overlay-text">Establishing Secure Link...</p>
</div>

<script src="header.js"></script>
<script>
    // 1. SESSION GUARD: Check login immediately
    const userPool = new AmazonCognitoIdentity.CognitoUserPool({
        UserPoolId: NEXUS_CONFIG.auth.UserPoolId,
        ClientId: NEXUS_CONFIG.auth.ClientId
    });
    const cognitoUser = userPool.getCurrentUser();

    if (!cognitoUser) {
        window.location.href = 'login.html?redirect=book-repair.html';
    } else {
        // Show content only if user is logged in
        cognitoUser.getSession((err, session) => {
            if (err || !session.isValid()) {
                window.location.href = 'login.html';
            } else {
                document.getElementById('main-content').style.display = 'block';
            }
        });
    }

    // 2. FORM SUBMISSION
    document.getElementById('repairForm').onsubmit = function(e) {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        const overlay = document.getElementById('msg-overlay');
        const overlayText = document.getElementById('overlay-text');
        
        btn.disabled = true;
        overlay.style.display = "flex";

        cognitoUser.getSession((err, session) => {
            if (err || !session.isValid()) { 
                NexusUtils.showAlert("Session Expired", "error");
                window.location.href = 'login.html';
                return; 
            }
            
            const formData = {
                deviceType: document.getElementById('deviceType').value,
                brand: document.getElementById('brand').value,
                model: document.getElementById('model').value,
                serialNumber: document.getElementById('serialNumber').value,
                issueDescription: document.getElementById('issueDescription').value,
                liquidDamage: document.getElementById('liquidDamage').checked,
                previousRepair: document.getElementById('previousRepair').checked,
                pickupAddress: document.getElementById('pickupAddress').value,
                city: document.getElementById('city').value,
                bookingDate: document.getElementById('bookingDate').value
            };

            fetch(NEXUS_CONFIG.api.baseUrl + '/bookings', {
                method: 'POST',
                headers: {
                    'Authorization': session.getIdToken().getJwtToken(),
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(formData)
            })
            .then(res => res.json())
            .then(data => {
                overlayText.innerText = "Request Logged. Finalizing...";
                
                const bookingId = data.bookingId || data.id || `NX-${Math.floor(1000 + Math.random() * 9000)}`;

                sessionStorage.setItem('lastBooking', JSON.stringify({
                    id: bookingId,
                    device: `${formData.brand} ${formData.model}`,
                    date: formData.bookingDate
                }));

                setTimeout(() => window.location.href = 'booking-success.html', 1200);
            })
            .catch(error => {
                NexusUtils.showAlert("Transmission Failed", "error");
                btn.disabled = false;
                overlay.style.display = "none";
            });
        });
    };
</script>
</body>
</html>
