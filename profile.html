<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusFlow | My Profile</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/aws-sdk/2.1522.0/aws-sdk.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@6.3.7/dist/amazon-cognito-identity.min.js"></script>
    
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f7f9; padding: 20px; margin: 0; color: #333; }
        .container { max-width: 1000px; margin: auto; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); margin-bottom: 25px; }
        
        .header-flex { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #ff9900; padding-bottom: 15px; margin-bottom: 20px; }
        h1, h2 { margin: 0; color: #232f3e; }

        /* User Details Styling */
        .user-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .detail-item { font-size: 15px; }
        .detail-item strong { color: #555; text-transform: capitalize; margin-right: 5px; }

        /* Table Styling */
        table { width: 100%; border-collapse: collapse; margin-top: 15px; background: #fff; }
        th { background: #232f3e; color: white; text-align: left; padding: 15px; font-size: 14px; }
        td { padding: 15px; border-bottom: 1px solid #eee; vertical-align: top; }
        tr:hover { background-color: #f9f9f9; }

        .status-badge { display: inline-block; background: #e1f5fe; color: #01579b; padding: 5px 12px; border-radius: 15px; font-size: 12px; font-weight: bold; text-transform: uppercase; }
        .device-text { font-weight: bold; color: #333; display: block; }
        .issue-text { font-size: 13px; color: #666; margin-top: 4px; display: block; }

        .btn-action { background: #ff9900; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; text-decoration: none; font-weight: bold; font-size: 14px; }
        .btn-logout { background: #d9534f; margin-left: 10px; }
        .nav-buttons { display: flex; gap: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <div class="header-flex">
            <h1>NexusFlow Profile</h1>
            <div class="nav-buttons">
                <a href="book.html" class="btn-action">Book New Repair</a>
                <button class="btn-action btn-logout" onclick="logout()">Logout</button>
            </div>
        </div>
        <div id="user-info" class="user-grid">Loading profile details...</div>
    </div>

    <div class="card">
        <h2>Recent Repair Requests</h2>
        <div id="booking-status" style="padding: 20px; text-align: center; color: #666;">
            Verifying session and fetching history...
        </div>
        <table id="booking-table" style="display:none;">
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Device Details</th>
                    <th>Pickup Location</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="booking-rows"></tbody>
        </table>
    </div>
</div>

<script>
    // 1. CONFIGURATION
    const poolData = { 
        UserPoolId: 'us-east-1_IK57zG64M', 
        ClientId: '668q6c6krjv8b6n81cfc78n9a4' 
    };
    const apiInvokeUrl = 'https://yskkdnff93.execute-api.us-east-1.amazonaws.com/prod/bookings';

    // 2. PAGE LOAD LOGIC
    window.onload = function() {
        const userPool = new AmazonCognitoIdentity.CognitoUserPool(poolData);
        const cognitoUser = userPool.getCurrentUser();

        if (cognitoUser != null) {
            cognitoUser.getSession((err, session) => {
                if (err || !session.isValid()) {
                    window.location.href = 'login.html';
                } else {
                    displayProfile(cognitoUser);
                    fetchRepairHistory(session);
                }
            });
        } else {
            window.location.href = 'login.html';
        }
    };

    // 3. DISPLAY COGNITO ATTRIBUTES
    function displayProfile(cognitoUser) {
        cognitoUser.getUserAttributes((err, attributes) => {
            const infoDiv = document.getElementById('user-info');
            if (err) {
                infoDiv.innerText = "Error loading profile.";
                return;
            }
            let html = "";
            attributes.forEach(attr => {
                const label = attr.Name.replace('custom:', '').replace('_', ' ');
                // Only show relevant fields
                if (["email", "family_name", "middle_name", "address", "phone_number"].includes(attr.Name)) {
                    html += `<div class="detail-item"><strong>${label}:</strong> ${attr.Value}</div>`;
                }
            });
            infoDiv.innerHTML = html;
        });
    }

    // 4. FETCH FROM DYNAMODB VIA API
    function fetchRepairHistory(session) {
        const idToken = session.getIdToken().getJwtToken();

        fetch(apiInvokeUrl, {
            method: 'GET',
            headers: {
                'Authorization': idToken,
                'Content-Type': 'application/json'
            }
        })
        .then(response => {
            if (!response.ok) throw new Error("API Status: " + response.status);
            return response.json();
        })
        .then(data => {
            const statusEl = document.getElementById('booking-status');
            const tableEl = document.getElementById('booking-table');
            const rowsEl = document.getElementById('booking-rows');

            if (!data || data.length === 0) {
                statusEl.innerHTML = "No repair requests found. <br><br> <a href='book.html'>Click here to book your first repair!</a>";
            } else {
                statusEl.style.display = 'none';
                tableEl.style.display = 'table';
                
                rowsEl.innerHTML = data.map(item => {
                    // Smart display logic for repair fields
                    const deviceName = (item.brand && item.model) ? `${item.brand} ${item.model}` : (item.deviceType || "Unknown Device");
                    const displayDate = item.bookingDate || (item.createdAt ? item.createdAt.split('T')[0] : 'N/A');
                    const location = item.pickupAddress ? `${item.pickupAddress}, ${item.city || ''}` : "Not provided";

                    return `
                        <tr>
                            <td>${displayDate}</td>
                            <td>
                                <span class="device-text">${deviceName}</span>
                                <span class="issue-text">${item.issueDescription || 'No description provided.'}</span>
                            </td>
                            <td style="font-size: 13px;">${location}</td>
                            <td><span class="status-badge">${item.status || 'RECEIVED'}</span></td>
                        </tr>
                    `;
                }).join('');
            }
        })
        .catch(error => {
            console.error("Fetch error:", error);
            document.getElementById('booking-status').innerHTML = 
                "<span style='color:red;'>Failed to load repairs. Please ensure API is deployed and CORS is enabled.</span>";
        });
    }

    // 5. LOGOUT
    function logout() {
        const userPool = new AmazonCognitoIdentity.CognitoUserPool(poolData);
        const cognitoUser = userPool.getCurrentUser();
        if (cognitoUser) cognitoUser.signOut();
        window.location.href = 'login.html';
    }
</script>

</body>
</html>
