<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NexusFlow | My Profile</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f8f9fa; padding: 2rem; display: flex; justify-content: center; }
        .profile-card { background: white; padding: 2.5rem; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); width: 100%; max-width: 500px; }
        .header { border-bottom: 2px solid #ff9900; margin-bottom: 20px; padding-bottom: 10px; }
        .data-row { margin: 15px 0; display: flex; justify-content: space-between; border-bottom: 1px solid #eee; padding-bottom: 8px; }
        .label { font-weight: bold; color: #555; }
        .value { color: #222; }
        .logout-btn { margin-top: 30px; width: 100%; padding: 10px; background: #dc3545; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<div class="profile-card">
    <div class="header">
        <h2 style="margin:0;">Customer Profile</h2>
        <p style="color: #666; font-size: 14px;">Logged in securely via AWS Cognito</p>
    </div>

    <div id="profileDetails">
        <div class="data-row"><span class="label">Full Name:</span> <span class="value" id="userName">Loading...</span></div>
        <div class="data-row"><span class="label">Email:</span> <span class="value" id="userEmail">Loading...</span></div>
        <div class="data-row"><span class="label">Phone:</span> <span class="value" id="userPhone">Loading...</span></div>
        <div class="data-row"><span class="label">Address:</span> <span class="value" id="userAddress">Loading...</span></div>
    </div>

    <button class="logout-btn" onclick="logout()">Logout & Exit</button>
</div>

<script>
    // THE SECURITY GUARD: Check if logged in before anything else
    window.onload = function() {
        const token = localStorage.getItem('nexus_id_token');

        if (!token) {
            // No token found - Kick them out!
            window.location.href = 'login.html';
            return;
        }

        try {
            // Decode the ID Token (it's a Base64 string)
            const base64Url = token.split('.')[1];
            const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            const payload = JSON.parse(window.atob(base64));

            console.log("User Claims:", payload);

            // Populate the UI with real data from Cognito
            document.getElementById('userName').innerText = `${payload['middle_name'] || ''} ${payload['family_name'] || ''}`.trim();
            document.getElementById('userEmail').innerText = payload['email'];
            document.getElementById('userPhone').innerText = payload['phone_number'] || 'N/A';
            document.getElementById('userAddress').innerText = payload['address'] || 'N/A';

        } catch (e) {
            console.error("Token decoding failed", e);
            logout();
        }
    };

    function logout() {
        localStorage.clear();
        window.location.href = 'login.html';
    }
</script>
</body>
</html>
