<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Nexus Hardware | Professional Account Dashboard</title>
    
    <script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@6.3.7/dist/amazon-cognito-identity.min.js"></script>
    <script src="auth-config.js"></script>
    <script src="header.js" defer></script>
    <script src="footer.js" defer></script>
    
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-50: #eff6ff;
            --primary-100: #dbeafe;
            --primary-200: #bfdbfe;
            --primary-300: #93c5fd;
            --primary-400: #60a5fa;
            --primary-500: #3b82f6;
            --primary-600: #2563eb;
            --primary-700: #1d4ed8;
            --primary-800: #1e40af;
            --primary-900: #1e3a8a;
            
            --neutral-50: #f9fafb;
            --neutral-100: #f3f4f6;
            --neutral-200: #e5e7eb;
            --neutral-300: #d1d5db;
            --neutral-400: #9ca3af;
            --neutral-500: #6b7280;
            --neutral-600: #4b5563;
            --neutral-700: #374151;
            --neutral-800: #1f2937;
            --neutral-900: #111827;
            
            --success-50: #f0fdf4;
            --success-500: #22c55e;
            --success-600: #16a34a;
            --success-700: #15803d;
            
            --warning-50: #fffbeb;
            --warning-500: #f59e0b;
            --warning-600: #d97706;
            
            --error-50: #fef2f2;
            --error-500: #ef4444;
            --error-600: #dc2626;
            
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
            --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
            
            --radius-xs: 0.375rem;
            --radius-sm: 0.5rem;
            --radius-md: 0.75rem;
            --radius-lg: 1rem;
            --radius-xl: 1.5rem;
            --radius-2xl: 2rem;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, var(--neutral-50) 0%, #ffffff 100%);
            color: var(--neutral-900);
            line-height: 1.5;
            min-height: 100vh;
            padding-top: 90px;
            padding-bottom: 40px;
        }

        /* Container System */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 24px;
        }

        @media (max-width: 640px) {
            .container {
                padding: 0 16px;
            }
            body {
                padding-top: 80px;
            }
        }

        /* Back Navigation */
        .back-nav {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 12px 24px;
            background: white;
            border-radius: var(--radius-full);
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--neutral-200);
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
            color: var(--neutral-700);
            margin-bottom: 32px;
        }

        .back-nav:hover {
            background: var(--neutral-50);
            border-color: var(--neutral-300);
            transform: translateX(-4px);
            box-shadow: var(--shadow-md);
        }

        /* Dashboard Layout */
        .dashboard {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 32px;
            animation: fadeIn 0.5s ease-out;
        }

        @media (max-width: 1024px) {
            .dashboard {
                grid-template-columns: 280px 1fr;
                gap: 24px;
            }
        }

        @media (max-width: 768px) {
            .dashboard {
                grid-template-columns: 1fr;
                gap: 24px;
            }
        }

        /* Sidebar Styles */
        .sidebar {
            position: sticky;
            top: 110px;
            height: fit-content;
        }

        @media (max-width: 768px) {
            .sidebar {
                position: static;
            }
        }

        .profile-card {
            background: white;
            border-radius: var(--radius-xl);
            padding: 32px 24px;
            text-align: center;
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--neutral-200);
            margin-bottom: 24px;
            transition: transform 0.2s;
        }

        .profile-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-xl);
        }

        .avatar {
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, var(--primary-600), var(--primary-800));
            border-radius: 50%;
            margin: 0 auto 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 48px;
            font-weight: 600;
            box-shadow: 0 10px 20px -5px rgba(37, 99, 235, 0.3);
            border: 4px solid white;
            transition: transform 0.2s;
        }

        .profile-card:hover .avatar {
            transform: scale(1.05);
        }

        .user-name {
            font-size: 24px;
            font-weight: 700;
            color: var(--neutral-900);
            margin-bottom: 4px;
        }

        .user-email {
            font-size: 14px;
            color: var(--neutral-500);
            margin-bottom: 24px;
            word-break: break-all;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: var(--neutral-50);
            border-radius: var(--radius-lg);
            padding: 16px;
            text-align: center;
            border: 1px solid var(--neutral-200);
            transition: all 0.2s;
        }

        .stat-card:hover {
            background: var(--primary-50);
            border-color: var(--primary-200);
        }

        .stat-value {
            font-size: 32px;
            font-weight: 800;
            color: var(--primary-600);
            line-height: 1.2;
            margin-bottom: 4px;
        }

        .stat-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--neutral-500);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .quick-actions {
            background: white;
            border-radius: var(--radius-xl);
            padding: 24px;
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--neutral-200);
        }

        .actions-title {
            font-size: 12px;
            font-weight: 700;
            color: var(--neutral-400);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 16px;
        }

        .action-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
            color: var(--neutral-700);
            text-decoration: none;
            border-radius: var(--radius-lg);
            transition: all 0.2s;
            font-weight: 500;
            cursor: pointer;
            border: 1px solid transparent;
        }

        .action-item i {
            width: 24px;
            color: var(--primary-600);
            font-size: 1.2rem;
        }

        .action-item:hover {
            background: var(--primary-50);
            border-color: var(--primary-200);
            transform: translateX(4px);
        }

        .action-item.logout {
            color: var(--error-600);
            margin-top: 16px;
            border-top: 1px solid var(--neutral-200);
            padding-top: 20px;
            border-radius: 0;
        }

        .action-item.logout i {
            color: var(--error-500);
        }

        .action-item.logout:hover {
            background: var(--error-50);
            border-color: var(--error-200);
        }

        /* Main Content Styles */
        .main-content {
            min-width: 0;
        }

        .section {
            margin-bottom: 48px;
        }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 16px;
        }

        .section-title {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 20px;
            font-weight: 700;
            color: var(--neutral-900);
        }

        .section-title i {
            color: var(--primary-600);
            font-size: 24px;
        }

        .view-all {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--primary-600);
            font-weight: 600;
            font-size: 14px;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: var(--radius-full);
            background: var(--primary-50);
            transition: all 0.2s;
        }

        .view-all:hover {
            background: var(--primary-100);
            gap: 12px;
        }

        /* Grid System */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 24px;
        }

        @media (max-width: 640px) {
            .grid {
                grid-template-columns: 1fr;
                gap: 16px;
            }
        }

        /* Card Styles */
        .card {
            background: white;
            border-radius: var(--radius-xl);
            border: 1px solid var(--neutral-200);
            overflow: hidden;
            transition: all 0.3s;
            cursor: pointer;
            position: relative;
            box-shadow: var(--shadow);
        }

        .card:hover {
            transform: translateY(-6px);
            box-shadow: var(--shadow-xl);
            border-color: var(--primary-300);
        }

        .card-tag {
            position: absolute;
            top: 16px;
            right: 16px;
            padding: 6px 12px;
            border-radius: var(--radius-full);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            background: var(--neutral-100);
            color: var(--neutral-700);
        }

        .card-tag.order {
            background: var(--primary-100);
            color: var(--primary-800);
        }

        .card-tag.booking {
            background: var(--warning-100);
            color: var(--warning-800);
        }

        .card-content {
            padding: 24px;
        }

        .card-header {
            margin-bottom: 16px;
        }

        .card-id {
            font-family: 'SF Mono', 'Fira Code', monospace;
            font-size: 14px;
            font-weight: 600;
            color: var(--neutral-500);
            margin-bottom: 8px;
        }

        .card-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--neutral-900);
            margin-bottom: 8px;
            line-height: 1.4;
        }

        .card-subtitle {
            font-size: 14px;
            color: var(--neutral-500);
            margin-bottom: 16px;
        }

        .card-details {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 16px;
            border-top: 1px solid var(--neutral-200);
        }

        .card-amount {
            font-size: 24px;
            font-weight: 800;
            color: var(--primary-600);
        }

        .card-date {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--neutral-500);
            font-size: 13px;
            font-weight: 500;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            padding: 6px 12px;
            border-radius: var(--radius-full);
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .status-badge i {
            margin-right: 6px;
            font-size: 12px;
        }

        /* Status Colors */
        .status-processing { background: var(--primary-100); color: var(--primary-800); }
        .status-shipped { background: var(--warning-100); color: var(--warning-800); }
        .status-delivered { background: var(--success-100); color: var(--success-700); }
        .status-cancelled { background: var(--error-100); color: var(--error-600); }
        .status-received { background: var(--primary-100); color: var(--primary-800); }
        .status-confirmed { background: var(--success-100); color: var(--success-700); }
        .status-in-progress { background: var(--warning-100); color: var(--warning-800); }
        .status-completed { background: var(--success-100); color: var(--success-700); }

        /* Empty State */
        .empty-state {
            grid-column: 1 / -1;
            background: white;
            border-radius: var(--radius-xl);
            padding: 64px 32px;
            text-align: center;
            border: 2px dashed var(--neutral-200);
        }

        .empty-icon {
            font-size: 48px;
            color: var(--neutral-300);
            margin-bottom: 24px;
        }

        .empty-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--neutral-800);
            margin-bottom: 8px;
        }

        .empty-description {
            color: var(--neutral-500);
            margin-bottom: 24px;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }

        /* Loading State */
        .loading-container {
            grid-column: 1 / -1;
            text-align: center;
            padding: 64px;
        }

        .spinner {
            width: 48px;
            height: 48px;
            border: 3px solid var(--neutral-200);
            border-top: 3px solid var(--primary-600);
            border-radius: 50%;
            margin: 0 auto 16px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Details View */
        .details-wrapper {
            max-width: 1200px;
            margin: 0 auto;
        }

        .details-hero {
            background: linear-gradient(135deg, var(--primary-600), var(--primary-800));
            border-radius: var(--radius-2xl);
            padding: 48px;
            color: white;
            margin-bottom: 32px;
            position: relative;
            overflow: hidden;
        }

        .details-hero::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            animation: rotate 30s linear infinite;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .details-hero-content {
            position: relative;
            z-index: 1;
        }

        .details-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(10px);
            padding: 8px 20px;
            border-radius: var(--radius-full);
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 24px;
        }

        .details-title {
            font-size: 36px;
            font-weight: 800;
            margin-bottom: 8px;
            line-height: 1.2;
        }

        .details-subtitle {
            font-size: 16px;
            opacity: 0.9;
        }

        /* Details Grid Layout */
        .details-grid {
            display: grid;
            grid-template-columns: 1fr 360px;
            gap: 32px;
        }

        @media (max-width: 1024px) {
            .details-grid {
                grid-template-columns: 1fr;
            }
        }

        .details-main {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .details-sidebar {
            position: sticky;
            top: 110px;
            height: fit-content;
        }

        @media (max-width: 1024px) {
            .details-sidebar {
                position: static;
            }
        }

        .info-panel {
            background: white;
            border-radius: var(--radius-xl);
            padding: 24px;
            border: 1px solid var(--neutral-200);
            box-shadow: var(--shadow);
        }

        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 2px solid var(--neutral-100);
        }

        .panel-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            color: var(--neutral-900);
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .info-item {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .info-label {
            font-size: 11px;
            font-weight: 600;
            color: var(--neutral-500);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .info-value {
            font-weight: 600;
            color: var(--neutral-900);
            word-break: break-word;
        }

        /* Timeline */
        .timeline {
            position: relative;
            padding-left: 32px;
        }

        .timeline::before {
            content: '';
            position: absolute;
            left: 11px;
            top: 0;
            bottom: 0;
            width: 2px;
            background: var(--neutral-200);
        }

        .timeline-item {
            position: relative;
            margin-bottom: 28px;
        }

        .timeline-item:last-child {
            margin-bottom: 0;
        }

        .timeline-dot {
            position: absolute;
            left: -32px;
            top: 0;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: var(--neutral-300);
            border: 4px solid white;
            transition: all 0.2s;
        }

        .timeline-item.active .timeline-dot {
            background: var(--primary-600);
            box-shadow: 0 0 0 4px var(--primary-100);
        }

        .timeline-item.completed .timeline-dot {
            background: var(--success-600);
        }

        .timeline-content {
            padding-bottom: 4px;
        }

        .timeline-date {
            font-size: 12px;
            color: var(--neutral-500);
            margin-bottom: 4px;
        }

        .timeline-title {
            font-weight: 600;
            color: var(--neutral-900);
            margin-bottom: 4px;
        }

        .timeline-description {
            font-size: 14px;
            color: var(--neutral-500);
        }

        /* Product Items */
        .product-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .product-row {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 16px;
            background: var(--neutral-50);
            border-radius: var(--radius-lg);
            border: 1px solid var(--neutral-200);
            transition: all 0.2s;
        }

        .product-row:hover {
            background: white;
            border-color: var(--primary-200);
            transform: translateX(4px);
        }

        .product-icon {
            width: 48px;
            height: 48px;
            background: white;
            border-radius: var(--radius-lg);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary-600);
            font-size: 24px;
            box-shadow: var(--shadow-sm);
        }

        .product-details {
            flex: 1;
        }

        .product-name {
            font-weight: 600;
            color: var(--neutral-900);
            margin-bottom: 4px;
        }

        .product-meta {
            display: flex;
            align-items: center;
            gap: 16px;
            font-size: 13px;
            color: var(--neutral-500);
        }

        .product-price {
            font-weight: 700;
            color: var(--primary-600);
        }

        /* Action Buttons */
        .action-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 14px 20px;
            border-radius: var(--radius-lg);
            font-weight: 600;
            font-size: 14px;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
            background: white;
            border: 1px solid var(--neutral-200);
            color: var(--neutral-700);
        }

        .btn i {
            font-size: 1.1rem;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
            border-color: var(--neutral-300);
            background: var(--neutral-50);
        }

        .btn-primary {
            background: var(--primary-600);
            color: white;
            border: none;
        }

        .btn-primary:hover {
            background: var(--primary-700);
        }

        .btn-danger {
            background: white;
            color: var(--error-600);
            border-color: var(--error-200);
        }

        .btn-danger:hover {
            background: var(--error-50);
            border-color: var(--error-300);
        }

        /* Responsive Utilities */
        .hide-mobile {
            display: block;
        }

        .hide-desktop {
            display: none;
        }

        @media (max-width: 768px) {
            .hide-mobile {
                display: none;
            }
            .hide-desktop {
                display: block;
            }
            
            .details-hero {
                padding: 32px 24px;
            }
            
            .details-title {
                font-size: 28px;
            }
            
            .info-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div id="nexus-header-wrapper"></div>

    <div class="container">
        <!-- Dashboard View -->
        <div id="dashboardView">
            <div class="dashboard">
                <!-- Sidebar -->
                <aside class="sidebar">
                    <div class="profile-card">
                        <div class="avatar" id="uInit">U</div>
                        <h2 class="user-name" id="uName">Loading...</h2>
                        <p class="user-email" id="uEmail"></p>
                        
                        <div class="stats-grid">
                            <div class="stat-card">
                                <div class="stat-value" id="ordersCount">0</div>
                                <div class="stat-label">Orders</div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-value" id="bookingsCount">0</div>
                                <div class="stat-label">Services</div>
                            </div>
                        </div>
                    </div>

                    <div class="quick-actions">
                        <div class="actions-title">Quick Actions</div>
                        <a href="services.html" class="action-item">
                            <i class="fas fa-tools"></i>
                            <span>Book a Service</span>
                        </a>
                        <a href="shop.html" class="action-item">
                            <i class="fas fa-store"></i>
                            <span>Browse Hardware</span>
                        </a>
                        <a href="#" class="action-item" onclick="openSupportChat()">
                            <i class="fas fa-headset"></i>
                            <span>Live Support</span>
                        </a>
                        <a href="#" class="action-item" onclick="openSettings()">
                            <i class="fas fa-user-cog"></i>
                            <span>Account Settings</span>
                        </a>
                        <div class="action-item logout" onclick="sessionTerminate()">
                            <i class="fas fa-sign-out-alt"></i>
                            <span>Sign Out</span>
                        </div>
                    </div>
                </aside>

                <!-- Main Content -->
                <main class="main-content">
                    <!-- Orders Section -->
                    <section class="section">
                        <div class="section-header">
                            <h2 class="section-title">
                                <i class="fas fa-shopping-bag"></i>
                                Hardware Orders
                            </h2>
                            <a href="shop.html" class="view-all">
                                Browse Store
                                <i class="fas fa-arrow-right"></i>
                            </a>
                        </div>

                        <div id="ordersGrid" class="grid">
                            <div class="loading-container">
                                <div class="spinner"></div>
                                <p style="color: var(--neutral-500);">Loading your orders...</p>
                            </div>
                        </div>
                    </section>

                    <!-- Bookings Section -->
                    <section class="section">
                        <div class="section-header">
                            <h2 class="section-title">
                                <i class="fas fa-calendar-check"></i>
                                Service Bookings
                            </h2>
                            <a href="services.html" class="view-all">
                                Book Service
                                <i class="fas fa-arrow-right"></i>
                            </a>
                        </div>

                        <div id="bookingsGrid" class="grid">
                            <div class="loading-container">
                                <div class="spinner"></div>
                                <p style="color: var(--neutral-500);">Loading your bookings...</p>
                            </div>
                        </div>
                    </section>
                </main>
            </div>
        </div>

        <!-- Details View -->
        <div id="detailsView" style="display: none;">
            <div class="back-nav" onclick="goBackToDashboard()">
                <i class="fas fa-arrow-left"></i>
                <span>Back to Dashboard</span>
            </div>
            <div id="detailsContent"></div>
        </div>
    </div>

    <script>
        const poolData = { 
            UserPoolId: NEXUS_CONFIG.auth.UserPoolId, 
            ClientId: NEXUS_CONFIG.auth.ClientId 
        };
        
        let cachedOrders = [];
        let cachedBookings = [];
        let currentUserEmail = '';
        let currentUserSession = null;
        let currentUserName = '';

        // Initialize page
        window.onload = function() {
            const userPool = new AmazonCognitoIdentity.CognitoUserPool(poolData);
            const user = userPool.getCurrentUser();

            if (user) {
                user.getSession((err, session) => {
                    if (err || !session.isValid()) { 
                        window.location.href='login.html'; 
                        return; 
                    }
                    
                    currentUserSession = session;
                    
                    user.getUserAttributes((err, attrs) => {
                        const email = attrs.find(a => a.Name === 'email')?.Value || "";
                        const name = attrs.find(a => a.Name === 'name')?.Value || email.split('@')[0];
                        
                        currentUserEmail = email;
                        currentUserName = name;
                        
                        // Update profile
                        document.getElementById('uEmail').innerText = email;
                        document.getElementById('uName').innerText = name;
                        document.getElementById('uInit').innerText = name.charAt(0).toUpperCase();
                        
                        // Load data
                        fetchOrders(email, session);
                        fetchBookings(session);
                    });
                });
            } else { 
                window.location.href='login.html'; 
            }
        };

        // Fetch orders
        async function fetchOrders(email, session) {
            try {
                const res = await fetch(`${NEXUS_CONFIG.api.baseUrl}/orders?email=${encodeURIComponent(email)}`, {
                    headers: { 'Authorization': session.getIdToken().getJwtToken() }
                });
                
                cachedOrders = await res.json() || [];
                const grid = document.getElementById('ordersGrid');
                
                // Update count
                document.getElementById('ordersCount').textContent = cachedOrders.length;
                
                if(cachedOrders.length === 0) {
                    grid.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-shopping-bag empty-icon"></i>
                            <h3 class="empty-title">No Orders Yet</h3>
                            <p class="empty-description">Start shopping for premium hardware and tools. Your orders will appear here.</p>
                            <a href="shop.html" class="btn btn-primary" style="display: inline-flex; width: auto; padding: 12px 32px;">
                                <i class="fas fa-store"></i>
                                Browse Store
                            </a>
                        </div>`;
                    return;
                }

                grid.innerHTML = cachedOrders.map(o => {
                    const orderId = o.orderId || o.id || '---';
                    const status = o.status || 'Processing';
                    const statusClass = `status-${status.toLowerCase().replace(/_/g, '-')}`;
                    const itemCount = o.items ? o.items.reduce((sum, item) => sum + (item.quantity || 1), 0) : 0;
                    
                    return `
                        <div class="card" onclick="openOrderDetails('${orderId}')">
                            <div class="card-tag order ${statusClass}">${status}</div>
                            <div class="card-content">
                                <div class="card-header">
                                    <div class="card-id">#${orderId.toString().substring(0, 8)}</div>
                                    <div class="card-title">Order ${orderId.toString().substring(0, 8)}</div>
                                    <div class="card-subtitle">${itemCount} item${itemCount !== 1 ? 's' : ''}</div>
                                </div>
                                <div class="card-details">
                                    <span class="card-amount">$${parseFloat(o.totalAmount || 0).toFixed(2)}</span>
                                    <span class="card-date">
                                        <i class="far fa-calendar"></i>
                                        ${o.createdAt ? new Date(o.createdAt).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : 'N/A'}
                                    </span>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
            } catch(e) { 
                console.error('Error fetching orders:', e);
                const grid = document.getElementById('ordersGrid');
                grid.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-exclamation-triangle empty-icon" style="color: var(--error-500);"></i>
                        <h3 class="empty-title">Error Loading Orders</h3>
                        <p class="empty-description">We couldn't load your orders. Please try again.</p>
                        <button class="btn btn-primary" onclick="fetchOrders(currentUserEmail, currentUserSession)" style="display: inline-flex; width: auto;">
                            <i class="fas fa-redo"></i>
                            Try Again
                        </button>
                    </div>`;
            }
        }

        // Fetch bookings
        async function fetchBookings(session) {
            try {
                const res = await fetch(`${NEXUS_CONFIG.api.baseUrl}/bookings`, {
                    headers: { 'Authorization': session.getIdToken().getJwtToken() }
                });
                
                const data = await res.json();
                cachedBookings = data || [];
                
                // Update count
                document.getElementById('bookingsCount').textContent = cachedBookings.length;
                
                const grid = document.getElementById('bookingsGrid');
                
                if (!cachedBookings || cachedBookings.length === 0) {
                    grid.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-tools empty-icon"></i>
                            <h3 class="empty-title">No Service Bookings</h3>
                            <p class="empty-description">Book a repair service for your devices. All your bookings will appear here.</p>
                            <a href="services.html" class="btn btn-primary" style="display: inline-flex; width: auto; padding: 12px 32px;">
                                <i class="fas fa-plus-circle"></i>
                                Book a Service
                            </a>
                        </div>`;
                    return;
                }

                grid.innerHTML = cachedBookings.map(b => {
                    const bookingId = b.id || b.bookingId || '---';
                    const deviceName = b.deviceDisplayName || `${b.brand || 'Device'} ${b.model || ''}`;
                    const status = b.status || b.service?.status || 'RECEIVED';
                    const statusClass = `status-${status.toLowerCase().replace(/_/g, '-')}`;
                    
                    return `
                        <div class="card" onclick="openBookingDetails('${bookingId}')">
                            <div class="card-tag booking ${statusClass}">${status.replace('_', ' ')}</div>
                            <div class="card-content">
                                <div class="card-header">
                                    <div class="card-id">#${bookingId.toString().substring(0, 8)}</div>
                                    <div class="card-title">${deviceName}</div>
                                    <div class="card-subtitle">${b.issue?.description?.substring(0, 50) || 'Service request'}...</div>
                                </div>
                                <div class="card-details">
                                    <span class="card-date">
                                        <i class="far fa-calendar"></i>
                                        ${b.formattedDate || (b.service?.date ? new Date(b.service.date).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) : 'Not scheduled')}
                                    </span>
                                    <i class="fas fa-chevron-right" style="color: var(--primary-500);"></i>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
            } catch(e) { 
                console.error('Error fetching bookings:', e);
                const grid = document.getElementById('bookingsGrid');
                grid.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-exclamation-triangle empty-icon" style="color: var(--error-500);"></i>
                        <h3 class="empty-title">Error Loading Bookings</h3>
                        <p class="empty-description">We couldn't load your bookings. Please try again.</p>
                        <button class="btn btn-primary" onclick="fetchBookings(currentUserSession)" style="display: inline-flex; width: auto;">
                            <i class="fas fa-redo"></i>
                            Try Again
                        </button>
                    </div>`;
            }
        }

        // Open order details
        function openOrderDetails(orderId) {
            const order = cachedOrders.find(x => (x.orderId === orderId || x.id === orderId));
            if(!order) return;

            // Switch to details view
            document.getElementById('dashboardView').style.display = 'none';
            document.getElementById('detailsView').style.display = 'block';
            
            const status = (order.status || "processing").toLowerCase();
            const statusClass = `status-${status.replace(/_/g, '-')}`;
            
            const detailsHTML = `
                <div class="details-wrapper">
                    <div class="details-hero">
                        <div class="details-hero-content">
                            <div class="details-badge">
                                <i class="fas fa-box"></i>
                                ORDER #${orderId.substring(0, 8)}
                            </div>
                            <h1 class="details-title">Order Details</h1>
                            <p class="details-subtitle">Placed on ${order.createdAt ? new Date(order.createdAt).toLocaleDateString('en-US', { 
                                weekday: 'long',
                                year: 'numeric',
                                month: 'long',
                                day: 'numeric' 
                            }) : 'Unknown date'}</p>
                        </div>
                    </div>

                    <div class="details-grid">
                        <div class="details-main">
                            <!-- Order Summary -->
                            <div class="info-panel">
                                <div class="panel-header">
                                    <div class="panel-title">
                                        <i class="fas fa-receipt" style="color: var(--primary-600);"></i>
                                        Order Summary
                                    </div>
                                    <span class="status-badge ${statusClass}">${status.toUpperCase()}</span>
                                </div>
                                
                                <div class="info-grid">
                                    <div class="info-item">
                                        <span class="info-label">Order ID</span>
                                        <span class="info-value">${orderId}</span>
                                    </div>
                                    <div class="info-item">
                                        <span class="info-label">Total Amount</span>
                                        <span class="info-value">$${parseFloat(order.totalAmount || 0).toFixed(2)}</span>
                                    </div>
                                    <div class="info-item">
                                        <span class="info-label">Payment Status</span>
                                        <span class="info-value">${order.paymentStatus || 'Pending'}</span>
                                    </div>
                                    ${order.trackingNumber ? `
                                    <div class="info-item">
                                        <span class="info-label">Tracking #</span>
                                        <span class="info-value">${order.trackingNumber}</span>
                                    </div>
                                    ` : ''}
                                </div>
                            </div>

                            <!-- Shipping Information -->
                            <div class="info-panel">
                                <div class="panel-header">
                                    <div class="panel-title">
                                        <i class="fas fa-truck" style="color: var(--primary-600);"></i>
                                        Shipping Information
                                    </div>
                                </div>
                                
                                ${order.shippingAddress ? `
                                    <div class="info-item">
                                        <span class="info-label">Shipping Address</span>
                                        <span class="info-value" style="white-space: pre-line;">${order.shippingAddress}</span>
                                    </div>
                                ` : '<p class="text-muted">No shipping address provided.</p>'}
                                
                                ${order.shippingMethod ? `
                                    <div class="info-item">
                                        <span class="info-label">Shipping Method</span>
                                        <span class="info-value">${order.shippingMethod}</span>
                                    </div>
                                ` : ''}
                                
                                ${order.estimatedDelivery ? `
                                    <div class="info-item">
                                        <span class="info-label">Estimated Delivery</span>
                                        <span class="info-value">${new Date(order.estimatedDelivery).toLocaleDateString()}</span>
                                    </div>
                                ` : ''}
                            </div>

                            <!-- Order Items -->
                            <div class="info-panel">
                                <div class="panel-header">
                                    <div class="panel-title">
                                        <i class="fas fa-shopping-cart" style="color: var(--primary-600);"></i>
                                        Order Items (${order.items ? order.items.length : 0})
                                    </div>
                                </div>
                                
                                ${order.items && order.items.length > 0 ? `
                                    <div class="product-list">
                                        ${order.items.map(item => `
                                            <div class="product-row">
                                                <div class="product-icon">
                                                    <i class="fas fa-box"></i>
                                                </div>
                                                <div class="product-details">
                                                    <div class="product-name">${item.name || 'Unnamed Item'}</div>
                                                    <div class="product-meta">
                                                        <span>Qty: ${item.quantity || 1}</span>
                                                        <span>$${parseFloat(item.price || 0).toFixed(2)} each</span>
                                                    </div>
                                                </div>
                                                <div class="product-price">$${((parseFloat(item.price) || 0) * (item.quantity || 1)).toFixed(2)}</div>
                                            </div>
                                        `).join('')}
                                    </div>
                                    <div style="padding-top: 20px; border-top: 2px solid var(--neutral-200); margin-top: 20px;">
                                        <div style="display: flex; justify-content: space-between; align-items: center;">
                                            <span style="font-weight: 600;">Total</span>
                                            <span style="font-size: 28px; font-weight: 800; color: var(--primary-600);">
                                                $${parseFloat(order.totalAmount || 0).toFixed(2)}
                                            </span>
                                        </div>
                                    </div>
                                ` : '<p class="text-muted">No items found</p>'}
                            </div>

                            <!-- Timeline -->
                            <div class="info-panel">
                                <div class="panel-header">
                                    <div class="panel-title">
                                        <i class="fas fa-clock" style="color: var(--primary-600);"></i>
                                        Order Timeline
                                    </div>
                                </div>
                                
                                <div class="timeline">
                                    ${getOrderTimeline(status).map((step, index) => `
                                        <div class="timeline-item ${step.status}">
                                            <div class="timeline-dot"></div>
                                            <div class="timeline-content">
                                                <div class="timeline-date">${step.date}</div>
                                                <div class="timeline-title">${step.title}</div>
                                                <div class="timeline-description">${step.description}</div>
                                            </div>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        </div>

                        <!-- Sidebar -->
                        <div class="details-sidebar">
                            <div class="info-panel">
                                <div class="panel-header">
                                    <div class="panel-title">
                                        <i class="fas fa-cog" style="color: var(--primary-600);"></i>
                                        Quick Actions
                                    </div>
                                </div>
                                
                                <div class="action-group">
                                    <button class="btn btn-primary" onclick="trackOrder('${orderId}')">
                                        <i class="fas fa-map-marker-alt"></i>
                                        Track Order
                                    </button>
                                    <button class="btn" onclick="printInvoice('${orderId}')">
                                        <i class="fas fa-print"></i>
                                        Print Invoice
                                    </button>
                                    <button class="btn" onclick="contactSupport()">
                                        <i class="fas fa-headset"></i>
                                        Contact Support
                                    </button>
                                    ${status !== 'cancelled' && status !== 'delivered' ? `
                                    <button class="btn btn-danger" onclick="cancelOrder('${orderId}')">
                                        <i class="fas fa-times-circle"></i>
                                        Cancel Order
                                    </button>
                                    ` : ''}
                                </div>
                            </div>

                            <div class="info-panel">
                                <div class="panel-header">
                                    <div class="panel-title">
                                        <i class="fas fa-user" style="color: var(--primary-600);"></i>
                                        Customer Information
                                    </div>
                                </div>
                                
                                <div class="info-item">
                                    <span class="info-label">Email</span>
                                    <span class="info-value">${order.customerEmail || currentUserEmail}</span>
                                </div>
                                ${order.customerName ? `
                                <div class="info-item">
                                    <span class="info-label">Name</span>
                                    <span class="info-value">${order.customerName}</span>
                                </div>
                                ` : ''}
                                ${order.customerPhone ? `
                                <div class="info-item">
                                    <span class="info-label">Phone</span>
                                    <span class="info-value">${order.customerPhone}</span>
                                </div>
                                ` : ''}
                            </div>
                        </div>
                    </div>
                </div>
            `;
            
            document.getElementById('detailsContent').innerHTML = detailsHTML;
            history.pushState({ type: 'order', id: orderId }, '', `#order-${orderId}`);
        }

        // Open booking details
        function openBookingDetails(bookingId) {
            const booking = cachedBookings.find(x => (x.id === bookingId || x.bookingId === bookingId));
            if(!booking) return;

            // Switch to details view
            document.getElementById('dashboardView').style.display = 'none';
            document.getElementById('detailsView').style.display = 'block';
            
            const deviceName = booking.deviceDisplayName || `${booking.brand || 'Device'} ${booking.model || ''}`;
            const status = booking.status || booking.service?.status || 'RECEIVED';
            const statusClass = `status-${status.toLowerCase().replace(/_/g, '-')}`;
            
            const detailsHTML = `
                <div class="details-wrapper">
                    <div class="details-hero" style="background: linear-gradient(135deg, #f59e0b, #d97706);">
                        <div class="details-hero-content">
                            <div class="details-badge">
                                <i class="fas fa-tools"></i>
                                SERVICE #${bookingId.substring(0, 8)}
                            </div>
                            <h1 class="details-title">${deviceName}</h1>
                            <p class="details-subtitle">${booking.issue?.description?.substring(0, 100) || 'Service request'}</p>
                        </div>
                    </div>

                    <div class="details-grid">
                        <div class="details-main">
                            <!-- Service Summary -->
                            <div class="info-panel">
                                <div class="panel-header">
                                    <div class="panel-title">
                                        <i class="fas fa-clipboard-check" style="color: #f59e0b;"></i>
                                        Service Summary
                                    </div>
                                    <span class="status-badge ${statusClass}">${status.replace('_', ' ')}</span>
                                </div>
                                
                                <div class="info-grid">
                                    <div class="info-item">
                                        <span class="info-label">Service ID</span>
                                        <span class="info-value">${bookingId}</span>
                                    </div>
                                    <div class="info-item">
                                        <span class="info-label">Service Type</span>
                                        <span class="info-value">${booking.serviceTypeDisplay || booking.service?.type || 'Standard'}</span>
                                    </div>
                                    <div class="info-item">
                                        <span class="info-label">Scheduled Date</span>
                                        <span class="info-value">${booking.formattedDate || (booking.service?.date ? new Date(booking.service.date).toLocaleDateString() : 'Not scheduled')}</span>
                                    </div>
                                    ${booking.trackingNumber ? `
                                    <div class="info-item">
                                        <span class="info-label">Tracking #</span>
                                        <span class="info-value">${booking.trackingNumber}</span>
                                    </div>
                                    ` : ''}
                                </div>
                            </div>

                            <!-- Device Information -->
                            <div class="info-panel">
                                <div class="panel-header">
                                    <div class="panel-title">
                                        <i class="fas fa-mobile-alt" style="color: #f59e0b;"></i>
                                        Device Information
                                    </div>
                                </div>
                                
                                <div class="info-grid">
                                    ${booking.device?.brand ? `
                                    <div class="info-item">
                                        <span class="info-label">Brand</span>
                                        <span class="info-value">${booking.device.brand}</span>
                                    </div>
                                    ` : ''}
                                    ${booking.device?.model ? `
                                    <div class="info-item">
                                        <span class="info-label">Model</span>
                                        <span class="info-value">${booking.device.model}</span>
                                    </div>
                                    ` : ''}
                                    ${booking.device?.serialNumber ? `
                                    <div class="info-item">
                                        <span class="info-label">Serial Number</span>
                                        <span class="info-value">${booking.device.serialNumber}</span>
                                    </div>
                                    ` : ''}
                                    ${booking.device?.condition ? `
                                    <div class="info-item">
                                        <span class="info-label">Condition</span>
                                        <span class="info-value">${booking.device.condition}</span>
                                    </div>
                                    ` : ''}
                                </div>
                            </div>

                            <!-- Issue Details -->
                            <div class="info-panel">
                                <div class="panel-header">
                                    <div class="panel-title">
                                        <i class="fas fa-exclamation-triangle" style="color: #f59e0b;"></i>
                                        Issue Details
                                    </div>
                                </div>
                                
                                <div style="background: var(--neutral-50); padding: 20px; border-radius: var(--radius-lg); margin-bottom: 20px;">
                                    <p style="line-height: 1.6; white-space: pre-wrap;">${booking.issue?.description || booking.issueDescription || 'No description provided'}</p>
                                </div>
                                
                                <div class="info-grid">
                                    ${booking.issue?.category ? `
                                    <div class="info-item">
                                        <span class="info-label">Issue Category</span>
                                        <span class="info-value">${booking.issue.category}</span>
                                    </div>
                                    ` : ''}
                                    ${booking.issue?.liquidDamage !== undefined ? `
                                    <div class="info-item">
                                        <span class="info-label">Liquid Damage</span>
                                        <span class="info-value">${booking.issue.liquidDamage ? 'Yes' : 'No'}</span>
                                    </div>
                                    ` : ''}
                                </div>
                            </div>

                            <!-- Service Timeline -->
                            <div class="info-panel">
                                <div class="panel-header">
                                    <div class="panel-title">
                                        <i class="fas fa-history" style="color: #f59e0b;"></i>
                                        Service Timeline
                                    </div>
                                </div>
                                
                                <div class="timeline">
                                    ${getServiceTimeline(status).map((step, index) => `
                                        <div class="timeline-item ${step.status}">
                                            <div class="timeline-dot"></div>
                                            <div class="timeline-content">
                                                <div class="timeline-date">${step.date}</div>
                                                <div class="timeline-title">${step.title}</div>
                                                <div class="timeline-description">${step.description}</div>
                                            </div>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        </div>

                        <!-- Sidebar -->
                        <div class="details-sidebar">
                            <div class="info-panel">
                                <div class="panel-header">
                                    <div class="panel-title">
                                        <i class="fas fa-cog" style="color: #f59e0b;"></i>
                                        Quick Actions
                                    </div>
                                </div>
                                
                                <div class="action-group">
                                    <button class="btn btn-primary" onclick="contactTechnician('${bookingId}')">
                                        <i class="fas fa-headset"></i>
                                        Contact Technician
                                    </button>
                                    <button class="btn" onclick="rescheduleBooking('${bookingId}')">
                                        <i class="fas fa-calendar-alt"></i>
                                        Reschedule
                                    </button>
                                    <button class="btn" onclick="updateServiceRequest('${bookingId}')">
                                        <i class="fas fa-edit"></i>
                                        Update Request
                                    </button>
                                    ${status !== 'COMPLETED' && status !== 'CANCELLED' ? `
                                    <button class="btn btn-danger" onclick="cancelBooking('${bookingId}')">
                                        <i class="fas fa-times-circle"></i>
                                        Cancel Service
                                    </button>
                                    ` : ''}
                                </div>
                            </div>

                            <div class="info-panel">
                                <div class="panel-header">
                                    <div class="panel-title">
                                        <i class="fas fa-map-marker-alt" style="color: #f59e0b;"></i>
                                        Service Location
                                    </div>
                                </div>
                                
                                ${booking.location?.pickupAddress ? `
                                    <div class="info-item">
                                        <span class="info-label">Address</span>
                                        <span class="info-value" style="white-space: pre-line;">${booking.location.pickupAddress}</span>
                                    </div>
                                ` : '<p class="text-muted">No address provided.</p>'}
                                
                                <div class="info-grid">
                                    ${booking.location?.city ? `
                                    <div class="info-item">
                                        <span class="info-label">City</span>
                                        <span class="info-value">${booking.location.city}</span>
                                    </div>
                                    ` : ''}
                                    ${booking.location?.country ? `
                                    <div class="info-item">
                                        <span class="info-label">Country</span>
                                        <span class="info-value">${booking.location.country}</span>
                                    </div>
                                    ` : ''}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            
            document.getElementById('detailsContent').innerHTML = detailsHTML;
            history.pushState({ type: 'booking', id: bookingId }, '', `#booking-${bookingId}`);
        }

        // Helper functions
        function getOrderTimeline(status) {
            const steps = [
                { title: 'Order Placed', description: 'Your order has been received and confirmed.', date: new Date().toLocaleDateString() },
                { title: 'Processing', description: 'Order is being prepared for shipment.', date: 'Processing' },
                { title: 'Shipped', description: 'Order has been shipped and is on its way.', date: 'Shipped' },
                { title: 'Delivered', description: 'Order has been delivered successfully.', date: 'Delivered' }
            ];
            
            const statusMap = {
                'ordered': 0, 'processing': 1, 'shipped': 2, 'delivered': 3, 'cancelled': -1
            };
            
            const statusIndex = statusMap[status] !== undefined ? statusMap[status] : 0;
            
            return steps.map((step, index) => ({
                ...step,
                status: statusIndex === -1 ? '' : (index < statusIndex ? 'completed' : (index === statusIndex ? 'active' : ''))
            }));
        }

        function getServiceTimeline(status) {
            const steps = [
                { title: 'Request Received', description: 'Your service request has been received.', date: 'Received' },
                { title: 'Confirmed', description: 'Service appointment has been confirmed.', date: 'Confirmed' },
                { title: 'Diagnosis', description: 'Device is being diagnosed by technicians.', date: 'Diagnosis' },
                { title: 'In Progress', description: 'Device repair is currently underway.', date: 'In Progress' },
                { title: 'Testing', description: 'Device is being tested after repair.', date: 'Testing' },
                { title: 'Completed', description: 'Service has been completed successfully.', date: 'Completed' }
            ];
            
            const statusMap = {
                'RECEIVED': 0, 'CONFIRMED': 1, 'DIAGNOSED': 2, 'IN_PROGRESS': 3, 'REPAIRING': 3,
                'TESTING': 4, 'COMPLETED': 5, 'READY_FOR_PICKUP': 5, 'CANCELLED': -1
            };
            
            const statusIndex = statusMap[status] !== undefined ? statusMap[status] : 0;
            
            return steps.map((step, index) => ({
                ...step,
                status: statusIndex === -1 ? '' : (index < statusIndex ? 'completed' : (index === statusIndex ? 'active' : ''))
            }));
        }

        // Navigation
        function goBackToDashboard() {
            document.getElementById('detailsView').style.display = 'none';
            document.getElementById('dashboardView').style.display = 'block';
            history.pushState({}, '', window.location.pathname);
        }

        window.onpopstate = function(event) {
            if (!window.location.hash) {
                goBackToDashboard();
            }
        };

        // Actions
        function trackOrder(orderId) {
            alert(`Tracking information sent to ${currentUserEmail}`);
        }

        function printInvoice(orderId) {
            window.print();
        }

        function contactSupport() {
            alert('Connecting to customer support...');
        }

        async function cancelOrder(orderId) {
            if (!confirm("Are you sure you want to cancel this order?")) return;
            
            try {
                const response = await fetch(`${NEXUS_CONFIG.api.baseUrl}/orders/${orderId}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': currentUserSession.getIdToken().getJwtToken(),
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ status: 'cancelled' })
                });

                if (response.ok) {
                    alert('Order cancelled successfully.');
                    goBackToDashboard();
                    fetchOrders(currentUserEmail, currentUserSession);
                }
            } catch (error) {
                alert('Failed to cancel order: ' + error.message);
            }
        }

        function contactTechnician(bookingId) {
            alert(`Connecting to technician for service #${bookingId.substring(0, 8)}`);
        }

        function rescheduleBooking(bookingId) {
            alert(`Rescheduling service #${bookingId.substring(0, 8)}`);
        }

        function updateServiceRequest(bookingId) {
            alert(`Updating service request #${bookingId.substring(0, 8)}`);
        }

        function cancelBooking(bookingId) {
            if (!confirm("Cancel this service booking?")) return;
            alert(`Cancellation request submitted for service #${bookingId.substring(0, 8)}`);
            goBackToDashboard();
        }

        function openSupportChat() {
            alert('Opening live support chat...');
        }

        function openSettings() {
            alert('Opening account settings...');
        }

        function sessionTerminate() {
            if (!confirm("Are you sure you want to sign out?")) return;
            const userPool = new AmazonCognitoIdentity.CognitoUserPool(poolData);
            const user = userPool.getCurrentUser();
            if(user) { 
                user.signOut(); 
                localStorage.clear(); 
                sessionStorage.clear();
                window.location.href='login.html'; 
            }
        }
    </script>
</body>
</html>
