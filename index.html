<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusFlow | Home</title>
    
    <script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@6.3.7/dist/amazon-cognito-identity.min.js"></script>
    <script src="auth-config.js"></script>
    <script src="header.js" defer></script>

    <style>
        :root {
            --n-cyan: #00f3ff;
            --n-bg: #0a0a0a;
            --n-border: rgba(0, 243, 255, 0.15);
            --n-panel: rgba(255, 255, 255, 0.03);
            --accent: #00f3ff;
        }

        body { background: var(--n-bg); color: white; margin: 0; font-family: 'Inter', sans-serif; padding-top: 120px; }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }

        /* --- THE NEXUS SWITCH --- */
        .mode-switch-container {
            display: flex; justify-content: center; margin-bottom: 50px;
        }
        .mode-switch {
            background: #111; border: 1px solid var(--n-border);
            padding: 5px; border-radius: 50px; display: flex; gap: 5px;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.1);
        }
        .switch-btn {
            padding: 12px 30px; border-radius: 50px; border: none;
            background: transparent; color: #666; cursor: pointer;
            font-family: 'JetBrains Mono', monospace; font-weight: 700;
            text-transform: uppercase; transition: 0.3s;
        }
        .switch-btn.active {
            background: var(--accent); color: #000;
            box-shadow: 0 0 15px var(--accent);
        }

        #nexus-toast {
            position: fixed; bottom: 30px; right: 30px;
            padding: 15px 25px; background: #111;
            border-left: 4px solid var(--n-cyan);
            border-radius: 4px; color: white;
            font-family: 'JetBrains Mono', monospace; font-size: 0.85rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            z-index: 9999; display: none;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        /* Sections */
        .category-section { margin-bottom: 60px; }
        .section-header {
            display: flex; justify-content: space-between; align-items: center;
            border-left: 4px solid var(--accent); padding-left: 15px; margin-bottom: 25px;
        }
        .section-header h2 { font-family: 'JetBrains Mono', monospace; text-transform: uppercase; margin: 0; font-size: 1.4rem; }
        .view-more-link { color: var(--accent); text-decoration: none; font-size: 0.8rem; font-family: 'JetBrains Mono'; text-transform: uppercase; }

        .nexus-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; }
        
        /* Shared Card Base */
        .nexus-card {
            background: var(--n-panel); border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px; padding: 20px; transition: 0.3s;
            display: flex; flex-direction: column; position: relative;
        }
        .nexus-card:hover { border-color: var(--accent); transform: translateY(-5px); box-shadow: 0 10px 30px rgba(0,243,255,0.1); }

        /* Service Specific Card Elements */
        .service-id { font-family: 'JetBrains Mono'; font-size: 0.7rem; color: #666; margin-bottom: 8px; }
        .item-category { font-size: 0.7rem; color: var(--accent); text-transform: uppercase; font-weight: 700; margin-bottom: 5px; }
        .item-name { font-family: 'JetBrains Mono', monospace; font-size: 1.1rem; font-weight: 600; margin-bottom: 10px; min-height: 2.8rem; }
        .item-desc { font-size: 0.85rem; color: #aaa; margin-bottom: 15px; line-height: 1.4; }
        .price-tag { font-size: 1.3rem; font-weight: 800; color: #fff; margin-bottom: 20px; display: flex; align-items: baseline; gap: 5px; }
        .price-tag span { font-size: 0.8rem; color: #666; font-weight: 400; }

        /* Tag Pill Styling for Services */
        .activity-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 20px; }
        .tag { font-size: 0.65rem; background: rgba(0,243,255,0.05); border: 1px solid rgba(0,243,255,0.2); padding: 3px 8px; border-radius: 4px; color: var(--n-cyan); }

        .card-actions { display: flex; gap: 10px; margin-top: auto; }
        .btn-main {
            flex: 1; background: var(--accent); color: #000; font-weight: 700; 
            border: none; padding: 12px; border-radius: 8px; cursor: pointer;
            font-family: 'JetBrains Mono'; text-transform: uppercase; font-size: 0.8rem; transition: 0.2s;
        }
        .btn-main:hover { background: #fff; transform: scale(1.02); }

        .item-image { width: 100%; height: 180px; object-fit: contain; background: #000; margin-bottom: 15px; border-radius: 8px; }

        .loader { text-align: center; padding: 100px; color: #666; font-family: 'JetBrains Mono'; letter-spacing: 2px; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div id="nexus-header-wrapper"></div>
    <div id="nexus-toast"></div>

    <main class="container">
        <div class="mode-switch-container">
            <div class="mode-switch">
                <button id="btn-show-products" class="switch-btn active" onclick="toggleMode('products')">Inventory</button>
                <button id="btn-show-services" class="switch-btn" onclick="toggleMode('services')">Technical Services</button>
            </div>
        </div>

        <div id="products-view">
            <div class="loader">UPLINKING TO INVENTORY...</div>
        </div>

        <div id="services-view" class="hidden">
            <div class="loader">SCANNING SERVICE DATABASE...</div>
        </div>
    </main>

    <script>
        let allProducts = [];
        let allServices = [];
        let servicesLoaded = false;

        async function initPage() {
            await fetchProducts();
        }

        async function fetchProducts() {
            const view = document.getElementById('products-view');
            try {
                const response = await fetch(`${NEXUS_CONFIG.api.baseUrl}/products`);
                allProducts = await response.json();
                renderItems(allProducts, view, 'product');
            } catch (err) {
                view.innerHTML = `<div class="loader">PRODUCT DATALINK OFFLINE</div>`;
            }
        }

        async function fetchServices() {
            if (servicesLoaded) return;
            const view = document.getElementById('services-view');
            try {
                const response = await fetch(`${NEXUS_CONFIG.api.baseUrl}/services`);
                allServices = await response.json();
                renderItems(allServices, view, 'service');
                servicesLoaded = true;
            } catch (err) {
                view.innerHTML = `<div class="loader">SERVICE DATALINK OFFLINE</div>`;
            }
        }

        function renderItems(data, container, type) {
            const groups = data.reduce((acc, item) => {
                const cat = (type === 'product' ? item.category : item.serviceCategory) || "Uncategorized";
                if (!acc[cat]) acc[cat] = [];
                acc[cat].push(item);
                return acc;
            }, {});

            container.innerHTML = ''; 

            for (const [category, items] of Object.entries(groups)) {
                const section = document.createElement('section');
                section.className = 'category-section';
                
                const viewAllLink = type === 'product' ? `shop.html?cat=${category}` : `services.html?cat=${category}`;
                
                section.innerHTML = `
                    <div class="section-header">
                        <h2>${category}</h2>
                        <a href="${viewAllLink}" class="view-more-link">Expand Category</a>
                    </div>
                    <div class="nexus-grid">
                        ${items.slice(0, 8).map(item => type === 'product' ? renderProductCard(item) : renderServiceCard(item)).join('')}
                    </div>
                `;
                container.appendChild(section);
            }
        }

        function renderProductCard(p) {
            return `
            <div class="nexus-card">
                <a href="product-details.html?id=${p.productId}" style="text-decoration:none; color:inherit;">
                    <img src="${p.imageUrl || 'https://via.placeholder.com/250'}" class="item-image">
                    <div class="item-category">${p.category}</div>
                    <div class="item-name">${p.name}</div>
                    <div class="price-tag">$${p.price.toFixed(2)}</div>
                </a>
                <div class="card-actions">
                    <button class="btn-main" onclick="quickAdd('${p.productId}')">Add to Cart</button>
                </div>
            </div>`;
        }

        function renderServiceCard(s) {
            // Get first 2 activities to show as tags
            const tags = s.activities ? s.activities.slice(0, 2).map(a => `<span class="tag">${a}</span>`).join('') : '';
            
            return `
            <div class="nexus-card">
                <div class="service-id">${s.serviceId}</div>
                <div class="item-category">${s.serviceCategory}</div>
                <div class="item-name">${s.serviceName}</div>
                <div class="item-desc">${s.shortDescription || 'Professional technical maintenance and repair.'}</div>
                
                <div class="activity-tags">
                    ${tags}
                </div>

                <div class="price-tag"><span>Starting at</span> $${s.basePrice}</div>
                
                <div class="card-actions">
                    <button class="btn-main" onclick="location.href='service-details.html?id=${s.serviceId}'">Initialize Service</button>
                </div>
            </div>`;
        }

        function toggleMode(mode) {
            const pView = document.getElementById('products-view');
            const sView = document.getElementById('services-view');
            const pBtn = document.getElementById('btn-show-products');
            const sBtn = document.getElementById('btn-show-services');

            if (mode === 'products') {
                pView.classList.remove('hidden');
                sView.classList.add('hidden');
                pBtn.classList.add('active');
                sBtn.classList.remove('active');
            } else {
                pView.classList.add('hidden');
                sView.classList.remove('hidden');
                pBtn.classList.remove('active');
                sBtn.classList.add('active');
                fetchServices();
            }
        }

        function showToast(msg) {
            const t = document.getElementById('nexus-toast');
            t.innerText = msg; t.style.display = 'block';
            setTimeout(() => t.style.display='none', 3000);
        }

        window.onload = initPage;
    </script>
</body>
</html>
