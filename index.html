<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus | Professional Technical Solutions</title>
    
    <script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@6.3.7/dist/amazon-cognito-identity.min.js"></script>
    <script src="auth-config.js"></script>
    <script src="header.js" defer></script>
        <script src="footer.js" defer></script>
    <link rel="stylesheet" href="style.css">

    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-light: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #475569;
            --border-color: #cbd5e1;
        }

        body { 
            background: var(--bg-light); 
            color: var(--text-main); 
            margin: 0; 
            font-family: 'Inter', sans-serif; 
            /* REDUCED SPACE FROM HEADER (Was 130px) */
            padding-top: 120px; 
        }

        .container { max-width: 1400px; margin: 0 auto; padding: 0 20px; }

        /* --- COMPACT MODE SWITCH --- */
        .mode-switch-container {
            display: flex; 
            justify-content: center; 
            margin-bottom: 20px; /* REDUCED SPACE (Was 40px) */
        }
        .mode-switch {
            background: #e2e8f0; 
            padding: 2px; 
            border-radius: 50px; 
            display: flex; 
            border: 1px solid var(--border-color);
            transform: scale(0.9); /* Subtly smaller scale */
        }
        .switch-btn {
            padding: 6px 20px; 
            border-radius: 50px; 
            border: none;
            background: transparent; 
            color: var(--text-muted); 
            cursor: pointer;
            font-weight: 700; 
            font-size: 0.8rem;
            transition: all 0.2s ease;
        }
        .switch-btn.active {
            background: var(--primary); 
            color: white;
            box-shadow: 0 2px 6px rgba(37, 99, 235, 0.2);
        }

        /* Sections */
        .category-section { margin-bottom: 30px; } /* Tightened sections */
        .section-header {
            display: flex; justify-content: space-between; align-items: center;
            border-left: 3px solid var(--primary); padding-left: 12px; margin-bottom: 15px;
        }
        .section-header h2 { text-transform: capitalize; margin: 0; font-size: 1.1rem; font-weight: 800; color: var(--text-main); }
        .view-more-link { color: var(--primary); text-decoration: none; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; }

        /* EXTRA COMPACT GRID */
        .nexus-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); 
            gap: 15px; 
        }
        
        /* Smaller Card Design */
        .nexus-card {
            background: var(--card-bg); border: 1px solid var(--border-color);
            border-radius: 10px; padding: 12px; transition: all 0.3s ease;
            display: flex; flex-direction: column;
        }
        .nexus-card:hover { 
            transform: translateY(-3px); 
            box-shadow: 0 8px 15px -5px rgba(0,0,0,0.1);
        }

        .item-category { font-size: 0.6rem; color: var(--primary); text-transform: uppercase; font-weight: 800; margin-bottom: 3px; }
        .item-name { font-size: 0.85rem; font-weight: 700; margin-bottom: 8px; min-height: 2.2rem; line-height: 1.2; color: var(--text-main); }
        .item-desc { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 12px; line-height: 1.3; height: 32px; overflow: hidden; }
        .price-tag { font-size: 1rem; font-weight: 800; color: var(--text-main); margin-bottom: 12px; }
        .price-tag span { font-size: 0.7rem; color: var(--text-muted); font-weight: 500; }

        .btn-main {
            width: 100%; background: var(--primary); color: white; font-weight: 700; 
            border: none; padding: 8px; border-radius: 5px; cursor: pointer;
            font-size: 0.75rem; transition: background 0.2s;
        }

        .item-image { width: 100%; height: 110px; object-fit: contain; margin-bottom: 10px; background: #f8fafc; border-radius: 4px; }

        .loader { text-align: center; padding: 60px; color: var(--text-muted); font-size: 0.8rem; }
        .hidden { display: none; }

        #nexus-toast {
            position: fixed; bottom: 20px; right: 20px;
            padding: 12px 20px; background: var(--text-main);
            border-radius: 8px; color: white; font-size: 0.85rem; z-index: 9999; display: none;
        }
    </style>
</head>
<body>

    <div id="nexus-header-wrapper"></div>
    <div id="nexus-toast"></div>

    <main class="container">
        <div class="mode-switch-container">
            <div class="mode-switch">
                <button id="btn-show-products" class="switch-btn active" onclick="toggleMode('products')">products</button>
                <button id="btn-show-services" class="switch-btn" onclick="toggleMode('services')">Repair Services</button>
            </div>
        </div>

        <div id="products-view">
            <div class="loader">SYNCHRONIZING products...</div>
        </div>

        <div id="services-view" class="hidden">
            <div class="loader">RETRIEVING SERVICE PROTOCOLS...</div>
        </div>
    </main>

    <script>
        let allProducts = [];
        let allServices = [];
        let servicesLoaded = false;

        async function initPage() {
            await fetchProducts();
        }

        async function fetchProducts() {
            const view = document.getElementById('products-view');
            try {
                const response = await fetch(`${NEXUS_CONFIG.api.baseUrl}/products`);
                allProducts = await response.json();
                renderItems(allProducts, view, 'product');
            } catch (err) {
                view.innerHTML = `<div class="loader">Unable to connect to products server.</div>`;
            }
        }

        async function fetchServices() {
            if (servicesLoaded) return;
            const view = document.getElementById('services-view');
            try {
                const response = await fetch(`${NEXUS_CONFIG.api.baseUrl}/services`);
                allServices = await response.json();
                renderItems(allServices, view, 'service');
                servicesLoaded = true;
            } catch (err) {
                view.innerHTML = `<div class="loader">Service database is currently offline.</div>`;
            }
        }

        function renderItems(data, container, type) {
            const groups = data.reduce((acc, item) => {
                const cat = (type === 'product' ? item.category : item.serviceCategory) || "General";
                if (!acc[cat]) acc[cat] = [];
                acc[cat].push(item);
                return acc;
            }, {});

            container.innerHTML = ''; 

            for (const [category, items] of Object.entries(groups)) {
                const section = document.createElement('section');
                section.className = 'category-section';
                
                const viewAllLink = type === 'product' ? `shop.html?cat=${encodeURIComponent(category)}` : `services.html?cat=${encodeURIComponent(category)}`;
                
                section.innerHTML = `
                    <div class="section-header">
                        <h2>${category}</h2>
                        <a href="${viewAllLink}" class="view-more-link">View All</a>
                    </div>
                    <div class="nexus-grid">
                        ${items.slice(0, 6).map(item => type === 'product' ? renderProductCard(item) : renderServiceCard(item)).join('')}
                    </div>
                `;
                container.appendChild(section);
            }
        }

        function renderProductCard(p) {
            return `
            <div class="nexus-card">
                <a href="product-details.html?id=${p.productId}" style="text-decoration:none; color:inherit;">
                    <img src="${p.imageUrl || 'https://via.placeholder.com/150'}" class="item-image">
                    <div class="item-category">${p.category}</div>
                    <div class="item-name">${p.name}</div>
                    <div class="price-tag">$${parseFloat(p.price).toFixed(2)}</div>
                </a>
                <button class="btn-main" onclick="quickAdd('${p.productId}')">Add to Cart</button>
            </div>`;
        }

        function renderServiceCard(s) {
            return `
            <div class="nexus-card">
                <div class="item-category">${s.serviceCategory}</div>
                <div class="item-name">${s.serviceName}</div>
                <div class="item-desc">${s.shortDescription || 'Professional diagnostic and repair services.'}</div>
                <div class="price-tag"><span>From</span> $${s.basePrice}</div>
                <button class="btn-main" onclick="location.href='service-details.html?id=${s.serviceId}'">Book Service</button>
            </div>`;
        }

        function toggleMode(mode) {
            const pView = document.getElementById('products-view');
            const sView = document.getElementById('services-view');
            const pBtn = document.getElementById('btn-show-products');
            const sBtn = document.getElementById('btn-show-services');

            if (mode === 'products') {
                pView.classList.remove('hidden');
                sView.classList.add('hidden');
                pBtn.classList.add('active');
                sBtn.classList.remove('active');
            } else {
                pView.classList.add('hidden');
                sView.classList.remove('hidden');
                pBtn.classList.remove('active');
                sBtn.classList.add('active');
                fetchServices();
            }
        }

        function showToast(msg) {
            const t = document.getElementById('nexus-toast');
            t.innerText = msg; t.style.display = 'block';
            setTimeout(() => t.style.display='none', 3000);
        }

        function quickAdd(id) {
            const p = allProducts.find(item => item.productId === id);
            if (!p) return;
            let cart = JSON.parse(localStorage.getItem('nexus_cart')) || [];
            cart.push({ productId: p.productId, name: p.name, price: p.price, imageUrl: p.imageUrl });
            localStorage.setItem('nexus_cart', JSON.stringify(cart));
            if (window.updateHeaderBadges) window.updateHeaderBadges();
            showToast("Added to cart.");
        }

        window.onload = initPage;
    </script>
</body>
</html>
