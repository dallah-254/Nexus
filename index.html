<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusFlow | Home</title>
    
    <script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@6.3.7/dist/amazon-cognito-identity.min.js"></script>
    <script src="auth-config.js"></script>
    <script src="header.js" defer></script>

    <style>
        :root {
            --n-cyan: #00f3ff;
            --n-bg: #0a0a0a;
            --n-border: rgba(0, 243, 255, 0.15);
            --n-panel: rgba(255, 255, 255, 0.03);
            --accent: #00f3ff; /* Matching Shop Page Variable */
        }

        body { background: var(--n-bg); color: white; margin: 0; font-family: 'Inter', sans-serif; padding-top: 120px; }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }

        /* Notification Toast Styling (Matching Shop style alert) */
        #nexus-toast {
            position: fixed; bottom: 30px; right: 30px;
            padding: 15px 25px; background: #111;
            border-left: 4px solid var(--n-cyan);
            border-radius: 4px; color: white;
            font-family: 'JetBrains Mono', monospace; font-size: 0.85rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            z-index: 9999; display: none;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        /* Category Sections */
        .category-section { margin-bottom: 60px; }
        .section-header {
            display: flex; justify-content: space-between; align-items: center;
            border-left: 4px solid var(--accent); padding-left: 15px; margin-bottom: 25px;
        }
        .section-header h2 { font-family: 'JetBrains Mono', monospace; text-transform: uppercase; margin: 0; font-size: 1.4rem; }
        .view-more-link { color: var(--accent); text-decoration: none; font-size: 0.8rem; font-family: 'JetBrains Mono'; text-transform: uppercase; }

        /* Product Grid & Cards */
        .nexus-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 25px; }
        
        .product-card {
            background: var(--n-panel); border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px; padding: 15px; transition: 0.3s;
            display: flex; flex-direction: column; position: relative;
        }
        .product-card:hover { border-color: var(--accent); transform: translateY(-5px); }

        /* Clickable Area */
        .product-link { text-decoration: none; color: inherit; display: block; margin-bottom: 10px; }
        .product-image { width: 100%; height: 180px; object-fit: contain; background: #000; margin-bottom: 12px; border-radius: 8px; }
        .product-category { font-size: 0.7rem; color: var(--accent); text-transform: uppercase; font-weight: 700; margin-bottom: 5px; }
        .product-name { font-size: 1rem; font-weight: 600; height: 2.6rem; overflow: hidden; margin-bottom: 5px; }
        .product-price { font-size: 1.1rem; font-weight: 800; color: #fff; margin-bottom: 15px; }

        /* Actions */
        .card-actions { display: flex; gap: 8px; margin-top: auto; }
        .btn-action {
            flex: 1; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            color: white; padding: 10px 5px; font-size: 0.75rem; border-radius: 6px;
            cursor: pointer; transition: 0.2s;
        }
        .btn-cart { background: var(--accent); color: #000; font-weight: 700; border: none; }
        .btn-cart:hover { background: #fff; }
        .btn-wish:hover { background: #ff0055; color: white; }

        .loader { text-align: center; padding: 100px; color: #666; font-size: 1.1rem; }
    </style>
</head>
<body>

    <div id="nexus-header-wrapper"></div>
    <div id="nexus-toast"></div>

    <main class="container" id="main-content">
        <div class="loader">Accessing inventory stream...</div>
    </main>

    <script>
        let allProducts = [];

        async function initPage() {
            const container = document.getElementById('main-content');
            try {
                // Using the exact endpoint from your shop page
                const response = await fetch(`${NEXUS_CONFIG.api.baseUrl}/products`);
                allProducts = await response.json();

                // Group by Category
                const groups = allProducts.reduce((acc, p) => {
                    const cat = p.category || "Hardware";
                    if (!acc[cat]) acc[cat] = [];
                    acc[cat].push(p);
                    return acc;
                }, {});

                container.innerHTML = ''; 

                for (const [category, items] of Object.entries(groups)) {
                    const section = document.createElement('section');
                    section.className = 'category-section';
                    
                    // Render 4 products per category
                    section.innerHTML = `
                        <div class="section-header">
                            <h2>${category}</h2>
                            <a href="category.html?cat=${category.toLowerCase()}" class="view-more-link">View All</a>
                        </div>
                        <div class="nexus-grid">
                            ${items.slice(0, 4).map(p => `
                                <div class="product-card">
                                    <a href="product-details.html?id=${p.productId}" class="product-link">
                                        <img src="${p.imageUrl || 'https://via.placeholder.com/250'}" class="product-image">
                                        <div class="product-category">${p.category || 'Hardware'}</div>
                                        <div class="product-name">${p.name}</div>
                                        <div class="product-price">$${p.price.toFixed(2)}</div>
                                    </a>
                                    <div class="card-actions">
                                        <button class="btn-action btn-cart" onclick="quickAdd('${p.productId}')">Add to Cart</button>
                                        <button class="btn-action btn-wish" onclick="quickWish('${p.productId}')">♥</button>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    `;
                    container.appendChild(section);
                }
            } catch (err) {
                console.error(err);
                container.innerHTML = `<div class="loader">Failed to connect to inventory server.</div>`;
            }
        }

        // Notification System
        function showToast(message) {
            const toast = document.getElementById('nexus-toast');
            toast.innerText = message;
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 3000);
        }

        function quickAdd(id) {
            const product = allProducts.find(p => p.productId === id);
            if (!product) return;

            let cart = JSON.parse(localStorage.getItem('nexus_cart')) || [];
            cart.push({
                productId: product.productId,
                name: product.name,
                price: product.price,
                imageUrl: product.imageUrl
            });
            
            localStorage.setItem('nexus_cart', JSON.stringify(cart));
            
            if (window.updateHeaderBadges) window.updateHeaderBadges();
            showToast(`${product.name} added to cart`);
        }

        function quickWish(id) {
            let wishlist = JSON.parse(localStorage.getItem('nexus_wishlist')) || [];
            if (!wishlist.includes(id)) {
                wishlist.push(id);
                localStorage.setItem('nexus_wishlist', JSON.stringify(wishlist));
                showToast("Added to Wishlist");
            } else {
                showToast("Already in Wishlist");
            }
        }

        window.onload = initPage;
    </script>
</body>
</html>
