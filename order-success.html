<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus | Order Complete</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/aws-sdk/2.1522.0/aws-sdk.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@6.3.7/dist/amazon-cognito-identity.min.js"></script>
    
    <script src="auth-config.js"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="header.css">

    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-light: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --success: #10b981;
        }

        body { 
            background: var(--bg-light); 
            color: var(--text-main); 
            font-family: 'Inter', sans-serif; 
            margin: 0; 
            padding-top: 120px; 
        }

        .success-card {
            max-width: 550px;
            margin: 40px auto;
            text-align: center;
            padding: 50px 40px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .check-icon {
            width: 80px;
            height: 80px;
            background: #ecfdf5;
            color: var(--success);
            font-size: 2.5rem;
            line-height: 80px;
            border-radius: 50%;
            margin: 0 auto 25px;
            display: block;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 10px;
            color: var(--text-main);
        }

        .order-id-box {
            background: #f1f5f9;
            padding: 18px;
            border-radius: 12px;
            font-family: 'JetBrains Mono', monospace;
            color: var(--primary);
            font-size: 1rem;
            font-weight: 700;
            margin: 25px 0;
            border: 1px solid var(--border-color);
        }

        .details-list {
            text-align: left;
            margin: 30px 0;
            padding: 24px;
            background: #fff;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .detail-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            font-size: 0.95rem;
            border-bottom: 1px solid #f8fafc;
            padding-bottom: 10px;
        }

        .detail-item:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .detail-label { color: var(--text-muted); font-weight: 500; }
        .detail-value { color: var(--text-main); font-weight: 700; }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
            text-decoration: none;
        }

        .btn-primary:hover {
            background: var(--primary-hover);
        }

        .btn-text {
            background: transparent;
            color: var(--text-muted);
            border: none;
            padding: 10px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            text-decoration: none;
        }

        .btn-text:hover {
            color: var(--primary);
        }
    </style>
</head>
<body>

<div id="nexus-header-wrapper"></div>

<div class="container">
    <div class="success-card">
        <div class="check-icon">✓</div>
        <h1>Order Confirmed</h1>
        <p style="color: var(--text-muted);">Thank you. Your transaction has been processed successfully and your items are being prepared.</p>

        <div class="order-id-box">
            ORDER ID: <span id="display-id">PROCESSING...</span>
        </div>

        <div class="details-list">
            <div class="detail-item">
                <span class="detail-label">Status:</span>
                <span style="color: var(--success); font-weight: 800;">Confirmed</span>
            </div>
            <div class="detail-item">
                <span class="detail-label">Amount Paid:</span>
                <span id="display-total" class="detail-value">$0.00</span>
            </div>
            <div class="detail-item">
                <span class="detail-label">Confirmation Sent To:</span>
                <span id="display-email" class="detail-value">---</span>
            </div>
        </div>

        <div class="btn-group">
            <button class="btn-primary" onclick="window.location.href='profile.html'">View Order History</button>
            <a href="shop.html" class="btn-text">Return to Shop</a>
        </div>
    </div>
</div>

<script src="header.js"></script>
<script>
    window.onload = function() {
        const orderDataRaw = sessionStorage.getItem('lastOrder');
        
        if (!orderDataRaw) {
            window.location.href = 'shop.html';
            return;
        }

        try {
            const orderData = JSON.parse(orderDataRaw);
            
            document.getElementById('display-id').innerText = orderData.id || "ID-PENDING";
            document.getElementById('display-total').innerText = "$" + parseFloat(orderData.total).toFixed(2);
            document.getElementById('display-email').innerText = orderData.email || "Registered Account Email";

            // Optional: Clear cart since purchase is successful
            localStorage.removeItem('nexus_cart');
            if (window.updateHeaderBadges) window.updateHeaderBadges();

        } catch (e) {
            console.error("Error reading order data", e);
            document.getElementById('display-id').innerText = "DATA-RECOVERY-ERR";
        }
    };
</script>
</body>
</html>
