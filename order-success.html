<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusFlow | Transaction Complete</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/aws-sdk/2.1522.0/aws-sdk.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@6.3.7/dist/amazon-cognito-identity.min.js"></script>
    
    <script src="auth-config.js"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="header.css">

    <style>
        body { padding-top: 100px; } /* Uniform offset for header */

        .success-card {
            max-width: 600px;
            margin: 40px auto;
            text-align: center;
            padding: 40px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-cyan);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            animation: fadeIn 0.8s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .check-icon {
            font-size: 4rem;
            color: #10b981;
            margin-bottom: 20px;
            display: block;
            text-shadow: 0 0 20px rgba(16, 185, 129, 0.3);
        }

        .order-id-box {
            background: rgba(0, 243, 255, 0.05);
            padding: 15px;
            border-radius: 10px;
            font-family: 'JetBrains Mono', monospace;
            color: var(--accent);
            font-size: 1.1rem;
            margin: 20px 0;
            border: 1px dashed var(--accent);
        }

        .details-list {
            text-align: left;
            margin: 30px 0;
            padding: 20px;
            background: rgba(255,255,255,0.03);
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .detail-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 0.9rem;
        }

        .detail-label { color: var(--text-dim); }
        .detail-value { font-family: 'JetBrains Mono', monospace; }
    </style>
</head>
<body>

<div id="nexus-header-wrapper"></div>

<div class="container">
    <div class="success-card">
        <span class="check-icon">✓</span>
        <h1 style="margin-bottom: 10px;">Order <span class="text-accent">Verified</span></h1>
        <p class="text-dim">Your hardware acquisition protocol has been initiated.</p>

        <div class="order-id-box">
            SIGNAL ID: <span id="display-id">GENERATING...</span>
        </div>

        <div class="details-list">
            <div class="detail-item">
                <span class="detail-label">Logistics Status:</span>
                <span style="color: #10b981;">Processing</span>
            </div>
            <div class="detail-item">
                <span class="detail-label">Total Credits:</span>
                <span id="display-total" class="text-accent">$0.00</span>
            </div>
            <div class="detail-item">
                <span class="detail-label">Deployment Notification:</span>
                <span id="display-email" class="detail-value">---</span>
            </div>
        </div>

        <button class="btn btn-primary" onclick="window.location.href='profile.html'" style="width: 100%;">Track Order in Profile</button>
        <button class="btn btn-outline" onclick="window.location.href='shop.html'" style="width: 100%; margin-top: 15px; border: none;">Continue Procurement</button>
    </div>
</div>

<script src="header.js"></script>
<script>
    window.onload = function() {
        const orderDataRaw = sessionStorage.getItem('lastOrder');
        
        if (!orderDataRaw) {
            window.location.href = 'shop.html';
            return;
        }

        try {
            const orderData = JSON.parse(orderDataRaw);
            
            document.getElementById('display-id').innerText = orderData.id || "ID-PENDING";
            document.getElementById('display-total').innerText = "$" + orderData.total;
            
            // Fallback for email if not in orderData (can pull from Cognito if needed)
            document.getElementById('display-email').innerText = orderData.email || "Sent to Registered Email";

        } catch (e) {
            console.error("Error reading order data", e);
            document.getElementById('display-id').innerText = "ERROR-RTV";
        }
    };
</script>
</body>
</html>
