<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Details | Nexus Flow</title>
    
    <script src="auth-config.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@6.3.7/dist/amazon-cognito-identity.min.js"></script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #2563eb;
            --success: #059669;
            --danger: #dc2626;
            --gray-100: #f1f5f9;
            --text-main: #1e293b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8fafc;
            color: var(--text-main);
            line-height: 1.6;
            margin: 0;
            padding: 20px;
        }

        .container { max-width: 900px; margin: 0 auto; }
        
        .card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        .header-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--gray-100);
            padding-bottom: 15px;
            margin-bottom: 15px;
        }

        .status-badge {
            padding: 6px 16px;
            border-radius: 50px;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 12px;
        }

        .status-ordered { background: #dbeafe; color: #1e40af; }
        .status-shipped { background: #fef3c7; color: #92400e; }
        .status-cancelled { background: #fee2e2; color: #991b1b; }

        .item-grid {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            gap: 10px;
            padding: 10px 0;
            border-bottom: 1px solid var(--gray-100);
        }

        #loading-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .btn {
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
        }

        .btn-danger { background: var(--danger); color: white; }
        .btn-danger:hover { background: #b91c1c; }

        #error-view { display: none; text-align: center; padding: 40px; }
    </style>
</head>
<body>

<div id="loading-overlay">
    <i class="fas fa-circle-notch fa-spin fa-3x" style="color: var(--primary);"></i>
    <p>Loading Order Data...</p>
</div>

<div class="container">
    <div id="error-view" class="card">
        <h2 style="color: var(--danger);">Unable to Load Order</h2>
        <p id="error-text"></p>
        <button class="btn" onclick="window.location.href='profile.html'">Back to Profile</button>
    </div>

    <div id="main-content" style="display: none;">
        <div style="margin-bottom: 20px;">
            <a href="profile.html" style="text-decoration: none; color: var(--primary);">
                <i class="fas fa-chevron-left"></i> Back to My Orders
            </a>
        </div>

        <div class="card">
            <div class="header-flex">
                <div>
                    <h1 style="margin:0;">Order #<span id="order-id-val"></span></h1>
                    <p style="color: #64748b; margin: 5px 0 0 0;">Placed on <span id="order-date-val"></span></p>
                </div>
                <div id="status-val" class="status-badge"></div>
            </div>
        </div>

        <div class="card">
            <h3>Shipment Details</h3>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                <div>
                    <p><strong>Shipping To:</strong></p>
                    <div id="address-val" style="white-space: pre-line;"></div>
                </div>
                <div id="cancel-section">
                    <p><strong>Actions:</strong></p>
                    <button class="btn btn-danger" onclick="cancelOrder()">Request Cancellation</button>
                </div>
            </div>
        </div>

        <div class="card">
            <h3>Order Summary</h3>
            <div id="items-container"></div>
            <div style="text-align: right; margin-top: 20px;">
                <h2 style="margin:0;">Total: $<span id="total-val"></span></h2>
            </div>
        </div>
    </div>
</div>

<script>
    let currentOrder = null;
    let userSession = null;

    // --- SAFETY CHECK: Wait for Config ---
    async function waitForConfig() {
        let retries = 0;
        while (typeof NEXUS_CONFIG === 'undefined' && retries < 30) {
            await new Promise(res => setTimeout(res, 100));
            retries++;
        }
        if (typeof NEXUS_CONFIG === 'undefined') throw new Error("Config script (auth-config.js) not found.");
    }

    // --- AUTH: Get Cognito Session ---
    function getCognitoSession() {
        return new Promise((resolve, reject) => {
            const poolData = { 
                UserPoolId: NEXUS_CONFIG.cognito.userPoolId, 
                ClientId: NEXUS_CONFIG.cognito.clientId 
            };
            const userPool = new AmazonCognitoIdentity.CognitoUserPool(poolData);
            const cognitoUser = userPool.getCurrentUser();

            if (!cognitoUser) return resolve(null);

            cognitoUser.getSession((err, session) => {
                if (err) reject(err);
                else resolve(session);
            });
        });
    }

    window.onload = async function() {
        try {
            await waitForConfig();
            
            userSession = await getCognitoSession();
            if (!userSession) {
                window.location.href = 'login.html';
                return;
            }

            const urlParams = new URLSearchParams(window.location.search);
            const orderId = urlParams.get('orderId');

            if (!orderId || orderId === 'undefined') {
                throw new Error("Invalid Order ID provided in URL.");
            }

            await fetchOrder(orderId);

        } catch (err) {
            showError(err.message);
        }
    };

    async function fetchOrder(orderId) {
        try {
            const email = userSession.getIdToken().payload.email;
            // IMPORTANT: API Gateway URL + orderId path + email query
            const url = `${NEXUS_CONFIG.api.baseUrl}/orders/${orderId}?email=${encodeURIComponent(email)}`;

            const response = await fetch(url, {
                method: 'GET',
                headers: {
                    'Authorization': userSession.getIdToken().getJwtToken(),
                    'Content-Type': 'application/json'
                }
            });

            if (!response.ok) {
                const errorData = await response.json();
                throw new Error(errorData.error || `Server returned ${response.status}`);
            }

            currentOrder = await response.json();
            renderPage();

        } catch (err) {
            showError("API Error: " + err.message);
        }
    }

    function renderPage() {
        document.getElementById('loading-overlay').style.display = 'none';
        document.getElementById('main-content').style.display = 'block';

        document.getElementById('order-id-val').textContent = currentOrder.orderId;
        document.getElementById('order-date-val').textContent = new Date(currentOrder.createdAt).toLocaleDateString();
        document.getElementById('total-val').textContent = parseFloat(currentOrder.totalAmount || currentOrder.total).toFixed(2);
        
        const status = (currentOrder.status || 'ordered').toLowerCase();
        const statusEl = document.getElementById('status-val');
        statusEl.textContent = status;
        statusEl.className = `status-badge status-${status}`;

        // Handle Address Object or String
        const addr = currentOrder.shippingAddress;
        document.getElementById('address-val').textContent = typeof addr === 'object' 
            ? `${addr.fullName}\n${addr.street}\n${addr.city}, ${addr.state} ${addr.zipCode}` 
            : addr;

        // Render Items
        const itemsContainer = document.getElementById('items-container');
        itemsContainer.innerHTML = (currentOrder.items || []).map(item => `
            <div class="item-grid">
                <span><strong>${item.name}</strong></span>
                <span style="text-align: center;">Qty: ${item.quantity}</span>
                <span style="text-align: right;">$${parseFloat(item.price).toFixed(2)}</span>
            </div>
        `).join('');

        if (status === 'cancelled') {
            document.getElementById('cancel-section').style.display = 'none';
        }
    }

    async function cancelOrder() {
        if (!confirm("Are you sure you want to cancel this order?")) return;

        try {
            const email = userSession.getIdToken().payload.email;
            const url = `${NEXUS_CONFIG.api.baseUrl}/orders/${currentOrder.orderId}?email=${encodeURIComponent(email)}`;

            const response = await fetch(url, {
                method: 'PUT',
                headers: {
                    'Authorization': userSession.getIdToken().getJwtToken(),
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ status: 'cancelled' })
            });

            if (response.ok) {
                alert("Order successfully cancelled.");
                location.reload();
            } else {
                throw new Error("Failed to cancel order.");
            }
        } catch (err) {
            alert(err.message);
        }
    }

    function showError(msg) {
        document.getElementById('loading-overlay').style.display = 'none';
        document.getElementById('main-content').style.display = 'none';
        document.getElementById('error-view').style.display = 'block';
        document.getElementById('error-text').textContent = msg;
    }
</script>

</body>
</html>
