<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusFlow | Service Intelligence</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .service-container {
            max-width: 1000px;
            margin: 40px auto;
        }

        .hero-banner {
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.1) 0%, rgba(0,0,0,0) 100%);
            border: 1px solid rgba(255,255,255,0.05);
            padding: 40px;
            border-radius: 24px;
            margin-bottom: 30px;
        }

        .meta-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }

        .meta-item {
            background: rgba(255, 255, 255, 0.03);
            padding: 20px;
            border-radius: 12px;
            border-left: 3px solid var(--accent);
        }

        .meta-item label {
            display: block;
            font-size: 0.7rem;
            text-transform: uppercase;
            color: var(--text-secondary);
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .meta-item span {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .content-split {
            display: grid;
            grid-template-columns: 1.5fr 1fr;
            gap: 30px;
        }

        .inclusion-list {
            list-style: none;
            padding: 0;
        }

        .inclusion-list li {
            padding: 12px 0;
            display: flex;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            color: var(--text-secondary);
        }

        .inclusion-list li::before {
            content: "→";
            color: var(--accent);
            margin-right: 15px;
            font-weight: bold;
        }

        .price-card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            height: fit-content;
            position: sticky;
            top: 100px;
        }

        .price-card label { color: #666; font-size: 0.9rem; }
        .price-value { font-size: 3rem; font-weight: 800; color: #000; margin: 10px 0; }

        @media (max-width: 850px) {
            .content-split { grid-template-columns: 1fr; }
            .price-card { position: static; }
        }
    </style>
</head>
<body>

<nav class="navbar">
    <a href="index.html" class="logo">NEXUS<span style="color:white">FLOW</span></a>
    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="shop.html">Shop</a>
        <a href="book-repair.html">Book Repair</a>
        <a href="cart.html" class="cart-link" id="header-cart">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="var(--accent)">
                <path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/>
            </svg>
            <span class="cart-count" id="cart-badge">0</span>
        </a>
    </div>
</nav>

<div class="container service-container" id="main-content">
    <div style="text-align: center; padding: 100px;">
        <h2 style="color: var(--text-secondary)">Decrypting Service Protocols...</h2>
    </div>
</div>

<script>
    const API_URL = 'https://yskkdnff93.execute-api.us-east-1.amazonaws.com/prod/Services/details';

    window.onload = async function() {
        updateHeaderCart();
        const params = new URLSearchParams(window.location.search);
        const serviceId = params.get('id');

        if (!serviceId) {
            document.getElementById('main-content').innerHTML = "<h2>Protocol Error: Service ID Missing.</h2>";
            return;
        }

        try {
            const res = await fetch(`${API_URL}?id=${serviceId}`);
            const data = await res.json();
            if (!res.ok) throw new Error("Service not found");

            document.getElementById('main-content').innerHTML = `
                <div class="hero-banner">
                    <a href="services.html" style="color:var(--accent); text-decoration:none; font-weight:600; font-size:0.9rem;">← RETURN TO CATALOG</a>
                    <h1 style="font-size: 3rem; margin: 20px 0 10px 0;">${data.serviceName}</h1>
                    <p style="color:var(--text-secondary); max-width: 600px;">Internal Service Code: ${data.serviceId}</p>
                    
                    <div class="meta-grid">
                        <div class="meta-item"><label>TAT (Turnaround)</label><span>${data.duration}</span></div>
                        <div class="meta-item"><label>Nexus Guarantee</label><span>${data.warranty}</span></div>
                        <div class="meta-item"><label>Classification</label><span>${data.category}</span></div>
                    </div>
                </div>

                <div class="content-split">
                    <div class="details-pane">
                        <h3 style="color:var(--accent)">Operational Overview</h3>
                        <p style="line-height: 1.8; color: var(--text-secondary); font-size: 1.1rem; margin-bottom: 40px;">
                            ${data.longDescription}
                        </p>

                        <div class="card">
                            <h3 style="margin-top:0">Service Inclusions</h3>
                            <ul class="inclusion-list">
                                ${data.activities.map(act => `<li>${act}</li>`).join('')}
                            </ul>
                        </div>
                    </div>

                    <div class="action-pane">
                        <div class="price-card">
                            <label>Starting Configuration At</label>
                            <div class="price-value">$${data.basePrice.toFixed(2)}</div>
                            <p style="color:#666; font-size: 0.8rem; margin-bottom: 25px;">Final quote generated after diagnostic verification.</p>
                            <a href="book.html?service=${data.serviceId}" class="btn btn-primary" style="display:block; width:100%; box-sizing:border-box;">Initiate Repair</a>
                        </div>
                    </div>
                </div>
            `;
        } catch (err) {
            document.getElementById('main-content').innerHTML = `<div class='card' style='text-align:center'><h2>Service Offline</h2><p>${err.message}</p></div>`;
        }
    };

    function updateHeaderCart() {
        const cart = JSON.parse(localStorage.getItem('nexus_cart')) || [];
        const badge = document.getElementById('cart-badge');
        if (badge) {
            badge.innerText = cart.length;
            badge.style.display = cart.length > 0 ? 'block' : 'none';
        }
    }
</script>
</body>
</html>
