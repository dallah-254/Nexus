<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusFlow | Service Intelligence</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/aws-sdk/2.1522.0/aws-sdk.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@6.3.7/dist/amazon-cognito-identity.min.js"></script>
    <script src="auth-config.js"></script>
    
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="header.css">
    <style>
        .service-container {
            max-width: 1000px;
            margin: 40px auto;
        }

        .hero-banner {
            background: linear-gradient(135deg, rgba(0, 243, 255, 0.1) 0%, rgba(0,0,0,0) 100%);
            border: 1px solid rgba(255,255,255,0.05);
            padding: 40px;
            border-radius: 24px;
            margin-bottom: 30px;
        }

        .meta-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }

        .meta-item {
            background: rgba(255, 255, 255, 0.03);
            padding: 20px;
            border-radius: 12px;
            border-left: 3px solid var(--accent);
        }

        .meta-item label {
            display: block;
            font-size: 0.7rem;
            text-transform: uppercase;
            color: var(--text-secondary);
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .meta-item span {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .content-split {
            display: grid;
            grid-template-columns: 1.5fr 1fr;
            gap: 30px;
        }

        .inclusion-list {
            list-style: none;
            padding: 0;
        }

        .inclusion-list li {
            padding: 12px 0;
            display: flex;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            color: var(--text-secondary);
        }

        .inclusion-list li::before {
            content: "→";
            color: var(--accent);
            margin-right: 15px;
            font-weight: bold;
        }

        .price-card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            height: fit-content;
            position: sticky;
            top: 100px;
            color: #000;
        }

        .price-card label { color: #666; font-size: 0.9rem; }
        .price-value { font-size: 3rem; font-weight: 800; color: #000; margin: 10px 0; }

        @media (max-width: 850px) {
            .content-split { grid-template-columns: 1fr; }
            .price-card { position: static; }
        }
    </style>
</head>
<body>

<div id="nexus-header-wrapper"></div>

<div class="container service-container" id="main-content">
    <div style="text-align: center; padding: 100px;">
        <h2 style="color: var(--text-secondary)">Decrypting Service Protocols...</h2>
    </div>
</div>

<script src="header.js"></script>
<script>
    const API_URL = 'https://yskkdnff93.execute-api.us-east-1.amazonaws.com/prod/Services/details';

    window.onload = async function() {
        const params = new URLSearchParams(window.location.search);
        const serviceId = params.get('id');

        if (!serviceId) {
            document.getElementById('main-content').innerHTML = "<h2>Protocol Error: Service ID Missing.</h2>";
            return;
        }

        try {
            const res = await fetch(`${API_URL}?id=${serviceId}`);
            const data = await res.json();
            if (!res.ok) throw new Error("Service not found");

            document.getElementById('main-content').innerHTML = `
                <div class="hero-banner">
                    <a href="book-repair.html" style="color:var(--accent); text-decoration:none; font-weight:600; font-size:0.9rem; font-family:'JetBrains Mono', monospace;">← RETURN TO CATALOG</a>
                    <h1 style="font-size: 3rem; margin: 20px 0 10px 0;">${data.serviceName}</h1>
                    <p style="color:var(--text-secondary); font-family:'JetBrains Mono', monospace; font-size:0.8rem;">SERVICE_AUTH_CODE: ${data.serviceId}</p>
                    
                    <div class="meta-grid">
                        <div class="meta-item"><label>TAT (Turnaround)</label><span>${data.duration}</span></div>
                        <div class="meta-item"><label>Nexus Guarantee</label><span>${data.warranty}</span></div>
                        <div class="meta-item"><label>Classification</label><span>${data.category}</span></div>
                    </div>
                </div>

                <div class="content-split">
                    <div class="details-pane">
                        <h3 style="color:var(--accent); font-family:'JetBrains Mono', monospace;">> OPERATIONAL_OVERVIEW</h3>
                        <p style="line-height: 1.8; color: var(--text-secondary); font-size: 1.1rem; margin-bottom: 40px;">
                            ${data.longDescription}
                        </p>

                        <div class="card" style="background: rgba(255,255,255,0.02); padding: 25px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.05);">
                            <h3 style="margin-top:0; color:white;">Protocol Inclusions</h3>
                            <ul class="inclusion-list">
                                ${data.activities.map(act => `<li>${act}</li>`).join('')}
                            </ul>
                        </div>
                    </div>

                    <div class="action-pane">
                        <div class="price-card">
                            <label>Base Configuration Cost</label>
                            <div class="price-value">$${parseFloat(data.basePrice).toFixed(2)}</div>
                            <p style="color:#666; font-size: 0.8rem; margin-bottom: 25px;">Final quote generated after diagnostic verification.</p>
                            <a href="book.html?service=${data.serviceId}" class="btn btn-primary" style="display:block; width:100%; box-sizing:border-box; text-align:center; text-decoration:none; padding: 15px; font-weight:bold;">INITIATE REPAIR</a>
                        </div>
                    </div>
                </div>
            `;
        } catch (err) {
            document.getElementById('main-content').innerHTML = `
                <div class='card' style='text-align:center; padding: 50px;'>
                    <h2 style="color:var(--accent)">Service Offline</h2>
                    <p>${err.message}</p>
                    <a href="book-repair.html" class="btn btn-outline" style="margin-top:20px; display:inline-block;">Retry Connection</a>
                </div>`;
        }
    };
</script>
</body>
</html>
