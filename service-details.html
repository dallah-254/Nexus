<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service Details | NexusFlow</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f8fafc; color: #1a202c; margin: 0; padding: 40px 20px; }
        .container { max-width: 900px; margin: auto; background: white; padding: 40px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        
        .back-btn { display: inline-block; text-decoration: none; color: #ed8936; font-weight: bold; margin-bottom: 30px; }
        h1 { margin: 0; font-size: 32px; color: #2d3748; }
        
        .grid-info { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin: 30px 0; padding: 20px; background: #fffaf0; border-radius: 12px; border: 1px solid #feebc8; }
        .info-box b { display: block; font-size: 12px; color: #718096; text-transform: uppercase; letter-spacing: 1px; }
        .info-box span { font-size: 18px; font-weight: bold; color: #2d3748; }

        .description { font-size: 17px; line-height: 1.8; color: #4a5568; margin-bottom: 40px; }
        
        .activities-card { background: #f7fafc; padding: 30px; border-radius: 12px; }
        .activities-card h3 { margin-top: 0; color: #2d3748; }
        ul { list-style: none; padding: 0; }
        li { padding: 10px 0; border-bottom: 1px solid #e2e8f0; display: flex; align-items: center; }
        li::before { content: "✓"; color: #38a169; font-weight: bold; margin-right: 15px; }

        .footer-action { margin-top: 50px; display: flex; justify-content: space-between; align-items: center; padding-top: 30px; border-top: 2px solid #e2e8f0; }
        .price-tag { font-size: 36px; font-weight: bold; color: #ed8936; }
        .btn-book { background: #ed8936; color: white; padding: 15px 40px; border-radius: 8px; text-decoration: none; font-weight: bold; font-size: 18px; transition: 0.2s; }
        .btn-book:hover { background: #dd6b20; }
    </style>
</head>
<body>

<div class="container" id="main-content">
    <a href="services.html" class="back-btn">← Back to Catalog</a>
    <div id="loader">Loading service details...</div>
</div>

<script>
    const API_URL = 'https://yskkdnff93.execute-api.us-east-1.amazonaws.com/prod/Services/details';

    window.onload = async function() {
        const params = new URLSearchParams(window.location.search);
        const serviceId = params.get('id');

        if (!serviceId) {
            document.getElementById('main-content').innerHTML = "<h1>Service not found.</h1>";
            return;
        }

        try {
            const res = await fetch(`${API_URL}?id=${serviceId}`);
            const data = await res.json();

            if (!res.ok) throw new Error("Could not find service");

            document.getElementById('main-content').innerHTML = `
                <a href="services.html" class="back-btn">← Back to Catalog</a>
                <h1>${data.serviceName}</h1>
                
                <div class="grid-info">
                    <div class="info-box"><b>Estimated Time</b><span>${data.duration}</span></div>
                    <div class="info-box"><b>Warranty</b><span>${data.warranty}</span></div>
                    <div class="info-box"><b>Category</b><span>${data.category}</span></div>
                </div>

                <div class="description">${data.longDescription}</div>

                <div class="activities-card">
                    <h3>What's Included in this Service:</h3>
                    <ul>
                        ${data.activities.map(act => `<li>${act}</li>`).join('')}
                    </ul>
                </div>

                <div class="footer-action">
                    <div>
                        <span style="color:#718096">Starting From</span>
                        <div class="price-tag">$${data.basePrice.toFixed(2)}</div>
                    </div>
                    <a href="book.html?service=${data.serviceId}" class="btn-book">Book Repair Now</a>
                </div>
            `;
        } catch (err) {
            document.getElementById('main-content').innerHTML = `<h1>Error loading service.</h1><p>${err.message}</p>`;
        }
    }
</script>

</body>
</html>
