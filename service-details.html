<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusFlow | Service Intelligence</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/aws-sdk/2.1522.0/aws-sdk.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@6.3.7/dist/amazon-cognito-identity.min.js"></script>
    
    <script src="auth-config.js"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="header.css">
    
    <style>
        :root { --accent: #00f3ff; --bg: #0a0a0a; --panel: rgba(255,255,255,0.03); --border: rgba(0,243,255,0.15); }
        body { background: var(--bg); color: white; font-family: 'Inter', sans-serif; padding-top: 100px; margin: 0; }
        .container { max-width: 1100px; margin: 0 auto; padding: 20px; }

        /* HEADER SECTION */
        .service-header { border-bottom: 1px solid var(--border); padding-bottom: 30px; margin-bottom: 40px; }
        .category-tag { color: var(--accent); font-family: 'JetBrains Mono'; font-size: 0.7rem; letter-spacing: 2px; text-transform: uppercase; }
        .service-title { font-size: 2.5rem; margin: 10px 0; font-weight: 800; }

        /* GRID LAYOUT */
        .detail-grid { display: grid; grid-template-columns: 1fr 350px; gap: 40px; }

        /* LEFT COLUMN */
        .description-box { line-height: 1.8; color: #aaa; font-size: 1.05rem; margin-bottom: 40px; }
        .protocol-list { list-style: none; padding: 0; }
        .protocol-item { 
            background: var(--panel); border: 1px solid var(--border); 
            padding: 15px; margin-bottom: 10px; font-family: 'JetBrains Mono'; 
            font-size: 0.85rem; display: flex; align-items: center; 
        }
        .protocol-item::before { content: "›"; color: var(--accent); margin-right: 15px; font-size: 1.2rem; }

        /* RIGHT COLUMN (The "Price Card") */
        .action-card { 
            background: white; color: black; padding: 30px; border-radius: 4px; 
            position: sticky; top: 120px; text-align: center; 
        }
        .price-label { font-size: 0.7rem; font-weight: 900; color: #666; text-transform: uppercase; }
        .price-value { font-size: 3rem; font-weight: 900; margin: 10px 0; font-family: 'JetBrains Mono'; }
        .meta-info { border-top: 1px solid #eee; margin-top: 20px; padding-top: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .meta-item { text-align: left; }
        .meta-item label { display: block; font-size: 0.6rem; color: #999; font-weight: bold; }
        .meta-item span { font-size: 0.8rem; font-weight: bold; }

        .btn-book { 
            display: block; background: #000; color: #fff; text-decoration: none; 
            padding: 18px; margin-top: 25px; font-weight: 900; font-size: 0.8rem; 
            letter-spacing: 1px; transition: 0.3s;
        }
        .btn-book:hover { background: var(--accent); color: #000; }

        .loading-overlay { text-align: center; padding: 100px; font-family: 'JetBrains Mono'; color: var(--accent); }
        
        @media (max-width: 850px) { .detail-grid { grid-template-columns: 1fr; } .action-card { position: static; } }
    </style>
</head>
<body>

    <div id="nexus-header-wrapper"></div>
    <script src="header.js"></script>

    <div class="container" id="details-container">
        <div class="loading-overlay">DECRYPTING_PROTOCOL_DATA...</div>
    </div>

    <script>
        // THE SAME API URL AS THE SERVICE PAGE
        const API = "https://yskkdnff93.execute-api.us-east-1.amazonaws.com/prod/services";

        async function fetchDetails() {
            // 1. Get the 'id' from the URL (e.g. ?id=PHN-001)
            const urlParams = new URLSearchParams(window.location.search);
            const serviceId = urlParams.get('id');

            if (!serviceId) {
                document.getElementById('details-container').innerHTML = "<h1>ERROR: PROTOCOL_ID_NOT_FOUND</h1>";
                return;
            }

            try {
                // 2. Call the API with the ?id= parameter
                const response = await fetch(`${API}?id=${serviceId}`);
                if (!response.ok) throw new Error("PROTOCOL_OFFLINE");
                const data = await response.json();

                // 3. Inject the data into the page
                renderPage(data);
            } catch (err) {
                document.getElementById('details-container').innerHTML = `<h1>LINK_FAILURE: ${err.message}</h1>`;
            }
        }

        function renderPage(data) {
            const container = document.getElementById('details-container');
            
            container.innerHTML = `
                <div class="service-header">
                    <span class="category-tag">${data.serviceCategory || 'GENERAL_PROTOCOL'}</span>
                    <h1 class="service-title">${data.serviceName}</h1>
                    <a href="services.html" style="color:#555; text-decoration:none; font-size:0.7rem; font-family:'JetBrains Mono';">← RETURN_TO_INDEX</a>
                </div>

                <div class="detail-grid">
                    <div class="left-col">
                        <div class="description-box">
                            <h3 style="color:white; font-family:'JetBrains Mono'; margin-bottom:20px;">> OPERATION_SUMMARY</h3>
                            ${data.longDescription || 'No detailed data available for this protocol.'}
                        </div>

                        <div class="protocols">
                            <h3 style="color:white; font-family:'JetBrains Mono'; margin-bottom:20px;">> INCLUSION_LOG</h3>
                            <div class="protocol-list">
                                ${data.activities && data.activities.length > 0 
                                    ? data.activities.map(act => `<div class="protocol-item">${act}</div>`).join('') 
                                    : '<div class="protocol-item">Standard Diagnostic Flow</div>'}
                            </div>
                        </div>
                    </div>

                    <div class="right-col">
                        <div class="action-card">
                            <div class="price-label">Estimated Base Cost</div>
                            <div class="price-value">$${parseFloat(data.basePrice || 0).toFixed(2)}</div>
                            
                            <div class="meta-info">
                                <div class="meta-item">
                                    <label>TIMELINE</label>
                                    <span>${data.duration || 'TBD'}</span>
                                </div>
                                <div class="meta-item">
                                    <label>WARRANTY</label>
                                    <span>${data.warranty || '90 DAYS'}</span>
                                </div>
                            </div>

                            <a href="book-repair.html?serviceId=${data.serviceId}" class="btn-book">INITIALIZE BOOKING</a>
                        </div>
                    </div>
                </div>
            `;
        }

        window.onload = fetchDetails;
    </script>
</body>
</html>
