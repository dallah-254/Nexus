<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusFlow | Search Inventory</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .search-container { margin-top: 50px; text-align: center; }
        .search-box {
            width: 100%; max-width: 600px;
            padding: 15px 25px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--accent);
            border-radius: 30px;
            color: white;
            font-size: 1.1rem;
            outline: none;
        }
        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 25px;
            margin-top: 40px;
        }
        /* Product Card Styles */
        .product-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 20px;
            transition: 0.3s;
            cursor: pointer;
            text-align: left;
        }
        .product-card:hover { border-color: var(--accent); transform: translateY(-5px); }
        .product-card img {
            width: 100%; height: 200px;
            object-fit: contain;
            border-radius: 10px;
            margin-bottom: 15px;
            background: #111;
        }
        .price-tag { color: var(--accent); font-weight: bold; font-size: 1.2rem; }
    </style>
</head>
<body>

<nav class="navbar">
    <a href="index.html" class="logo">NEXUS<span style="color:white">FLOW</span></a>
    <div class="nav-links">
        <a href="shop.html">Shop</a>
        <a href="cart.html">Cart</a>
    </div>
</nav>

<div class="container">
    <div class="search-container">
        <h1>Global <span style="color:var(--accent)">Inventory Search</span></h1>
        <input type="text" id="searchInput" class="search-box" placeholder="Search by name, category, or spec..." onkeyup="handleSearch()">
    </div>

    <div id="status-msg" style="margin-top: 20px; color: #888; text-align: center;"></div>
    <div class="results-grid" id="searchResults"></div>
</div>

<script>
    const API_URL = 'https://yskkdnff93.execute-api.us-east-1.amazonaws.com/prod/products';
    let allProducts = [];

    // Fetch products once on load
    window.onload = async () => {
        try {
            const res = await fetch(API_URL);
            allProducts = await res.json();
            document.getElementById('status-msg').innerText = "System Ready. Search active.";
        } catch (err) {
            document.getElementById('status-msg').innerText = "Database Link Error.";
        }
    };

    function handleSearch() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        const resultsContainer = document.getElementById('searchResults');
        
        if (query.length < 2) {
            resultsContainer.innerHTML = "";
            return;
        }

        const filtered = allProducts.filter(p => 
            (p.name || p.productName || "").toLowerCase().includes(query) ||
            (p.category || "").toLowerCase().includes(query) ||
            (p.description || "").toLowerCase().includes(query)
        );

        renderResults(filtered);
    }

    function renderResults(products) {
        const container = document.getElementById('searchResults');
        
        if (products.length === 0) {
            container.innerHTML = "<p style='grid-column: 1/-1; text-align: center;'>No components found matching your query.</p>";
            return;
        }

        container.innerHTML = products.map(p => {
            const id = p.productId || p.id;
            const name = p.name || p.productName;
            const price = parseFloat(p.price).toFixed(2);
            const img = p.imageUrl || p.imageURL || 'https://via.placeholder.com/300?text=NexusFlow';

            return `
                <div class="product-card" onclick="window.location.href='product-details.html?id=${id}'">
                    <img src="${img}" 
                         alt="${name}" 
                         onerror="this.onerror=null; this.src='https://via.placeholder.com/300?text=No+Image+Found';">
                    <div style="font-size: 0.8rem; color: var(--accent);">${p.category || 'HARDWARE'}</div>
                    <h3 style="margin: 5px 0;">${name}</h3>
                    <div class="price-tag">$${price}</div>
                </div>
            `;
        }).join('');
    }
</script>
</body>
</html>
