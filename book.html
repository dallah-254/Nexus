<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusFlow | Book a Repair</title>
    <script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@6.3.7/dist/amazon-cognito-identity.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; padding: 20px; color: #333; }
        .booking-card { background: white; max-width: 700px; margin: auto; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        h2 { color: #232f3e; border-bottom: 2px solid #ff9900; padding-bottom: 10px; }
        .section-title { font-weight: bold; margin: 20px 0 10px; color: #555; text-transform: uppercase; font-size: 0.85rem; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 14px; font-weight: 600; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 15px; }
        textarea { resize: vertical; }
        .full-width { grid-column: span 2; }
        button { width: 100%; background: #ff9900; color: white; border: none; padding: 15px; border-radius: 6px; font-size: 17px; font-weight: bold; cursor: pointer; margin-top: 20px; transition: 0.3s; }
        button:hover { background: #e68a00; }
        #msg { text-align: center; margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>

<div class="booking-card">
    <h2>Electronic Repair Request</h2>
    <form id="repairForm">
        
        <div class="section-title">Device Information</div>
        <div class="grid">
            <div>
                <label>Device Type</label>
                <select id="deviceType" required>
                    <option value="Smartphone">Smartphone</option>
                    <option value="Laptop">Laptop</option>
                    <option value="Tablet">Tablet</option>
                    <option value="Gaming Console">Gaming Console</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            <div>
                <label>Brand</label>
                <input type="text" id="brand" placeholder="e.g. Apple, Samsung, HP" required>
            </div>
            <div>
                <label>Model Name/Number</label>
                <input type="text" id="model" placeholder="e.g. iPhone 15 Pro, MacBook M3" required>
            </div>
            <div>
                <label>Device Age (Years)</label>
                <input type="number" id="deviceAge" placeholder="0" min="0">
            </div>
            <div class="full-width">
                <label>Serial Number / IMEI (Optional)</label>
                <input type="text" id="serialNumber" placeholder="Helps us find the right parts faster">
            </div>
        </div>

        <div class="section-title">Issue Description</div>
        <label>What is the problem?</label>
        <textarea id="issueDescription" rows="3" placeholder="Describe the symptoms (e.g. cracked screen, won't charge)..." required></textarea>
        
        <div style="margin-top:10px;">
            <label><input type="checkbox" id="liquidDamage" style="width: auto;"> Has the device been exposed to liquid?</label>
            <label><input type="checkbox" id="previousRepair" style="width: auto;"> Has this been repaired before?</label>
        </div>

        <div class="section-title">Pickup & Contact</div>
        <div class="grid">
            <div class="full-width">
                <label>Pickup Address</label>
                <input type="text" id="pickupAddress" placeholder="Street, Apartment, Suite" required>
            </div>
            <div>
                <label>City/Area</label>
                <input type="text" id="city" placeholder="e.g. Nairobi" required>
            </div>
            <div>
                <label>Preferred Pickup Date</label>
                <input type="date" id="bookingDate" required>
            </div>
        </div>

        <button type="submit" id="submitBtn">Submit Repair Request</button>
    </form>
    <div id="msg"></div>
</div>

<script>
    // Configuration
    const poolData = { UserPoolId: 'us-east-1_IK57zG64M', ClientId: '668q6c6krjv8b6n81cfc78n9a4' };
    const apiEndpoint = 'https://yskkdnff93.execute-api.us-east-1.amazonaws.com/prod/bookings';

    document.getElementById('repairForm').onsubmit = function(e) {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        const msg = document.getElementById('msg');
        
        btn.disabled = true;
        msg.innerText = "Processing your request...";

        // 1. Get Session for Token
        const userPool = new AmazonCognitoIdentity.CognitoUserPool(poolData);
        const cognitoUser = userPool.getCurrentUser();

        if (!cognitoUser) {
            window.location.href = 'login.html';
            return;
        }

        cognitoUser.getSession((err, session) => {
            if (err) { alert("Session expired"); return; }
            
            // 2. Collect ALL form data into one object
            const formData = {
                deviceType: document.getElementById('deviceType').value,
                brand: document.getElementById('brand').value,
                model: document.getElementById('model').value,
                deviceAge: document.getElementById('deviceAge').value,
                serialNumber: document.getElementById('serialNumber').value,
                issueDescription: document.getElementById('issueDescription').value,
                liquidDamage: document.getElementById('liquidDamage').checked,
                previousRepair: document.getElementById('previousRepair').checked,
                pickupAddress: document.getElementById('pickupAddress').value,
                city: document.getElementById('city').value,
                bookingDate: document.getElementById('bookingDate').value
            };

            // 3. Send to API
            fetch(apiEndpoint, {
                method: 'POST',
                headers: {
                    'Authorization': session.getIdToken().getJwtToken(),
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(formData)
            })
            .then(res => res.json())
            .then(data => {
                msg.style.color = "green";
                msg.innerText = "Success! We will contact you soon.";
                setTimeout(() => window.location.href = 'profile.html', 2000);
            })
            .catch(error => {
                msg.style.color = "red";
                msg.innerText = "Error submitting request.";
                btn.disabled = false;
            });
        });
    };
</script>
</body>
</html>
