<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusFlow | Book a Repair</title>
    <script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@6.3.7/dist/amazon-cognito-identity.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        .form-section {
            margin-bottom: 40px;
        }
        .section-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
        }
        .step-number {
            background: var(--accent);
            color: #000;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 0.9rem;
        }
        .section-title {
            color: var(--text-primary);
            font-size: 1.1rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 0;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .full-width { grid-column: span 2; }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.85rem;
            color: var(--text-secondary);
            font-weight: 600;
        }

        .checkbox-group {
            display: flex;
            gap: 30px;
            background: rgba(255,255,255,0.03);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .check-item {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            font-size: 0.9rem;
        }
        .check-item input { width: auto; margin: 0; cursor: pointer; }

        #msg {
            text-align: center;
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            display: none;
        }
    </style>
</head>
<body>

<nav class="navbar">
    <a href="index.html" class="logo">NEXUS<span style="color:white">FLOW</span></a>
    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="shop.html">Shop</a>
        <a href="book-repair.html" class="active">Book Repair</a>
        <a href="profile.html">Profile</a>
        <a href="admin.html">Admin</a>
    </div>
</nav>

<div class="container">
    <div style="max-width: 800px; margin: auto;">
        <h1 style="margin-bottom: 10px;">Request <span style="color:var(--accent)">Repair Service</span></h1>
        <p style="color: var(--text-secondary); margin-bottom: 40px;">Provide your device details below. Our technicians will review the case and arrange a pickup.</p>

        <div class="card">
            <form id="repairForm">
                
                <div class="form-section">
                    <div class="section-header">
                        <div class="step-number">1</div>
                        <h2 class="section-title">Device Details</h2>
                    </div>
                    <div class="grid">
                        <div>
                            <label>Hardware Category</label>
                            <select id="deviceType" required>
                                <option value="Smartphone">Smartphone</option>
                                <option value="Laptop">Laptop</option>
                                <option value="Tablet">Tablet</option>
                                <option value="Gaming Console">Gaming Console</option>
                                <option value="Other">Other Specialized Gear</option>
                            </select>
                        </div>
                        <div>
                            <label>Manufacturer / Brand</label>
                            <input type="text" id="brand" placeholder="e.g. Apple, Dell, Sony" required>
                        </div>
                        <div>
                            <label>Model Identifier</label>
                            <input type="text" id="model" placeholder="e.g. Precision 5570, PS5" required>
                        </div>
                        <div>
                            <label>Approx. Age (Years)</label>
                            <input type="number" id="deviceAge" placeholder="0" min="0">
                        </div>
                        <div class="full-width">
                            <label>Serial / IMEI (Helps us pre-order parts)</label>
                            <input type="text" id="serialNumber" placeholder="Enter Serial Number or IMEI">
                        </div>
                    </div>
                </div>

                <div class="form-section">
                    <div class="section-header">
                        <div class="step-number">2</div>
                        <h2 class="section-title">Issue Assessment</h2>
                    </div>
                    <label>Describe the failure symptoms</label>
                    <textarea id="issueDescription" rows="4" placeholder="Be as detailed as possible (e.g., 'Intermittent power loss when moving screen')..." required></textarea>
                    
                    <div class="checkbox-group">
                        <label class="check-item">
                            <input type="checkbox" id="liquidDamage"> Liquid Exposure
                        </label>
                        <label class="check-item">
                            <input type="checkbox" id="previousRepair"> Previously Opened/Repaired
                        </label>
                    </div>
                </div>

                <div class="form-section">
                    <div class="section-header">
                        <div class="step-number">3</div>
                        <h2 class="section-title">Logistics</h2>
                    </div>
                    <div class="grid">
                        <div class="full-width">
                            <label>Detailed Pickup Address</label>
                            <input type="text" id="pickupAddress" placeholder="Building, Street, Room Number" required>
                        </div>
                        <div>
                            <label>City / Region</label>
                            <input type="text" id="city" placeholder="e.g. Nairobi" required>
                        </div>
                        <div>
                            <label>Preferred Pickup Date</label>
                            <input type="date" id="bookingDate" required>
                        </div>
                    </div>
                </div>

                <button type="submit" id="submitBtn" class="btn btn-primary" style="width: 100%; font-size: 1.1rem; padding: 18px;">
                    Submit Secure Request
                </button>
            </form>
            <div id="msg"></div>
        </div>
    </div>
</div>

<script>
    const poolData = { UserPoolId: 'us-east-1_IK57zG64M', ClientId: '668q6c6krjv8b6n81cfc78n9a4' };
    const apiEndpoint = 'https://yskkdnff93.execute-api.us-east-1.amazonaws.com/prod/bookings';

    document.getElementById('repairForm').onsubmit = function(e) {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        const msg = document.getElementById('msg');
        
        btn.disabled = true;
        btn.innerText = "Transmitting Request...";
        msg.style.display = "block";
        msg.style.background = "rgba(255,255,255,0.05)";
        msg.innerText = "Checking authorization...";

        const userPool = new AmazonCognitoIdentity.CognitoUserPool(poolData);
        const cognitoUser = userPool.getCurrentUser();

        if (!cognitoUser) {
            window.location.href = 'login.html';
            return;
        }

        cognitoUser.getSession((err, session) => {
            if (err) { 
                msg.style.color = "var(--danger)";
                msg.innerText = "Session expired. Please log in again.";
                return; 
            }
            
            const formData = {
                deviceType: document.getElementById('deviceType').value,
                brand: document.getElementById('brand').value,
                model: document.getElementById('model').value,
                deviceAge: document.getElementById('deviceAge').value,
                serialNumber: document.getElementById('serialNumber').value,
                issueDescription: document.getElementById('issueDescription').value,
                liquidDamage: document.getElementById('liquidDamage').checked,
                previousRepair: document.getElementById('previousRepair').checked,
                pickupAddress: document.getElementById('pickupAddress').value,
                city: document.getElementById('city').value,
                bookingDate: document.getElementById('bookingDate').value
            };

            fetch(apiEndpoint, {
                method: 'POST',
                headers: {
                    'Authorization': session.getIdToken().getJwtToken(),
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(formData)
            })
            .then(res => res.json())
            .then(data => {
                msg.style.color = "var(--success)";
                msg.style.background = "rgba(16, 185, 129, 0.1)";
                msg.innerText = "✓ Request Received. Redirecting to your dashboard...";
                setTimeout(() => window.location.href = 'profile.html', 2500);
            })
            .catch(error => {
                msg.style.color = "var(--danger)";
                msg.innerText = "Error: System failed to transmit request.";
                btn.disabled = false;
                btn.innerText = "Retry Submission";
            });
        });
    };
</script>
</body>
</html>
