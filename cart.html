<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusFlow | Secure Checkout</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/aws-sdk/2.1522.0/aws-sdk.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@6.3.7/dist/amazon-cognito-identity.min.js"></script>
    
    <script src="auth-config.js"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="header.css">
    
    <style>
        body { padding-top: 100px; } /* Offset for fixed header */

        .checkout-grid {
            display: grid;
            grid-template-columns: 1.4fr 0.8fr;
            gap: 30px;
            margin-top: 30px;
            align-items: start;
        }

        #empty-state {
            display: none;
            text-align: center;
            padding: 120px 20px;
        }

        .summary-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-cyan);
            position: sticky;
            top: 120px;
            padding: 25px;
            border-radius: 12px;
            backdrop-filter: blur(10px);
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .remove-btn {
            background: none;
            border: none;
            color: var(--danger);
            font-size: 0.65rem;
            cursor: pointer;
            text-transform: uppercase;
            font-family: 'JetBrains Mono', monospace;
            padding: 5px 0;
            opacity: 0.7;
        }
        .remove-btn:hover { opacity: 1; text-decoration: underline; }

        .total-row {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid var(--accent);
            display: flex;
            justify-content: space-between;
            font-size: 1.5rem;
            font-weight: 800;
            font-family: 'JetBrains Mono', monospace;
        }

        /* Stepper Logic */
        .step { display: none; }
        .step.active { display: block; animation: fadeIn 0.4s ease; }

        .progress-stepper {
            display: flex;
            justify-content: space-between;
            margin-bottom: 40px;
            max-width: 400px;
        }

        .step-dot {
            width: 35px; height: 35px; border-radius: 50%;
            background: #111; border: 1px solid #333;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; color: #444; font-size: 0.8rem;
        }

        .step-dot.active { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 15px var(--accent-glow); }
        .line { flex-grow: 1; height: 1px; background: #222; align-self: center; margin: 0 10px; }

        @media (max-width: 950px) {
            .checkout-grid { grid-template-columns: 1fr; }
            .summary-card { position: static; margin-top: 20px; }
        }
    </style>
</head>
<body>

<div id="nexus-header-wrapper"></div>

<div class="container">
    <div id="empty-state">
        <h2 style="font-size: 3rem; margin-bottom: 10px;">Cart <span class="text-accent">Void</span></h2>
        <p class="text-dim" style="margin-bottom: 40px;">No hardware signatures detected in your current session.</p>
        <a href="shop.html" class="btn btn-primary">Initialize Procurement</a>
    </div>

    <div id="checkout-main" style="display: none;">
        <h1 style="margin: 40px 0 20px;">Secure <span class="text-accent">Deployment</span></h1>
        <p class="text-dim" style="margin-bottom: 40px;">Finalize your inventory request and logistics parameters.</p>

        <div class="checkout-grid">
            <div class="card">
                <div class="progress-stepper">
                    <div id="dot1" class="step-dot active">01</div>
                    <div class="line"></div>
                    <div id="dot2" class="step-dot">02</div>
                </div>

                <div id="step1" class="step active">
                    <h3 class="mono" style="margin-bottom: 25px; font-size: 1rem;">[01] USER IDENTIFICATION</h3>
                    
                    <label>Assigned Name</label>
                    <input type="text" id="name" placeholder="Enter Full Name" style="margin-bottom: 20px;">
                    
                    <label>Verified Access Email</label>
                    <input type="email" id="email" readonly style="margin-bottom: 20px; opacity: 0.6;">
                    
                    <label>Comm Link (Phone)</label>
                    <input type="tel" id="phone" placeholder="+254..." style="margin-bottom: 30px;">
                    
                    <button class="btn btn-primary" style="width:100%;" onclick="nextStep()">Continue to Logistics →</button>
                </div>

                <div id="step2" class="step">
                    <h3 class="mono" style="margin-bottom: 25px; font-size: 1rem;">[02] LOGISTICS & BILLING</h3>
                    
                    <label>Deployment Coordinates (Address)</label>
                    <textarea id="address" rows="3" placeholder="Building, Street, City..." style="margin-bottom: 20px;"></textarea>
                    
                    <label>Payment Protocol</label>
                    <select id="paymentMethod" style="margin-bottom: 30px;">
                        <option value="M-Pesa">M-Pesa Instant Express</option>
                        <option value="Card">Global Credit / Debit</option>
                        <option value="Bank">Direct Wire Transfer</option>
                    </select>

                    <div style="background: rgba(0, 243, 255, 0.03); padding: 20px; border-radius: 8px; margin-bottom: 30px; border: 1px solid var(--border-cyan);">
                        <label style="display: flex; gap: 12px; cursor: pointer; align-items: flex-start; text-transform: none;">
                            <input type="checkbox" id="refundAgreed" style="width: auto; margin-top: 4px;"> 
                            <span style="font-size: 0.8rem; color: #aaa;">I acknowledge that technical hardware components are non-refundable once the deployment (shipping) process is initiated.</span>
                        </label>
                    </div>

                    <button class="btn btn-primary" style="width:100%;" onclick="submitFinalOrder()">Execute Secure Checkout</button>
                    <button class="btn btn-outline" style="width:100%; margin-top: 15px; border: none;" onclick="prevStep()">← Adjust Identification</button>
                </div>
            </div>

            <div class="summary-card">
                <h3 class="mono" style="margin-top:0; color:var(--accent); font-size: 0.75rem; letter-spacing: 2px; margin-bottom: 20px;">INVENTORY SUMMARY</h3>
                <div id="cartItemsList">
                    </div>
                <div class="total-row">
                    <span style="font-size: 0.9rem; color: #666; font-weight: 400;">TOTAL</span>
                    <span id="grandTotal" class="text-accent">$0.00</span>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="header.js"></script>
<script>
    // 1. SESSION GUARD & INITIALIZATION
    window.onload = function() {
        const userPool = new AmazonCognitoIdentity.CognitoUserPool({
            UserPoolId: NEXUS_CONFIG.auth.UserPoolId,
            ClientId: NEXUS_CONFIG.auth.ClientId
        });
        const cognitoUser = userPool.getCurrentUser();

        if (!cognitoUser) {
            window.location.href = 'login.html?redirect=checkout.html';
            return;
        }

        cognitoUser.getSession((err, session) => {
            if (err || !session.isValid()) {
                window.location.href = 'login.html';
                return;
            }
            // Pre-fill email from Cognito
            cognitoUser.getUserAttributes((err, attrs) => {
                const emailAttr = attrs.find(a => a.Name === 'email');
                if (emailAttr) document.getElementById('email').value = emailAttr.Value;
            });
        });

        refreshCartUI();
    };

    // 2. CART UI LOGIC
    function refreshCartUI() {
        const cart = JSON.parse(localStorage.getItem('nexus_cart')) || [];
        const main = document.getElementById('checkout-main');
        const empty = document.getElementById('empty-state');

        if (cart.length === 0) {
            empty.style.display = 'block';
            main.style.display = 'none';
        } else {
            empty.style.display = 'none';
            main.style.display = 'block';
            renderSummary(cart);
        }
    }

    function renderSummary(cart) {
        let total = 0;
        const container = document.getElementById('cartItemsList');
        
        container.innerHTML = cart.map((item, index) => {
            const price = parseFloat(item.price) || 0;
            total += price;
            return `
                <div class="cart-item">
                    <div>
                        <div class="mono" style="font-size: 0.85rem;">${item.name}</div>
                        <button class="remove-btn" onclick="removeItem(${index})">De-list</button>
                    </div>
                    <strong class="mono">$${price.toFixed(2)}</strong>
                </div>`;
        }).join('');
        
        document.getElementById('grandTotal').innerText = `$${total.toFixed(2)}`;
    }

    function removeItem(index) {
        let cart = JSON.parse(localStorage.getItem('nexus_cart')) || [];
        cart.splice(index, 1);
        localStorage.setItem('nexus_cart', JSON.stringify(cart));
        refreshCartUI();
        // Update header badge
        if(window.updateHeaderBadges) updateHeaderBadges();
    }

    // 3. NAVIGATION STEPS
    function nextStep() {
        if(!document.getElementById('name').value) {
            NexusUtils.showAlert("Identification Name Required", "warning");
            return;
        }
        document.getElementById('step1').classList.remove('active');
        document.getElementById('step2').classList.add('active');
        document.getElementById('dot2').classList.add('active');
    }

    function prevStep() {
        document.getElementById('step2').classList.remove('active');
        document.getElementById('step1').classList.add('active');
        document.getElementById('dot2').classList.remove('active');
    }

    // 4. ORDER SUBMISSION
    async function submitFinalOrder() {
        const btn = event.target;
        if(!document.getElementById('refundAgreed').checked) {
            NexusUtils.showAlert("Policy acknowledgement required", "error");
            return;
        }

        const cart = JSON.parse(localStorage.getItem('nexus_cart'));
        const totalAmount = cart.reduce((sum, item) => sum + (parseFloat(item.price) || 0), 0);

        const payload = {
            type: 'order',
            name: document.getElementById('name').value,
            email: document.getElementById('email').value,
            phone: document.getElementById('phone').value,
            address: document.getElementById('address').value,
            paymentMethod: document.getElementById('paymentMethod').value,
            items: cart,
            total: totalAmount.toFixed(2)
        };

        btn.disabled = true;
        btn.innerText = "Transmitting Signal...";

        try {
            const res = await fetch(NEXUS_CONFIG.api.baseUrl + '/orders', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const data = await res.json();

            if (res.ok) {
                sessionStorage.setItem('lastOrder', JSON.stringify({
                    id: data.orderId || data.id || 'NX-' + Math.floor(Math.random()*9000),
                    total: payload.total
                }));
                localStorage.removeItem('nexus_cart');
                window.location.href = 'order-success.html';
            } else {
                throw new Error("Deployment Rejected by Server.");
            }
        } catch (e) {
            NexusUtils.showAlert(e.message, "error");
            btn.disabled = false;
            btn.innerText = "Execute Secure Checkout";
        }
    }
</script>
</body>
</html>
