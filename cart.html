<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusFlow | Secure Procurement</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/aws-sdk/2.1522.0/aws-sdk.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@6.3.7/dist/amazon-cognito-identity.min.js"></script>
    
    <script src="auth-config.js"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="header.css">
    
    <style>
        body { padding-top: 100px; } 

        .cart-wrapper {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }

        /* View Toggling */
        #checkout-view { display: none; animation: fadeIn 0.4s ease; }
        .hidden { display: none !important; }

        /* Cart Item Styling */
        .cart-list { margin-top: 30px; }
        
        .cart-item {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(0, 243, 255, 0.1);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 15px;
            gap: 20px;
        }

        .cart-item img {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 4px;
            border: 1px solid #333;
        }

        .item-details { flex-grow: 1; }

        .product-link {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.1rem;
            color: var(--accent);
            text-decoration: none;
            display: block;
            margin-bottom: 5px;
        }

        .product-link:hover { text-decoration: underline; }

        .item-price {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 800;
            font-size: 1.2rem;
            color: #fff;
        }

        .remove-btn {
            background: none;
            border: none;
            color: #ff4d4d;
            font-size: 0.7rem;
            text-transform: uppercase;
            cursor: pointer;
            padding: 5px 0;
            opacity: 0.7;
        }
        .remove-btn:hover { opacity: 1; text-decoration: underline; }

        /* Summary Bar */
        .cart-summary-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 243, 255, 0.05);
            padding: 30px;
            border-radius: 12px;
            border: 1px dashed var(--accent);
            margin-top: 40px;
        }

        .grand-total-label { color: #888; font-size: 0.8rem; letter-spacing: 2px; }
        .grand-total-value { font-size: 2rem; font-weight: 800; font-family: 'JetBrains Mono', monospace; color: var(--accent); }

        /* Checkout Form Styling */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }

        .input-group { margin-bottom: 20px; }
        label { display: block; font-size: 0.75rem; color: var(--accent); text-transform: uppercase; margin-bottom: 8px; }
        input, textarea, select {
            width: 100%;
            padding: 12px;
            background: #0a0a0a;
            border: 1px solid #333;
            color: #fff;
            border-radius: 4px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div id="nexus-header-wrapper"></div>

<div class="cart-wrapper">
    <div id="empty-state" class="hidden" style="text-align: center; padding: 100px 20px;">
        <h1 class="mono" style="font-size: 3rem;">Cart <span class="text-accent">Null</span></h1>
        <p style="color: #666; margin-bottom: 30px;">No hardware signatures detected in current session.</p>
        <a href="shop.html" class="btn btn-primary">Initialize Procurement</a>
    </div>

    <div id="cart-view">
        <h1 class="mono">Hardware <span class="text-accent">Inventory</span></h1>
        <p style="color: #666;">Review selected modules before initiating deployment.</p>

        <div id="cart-items-list" class="cart-list">
            </div>

        <div class="cart-summary-bar">
            <div>
                <div class="grand-total-label">SYSTEM TOTAL</div>
                <div id="total-amount" class="grand-total-value">$0.00</div>
            </div>
            <button class="btn btn-primary" onclick="showCheckout()" style="padding: 15px 40px;">Continue to Checkout →</button>
        </div>
    </div>

    <div id="checkout-view">
        <h1 class="mono">Secure <span class="text-accent">Logistics</span></h1>
        <p style="color: #666;">Provide deployment coordinates and payment protocol.</p>

        <div class="card" style="margin-top: 30px; background: rgba(255,255,255,0.01);">
            <div class="form-grid">
                <div class="input-group">
                    <label>Operator Name</label>
                    <input type="text" id="op-name" placeholder="Full legal name">
                </div>
                <div class="input-group">
                    <label>Verified Email</label>
                    <input type="email" id="op-email" readonly style="opacity: 0.5; cursor: not-allowed;">
                </div>
            </div>

            <div class="input-group">
                <label>Deployment Coordinates (Address)</label>
                <textarea id="op-address" rows="3" placeholder="Building, Street, City, Country"></textarea>
            </div>

            <div class="input-group">
                <label>Payment Protocol</label>
                <select id="op-payment">
                    <option value="M-Pesa">M-Pesa Express</option>
                    <option value="Card">Credit / Debit Card</option>
                    <option value="Crypto">Digital Asset Transfer</option>
                </select>
            </div>

            <div style="margin-top: 30px;">
                <button class="btn btn-primary" style="width: 100%; height: 60px;" onclick="processOrder()">EXECUTE SECURE CHECKOUT</button>
                <button class="btn btn-outline" style="width: 100%; margin-top: 15px; border:none;" onclick="hideCheckout()">← Return to Inventory</button>
            </div>
        </div>
    </div>
</div>

<script src="header.js"></script>
<script>
    // --- LOGIN GUARD ---
    const userPool = new AmazonCognitoIdentity.CognitoUserPool({
        UserPoolId: NEXUS_CONFIG.auth.UserPoolId,
        ClientId: NEXUS_CONFIG.auth.ClientId
    });
    const cognitoUser = userPool.getCurrentUser();

    window.onload = function() {
        if (!cognitoUser) {
            window.location.href = 'login.html?redirect=cart.html';
            return;
        }

        cognitoUser.getSession((err, session) => {
            if (err || !session.isValid()) {
                window.location.href = 'login.html';
                return;
            }
            // Populate Email from Session
            cognitoUser.getUserAttributes((err, attrs) => {
                const email = attrs.find(a => a.Name === 'email');
                if (email) document.getElementById('op-email').value = email.Value;
            });
        });

        renderCart();
    };

    // --- CART LOGIC ---
    function renderCart() {
        const cart = JSON.parse(localStorage.getItem('nexus_cart')) || [];
        const container = document.getElementById('cart-items-list');
        const emptyState = document.getElementById('empty-state');
        const cartView = document.getElementById('cart-view');

        if (cart.length === 0) {
            emptyState.classList.remove('hidden');
            cartView.classList.add('hidden');
            return;
        }

        emptyState.classList.add('hidden');
        cartView.classList.remove('hidden');

        let total = 0;
        container.innerHTML = cart.map((item, index) => {
            total += parseFloat(item.price);
            return `
                <div class="cart-item">
                    <img src="${item.imageUrl || 'https://via.placeholder.com/100?text=Hardware'}" alt="Item">
                    <div class="item-details">
                        <a href="product-details.html?id=${item.productId}" class="product-link">${item.name}</a>
                        <button class="remove-btn" onclick="removeItem(${index})">[ DE-LIST ITEM ]</button>
                    </div>
                    <div class="item-price">$${parseFloat(item.price).toFixed(2)}</div>
                </div>
            `;
        }).join('');

        document.getElementById('total-amount').innerText = `$${total.toFixed(2)}`;
    }

    function removeItem(index) {
        let cart = JSON.parse(localStorage.getItem('nexus_cart')) || [];
        cart.splice(index, 1);
        localStorage.setItem('nexus_cart', JSON.stringify(cart));
        renderCart();
        if(window.updateHeaderBadges) updateHeaderBadges();
    }

    // --- NAVIGATION ---
    function showCheckout() {
        document.getElementById('cart-view').classList.add('hidden');
        document.getElementById('checkout-view').style.display = 'block';
        window.scrollTo(0, 0);
    }

    function hideCheckout() {
        document.getElementById('checkout-view').style.display = 'none';
        document.getElementById('cart-view').classList.remove('hidden');
    }

    // --- SUBMISSION ---
    async function processOrder() {
        const name = document.getElementById('op-name').value;
        const address = document.getElementById('op-address').value;

        if (!name || !address) {
            NexusUtils.showAlert("Incomplete logistics data.", "warning");
            return;
        }

        const cart = JSON.parse(localStorage.getItem('nexus_cart'));
        const total = document.getElementById('total-amount').innerText;

        // Visual Feedback
        const btn = event.target;
        btn.disabled = true;
        btn.innerText = "TRANSMITTING SIGNAL...";

        // API Submission logic would go here
        setTimeout(() => {
            sessionStorage.setItem('lastOrder', JSON.stringify({
                id: 'NX-' + Math.random().toString(36).substr(2, 9).toUpperCase(),
                total: total
            }));
            localStorage.removeItem('nexus_cart');
            window.location.href = 'order-success.html';
        }, 1500);
    }
</script>
</body>
</html>
