<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NexusFlow | Secure Checkout</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; padding: 20px; }
        .checkout-box { max-width: 600px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        
        /* Product List Styling */
        .mini-cart { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 15px; margin-bottom: 25px; }
        .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #edf2f7; }
        .cart-item:last-child { border-bottom: none; }
        .product-link { color: #3182ce; text-decoration: none; font-weight: 600; font-size: 0.95rem; }
        .product-link:hover { text-decoration: underline; color: #2b6cb0; }
        .item-price { font-weight: bold; color: #2d3748; }
        .total-row { display: flex; justify-content: space-between; margin-top: 10px; font-weight: 800; font-size: 1.1rem; color: #b12704; }

        /* Step & Form Styling */
        .step { display: none; }
        .step.active { display: block; }
        .progress-bar { display: flex; justify-content: space-between; margin-bottom: 25px; }
        .dot { width: 30px; height: 30px; background: #ddd; border-radius: 50%; text-align: center; line-height: 30px; color: white; font-weight: bold; }
        .dot.active { background: #3182ce; }
        
        input, select, textarea { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #cbd5e0; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 15px; margin-top: 15px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .btn-next { background: #3182ce; color: white; }
        .btn-back { background: #edf2f7; color: #4a5568; margin-top: 10px; }
        .btn-confirm { background: #38a169; color: white; font-size: 1.1rem; }
    </style>
</head>
<body>

<div class="checkout-box">
    <div class="mini-cart">
        <h3 style="margin-top:0;">Order Summary</h3>
        <div id="cartItemsList">
            </div>
        <div class="total-row">
            <span>Total Amount:</span>
            <span id="grandTotal">$0.00</span>
        </div>
    </div>

    <div class="progress-bar">
        <div id="dot1" class="dot active">1</div>
        <div style="flex-grow:1; height:2px; background:#ddd; margin-top:14px;"></div>
        <div id="dot2" class="dot">2</div>
    </div>

    <div id="step1" class="step active">
        <h2>Step 1: Contact Info</h2>
        <input type="text" id="name" placeholder="Full Name">
        <input type="email" id="email" placeholder="Email Address">
        <input type="tel" id="phone" placeholder="Phone Number (e.g. +254...)">
        <input type="text" id="location" placeholder="City / County">
        <button class="btn-next" onclick="nextStep()">Continue to Logistics →</button>
    </div>

    <div id="step2" class="step">
        <h2>Step 2: Logistics & Payment</h2>
        <textarea id="address" rows="3" placeholder="Full Physical Address / Door Number"></textarea>
        
        <label style="font-size: 0.85rem; color: #4a5568;">Payment Method:</label>
        <select id="paymentMethod">
            <option value="M-Pesa">M-Pesa / Mobile Money</option>
            <option value="Card">Credit/Debit Card</option>
            <option value="Bank">Bank Transfer</option>
        </select>

        <div style="margin: 15px 0; font-size: 0.85rem; background: #fff5f5; padding: 10px; border-radius: 5px; border-left: 4px solid #f56565;">
            <input type="checkbox" id="refundAgreed" style="width: auto;"> 
            <strong>Critical Part Agreement:</strong> I understand that specialized parts are non-refundable once the seal is broken or installation begins.
        </div>

        <button class="btn-confirm" onclick="submitFinalOrder()">Secure Order & Pay</button>
        <button class="btn-back" onclick="prevStep()">← Back to Contact</button>
    </div>
</div>

<script>
    const API_URL = 'https://yskkdnff93.execute-api.us-east-1.amazonaws.com/prod/orders';

    // Load Cart Data on startup
    window.onload = function() {
        renderCartSummary();
    };

    function renderCartSummary() {
        const cart = JSON.parse(localStorage.getItem('nexus_cart')) || [];
        const listDiv = document.getElementById('cartItemsList');
        let total = 0;

        if (cart.length === 0) {
            listDiv.innerHTML = "<p>No items in cart. <a href='shop.html'>Go back to shop</a></p>";
            return;
        }

        listDiv.innerHTML = cart.map(item => {
            total += item.price;
            // Link to details page using the productId
            return `
                <div class="cart-item">
                    <a href="product-details.html?id=${item.productId}" target="_blank" class="product-link">
                        ${item.name} 🔗
                    </a>
                    <span class="item-price">$${item.price.toFixed(2)}</span>
                </div>
            `;
        }).join('');

        document.getElementById('grandTotal').textContent = `$${total.toFixed(2)}`;
    }

    function nextStep() {
        const name = document.getElementById('name').value;
        const email = document.getElementById('email').value;
        if(!name || !email) return alert("Name and Email are required.");
        
        document.getElementById('step1').classList.remove('active');
        document.getElementById('step2').classList.add('active');
        document.getElementById('dot2').classList.add('active');
    }

    function prevStep() {
        document.getElementById('step2').classList.remove('active');
        document.getElementById('step1').classList.add('active');
        document.getElementById('dot2').classList.remove('active');
    }

    async function submitFinalOrder() {
        if(!document.getElementById('refundAgreed').checked) {
            return alert("Please acknowledge the critical part agreement.");
        }

        const cart = JSON.parse(localStorage.getItem('nexus_cart')) || [];
        const total = cart.reduce((sum, item) => sum + item.price, 0);

        const fullPayload = {
            name: document.getElementById('name').value,
            email: document.getElementById('email').value,
            phone: document.getElementById('phone').value,
            location: document.getElementById('location').value,
            address: document.getElementById('address').value,
            paymentMethod: document.getElementById('paymentMethod').value,
            refundAgreed: document.getElementById('refundAgreed').checked,
            cart: cart,
            total: total
        };

        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(fullPayload)
            });
            const data = await response.json();
            
            if(response.ok) {
                alert("SUCCESS! Order " + data.orderId + " has been placed and secured.");
                localStorage.removeItem('nexus_cart');
                window.location.href = 'profile.html';
            } else {
                throw new Error(data.error);
            }
        } catch (err) {
            alert("Order Error: " + err.message);
        }
    }
</script>

</body>
</html>
