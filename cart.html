<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NexusFlow | Secure Checkout</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/aws-sdk/2.1522.0/aws-sdk.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@6.3.7/dist/amazon-cognito-identity.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        .checkout-grid {
            display: grid;
            grid-template-columns: 1.5fr 1fr;
            gap: 30px;
            align-items: start;
        }

        /* Empty Cart Styling */
        #empty-state {
            display: none; /* Hidden by default */
            text-align: center;
            padding: 80px 20px;
        }

        .summary-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: sticky;
            top: 100px;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .product-link {
            color: var(--text-primary);
            text-decoration: none;
            font-size: 0.9rem;
        }

        .total-row {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid var(--accent);
            display: flex;
            justify-content: space-between;
            font-size: 1.2rem;
            font-weight: 800;
        }

        .step { display: none; }
        .step.active { display: block; animation: fadeIn 0.4s ease; }

        .progress-stepper {
            display: flex;
            justify-content: space-between;
            margin-bottom: 40px;
        }

        .step-dot {
            width: 35px; height: 35px; border-radius: 50%;
            background: var(--card-bg); border: 2px solid var(--text-secondary);
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; color: var(--text-secondary);
        }

        .step-dot.active { border-color: var(--accent); color: var(--accent); }

        .line { flex-grow: 1; height: 2px; background: var(--text-secondary); align-self: center; }

        input[readonly] { background: rgba(255,255,255,0.05); color: var(--text-secondary); cursor: not-allowed; }
    </style>
</head>
<body>

<nav class="navbar">
    <a href="index.html" class="logo">NEXUS<span style="color:white">FLOW</span></a>
    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="shop.html">Shop</a>
        <a href="book-repair.html">Book Repair</a>
        <a href="profile.html">Profile</a>
    </div>
</nav>

<div class="container">
    <div id="empty-state" class="card">
        <h2 style="font-size: 2rem; margin-bottom: 10px;">Your cart is <span style="color:var(--accent)">empty</span></h2>
        <p style="color: var(--text-secondary); margin-bottom: 30px;">It looks like you haven't added any professional hardware to your selection yet.</p>
        <a href="shop.html" class="btn btn-primary">Return to Shop</a>
    </div>

    <div id="checkout-main" style="display: none;">
        <h1 style="margin-bottom: 30px;">Secure <span style="color:var(--accent)">Checkout</span></h1>

        <div class="checkout-grid">
            <div class="card">
                <div class="progress-stepper">
                    <div id="dot1" class="step-dot active">1</div>
                    <div class="line"></div>
                    <div id="dot2" class="step-dot">2</div>
                </div>

                <div id="step1" class="step active">
                    <h2 style="margin-bottom: 20px;">Contact Information</h2>
                    <label>Full Name</label>
                    <input type="text" id="name" placeholder="Enter your full name">
                    <label>Verified Account Email</label>
                    <input type="email" id="email" readonly>
                    <label>Mobile Number</label>
                    <input type="tel" id="phone" placeholder="e.g. +254...">
                    <label>City / County</label>
                    <input type="text" id="location" placeholder="e.g. Nairobi">
                    <button class="btn btn-primary" style="width:100%; margin-top: 20px;" onclick="nextStep()">Continue to Logistics →</button>
                </div>

                <div id="step2" class="step">
                    <h2 style="margin-bottom: 20px;">Shipping & Payment</h2>
                    <label>Delivery Address</label>
                    <textarea id="address" rows="3" placeholder="Apartment, House Number..."></textarea>
                    <label>Payment Method</label>
                    <select id="paymentMethod">
                        <option value="M-Pesa">M-Pesa / Mobile Money</option>
                        <option value="Card">Credit/Debit Card</option>
                        <option value="Bank">Bank Transfer</option>
                    </select>
                    <div style="background: rgba(239, 68, 68, 0.1); padding: 15px; border-radius: 8px; margin: 20px 0;">
                        <label style="display: flex; gap: 10px; cursor: pointer;">
                            <input type="checkbox" id="refundAgreed" style="width: auto;"> 
                            <span style="font-size: 0.85rem;">I acknowledge that specialized hardware parts are non-refundable once installation begins.</span>
                        </label>
                    </div>
                    <button class="btn btn-primary" style="width:100%;" onclick="submitFinalOrder()">Complete Secure Checkout</button>
                    <button class="btn btn-outline" style="width:100%; margin-top: 10px;" onclick="prevStep()">← Edit Contact Info</button>
                </div>
            </div>

            <div class="card summary-card">
                <h3 style="margin-top:0; color:var(--accent)">Order Summary</h3>
                <div id="cartItemsList"></div>
                <div class="total-row">
                    <span>Total</span>
                    <span id="grandTotal" style="color:var(--accent)">$0.00</span>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const API_URL = 'https://yskkdnff93.execute-api.us-east-1.amazonaws.com/prod/orders';
    const poolData = { UserPoolId: 'us-east-1_IK57zG64M', ClientId: '668q6c6krjv8b6n81cfc78n9a4' };

    window.onload = function() {
        const cart = JSON.parse(localStorage.getItem('nexus_cart')) || [];
        
        if (cart.length === 0) {
            document.getElementById('empty-state').style.display = 'block';
            document.getElementById('checkout-main').style.display = 'none';
        } else {
            document.getElementById('empty-state').style.display = 'none';
            document.getElementById('checkout-main').style.display = 'block';
            renderCartSummary(cart);
            checkUserSession();
        }
    };

    function checkUserSession() {
        const userPool = new AmazonCognitoIdentity.CognitoUserPool(poolData);
        const cognitoUser = userPool.getCurrentUser();
        if (cognitoUser) {
            cognitoUser.getSession((err, session) => {
                if (err || !session.isValid()) window.location.href = 'login.html';
                cognitoUser.getUserAttributes((err, attrs) => {
                    const email = attrs.find(a => a.Name === 'email');
                    if (email) document.getElementById('email').value = email.Value;
                });
            });
        } else { window.location.href = 'login.html'; }
    }

    function renderCartSummary(cart) {
        let total = 0;
        document.getElementById('cartItemsList').innerHTML = cart.map(item => {
            total += item.price;
            return `<div class="cart-item"><span>${item.name}</span><strong>$${item.price.toFixed(2)}</strong></div>`;
        }).join('');
        document.getElementById('grandTotal').textContent = `$${total.toFixed(2)}`;
    }

    function nextStep() {
        if(!document.getElementById('name').value) return alert("Name is required.");
        document.getElementById('step1').classList.remove('active');
        document.getElementById('step2').classList.add('active');
        document.getElementById('dot2').classList.add('active');
    }

    function prevStep() {
        document.getElementById('step2').classList.remove('active');
        document.getElementById('step1').classList.add('active');
        document.getElementById('dot2').classList.remove('active');
    }

    async function submitFinalOrder() {
        if(!document.getElementById('refundAgreed').checked) return alert("Agree to terms.");
        const cart = JSON.parse(localStorage.getItem('nexus_cart'));
        const total = cart.reduce((s, i) => s + i.price, 0);
        
        const payload = {
            name: document.getElementById('name').value,
            email: document.getElementById('email').value,
            phone: document.getElementById('phone').value,
            location: document.getElementById('location').value,
            address: document.getElementById('address').value,
            paymentMethod: document.getElementById('paymentMethod').value,
            cart: cart,
            total: total
        };

        try {
            const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(payload) });
            if(res.ok) {
                localStorage.removeItem('nexus_cart');
                alert("Order Placed!");
                window.location.href = 'profile.html';
            }
        } catch (e) { alert("Error placing order."); }
    }
</script>
</body>
</html>
