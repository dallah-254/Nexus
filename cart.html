<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusFlow | Secure Checkout</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/aws-sdk/2.1522.0/aws-sdk.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@6.3.7/dist/amazon-cognito-identity.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        .checkout-grid {
            display: grid;
            grid-template-columns: 1.5fr 1fr;
            gap: 30px;
            margin-top: 30px;
            align-items: start;
        }

        #empty-state {
            display: none;
            text-align: center;
            padding: 100px 20px;
        }

        .summary-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: sticky;
            top: 100px;
            padding: 25px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .remove-btn {
            background: none;
            border: none;
            color: #ff4d4d;
            font-size: 0.7rem;
            cursor: pointer;
            text-transform: uppercase;
            margin-top: 5px;
            padding: 0;
        }

        .total-row {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid var(--accent);
            display: flex;
            justify-content: space-between;
            font-size: 1.4rem;
            font-weight: 800;
        }

        /* Stepper Logic */
        .step { display: none; }
        .step.active { display: block; animation: fadeIn 0.3s ease; }

        .progress-stepper {
            display: flex;
            justify-content: space-between;
            margin-bottom: 40px;
        }

        .step-dot {
            width: 35px; height: 35px; border-radius: 50%;
            background: #1a1a1a; border: 2px solid #444;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; color: #888;
        }

        .step-dot.active { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 10px rgba(0,243,255,0.2); }
        .line { flex-grow: 1; height: 2px; background: #333; align-self: center; margin: 0 10px; }

        input[readonly] { background: rgba(255,255,255,0.05); color: #777; cursor: not-allowed; }

        @media (max-width: 900px) {
            .checkout-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<nav class="navbar">
    <a href="index.html" class="logo">NEXUS<span style="color:white">FLOW</span></a>
    <div class="nav-links">
        <a href="shop.html">Shop</a>
        <a href="profile.html">Profile</a>
    </div>
</nav>

<div class="container">
    <div id="empty-state">
        <h2 style="font-size: 2.5rem;">Cart is <span style="color:var(--accent)">Empty</span></h2>
        <p style="color:var(--text-secondary); margin-bottom: 30px;">Initialize your hardware selection to proceed.</p>
        <a href="shop.html" class="btn btn-primary">Return to Shop</a>
    </div>

    <div id="checkout-main" style="display: none;">
        <h1 style="margin: 40px 0;">Secure <span style="color:var(--accent)">Checkout</span></h1>

        <div class="checkout-grid">
            <div class="card">
                <div class="progress-stepper">
                    <div id="dot1" class="step-dot active">1</div>
                    <div class="line"></div>
                    <div id="dot2" class="step-dot">2</div>
                </div>

                <div id="step1" class="step active">
                    <h3 style="margin-bottom: 20px;">Contact Identification</h3>
                    <label>Full Name</label>
                    <input type="text" id="name" placeholder="Legal Name">
                    
                    <label>Verified Email</label>
                    <input type="email" id="email" readonly>
                    
                    <label>Phone Number</label>
                    <input type="tel" id="phone" placeholder="+254...">
                    
                    <button class="btn btn-primary" style="width:100%; margin-top: 20px;" onclick="nextStep()">Continue to Logistics →</button>
                </div>

                <div id="step2" class="step">
                    <h3 style="margin-bottom: 20px;">Shipping & Payment</h3>
                    <label>Delivery Address</label>
                    <textarea id="address" rows="3" placeholder="Street, Building, Apartment..."></textarea>
                    
                    <label>Payment Method</label>
                    <select id="paymentMethod">
                        <option value="M-Pesa">M-Pesa Express</option>
                        <option value="Card">Visa / Mastercard</option>
                        <option value="Bank">Bank Transfer</option>
                    </select>

                    <div style="background: rgba(255, 255, 255, 0.03); padding: 15px; border-radius: 8px; margin: 25px 0; border: 1px solid rgba(255,255,255,0.05);">
                        <label style="display: flex; gap: 10px; cursor: pointer; align-items: flex-start;">
                            <input type="checkbox" id="refundAgreed" style="width: auto; margin-top: 4px;"> 
                            <span style="font-size: 0.8rem; color: #888;">I acknowledge that technical hardware parts are non-refundable once the order is dispatched.</span>
                        </label>
                    </div>

                    <button class="btn btn-primary" style="width:100%;" onclick="submitFinalOrder()">Execute Secure Checkout</button>
                    <button class="btn btn-outline" style="width:100%; margin-top: 10px;" onclick="prevStep()">← Edit Info</button>
                </div>
            </div>

            <div class="summary-card">
                <h3 style="margin-top:0; color:var(--accent); font-size: 0.9rem; letter-spacing: 2px;">ORDER SUMMARY</h3>
                <div id="cartItemsList">
                    </div>
                <div class="total-row">
                    <span>Total</span>
                    <span id="grandTotal" style="color:var(--accent)">$0.00</span>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // 1. Config
    const API_URL = 'https://yskkdnff93.execute-api.us-east-1.amazonaws.com/prod/orders';
    const poolData = { UserPoolId: 'us-east-1_IK57zG64M', ClientId: '668q6c6krjv8b6n81cfc78n9a4' };

    window.onload = function() {
        refreshCartUI();
        initUserSession();
    };

    // 2. User & Session
    function initUserSession() {
        const userPool = new AmazonCognitoIdentity.CognitoUserPool(poolData);
        const cognitoUser = userPool.getCurrentUser();
        if (cognitoUser) {
            cognitoUser.getSession((err, session) => {
                if (err || !session.isValid()) window.location.href = 'login.html';
                cognitoUser.getUserAttributes((err, attrs) => {
                    const email = attrs.find(a => a.Name === 'email');
                    if (email) document.getElementById('email').value = email.Value;
                });
            });
        } else { window.location.href = 'login.html'; }
    }

    // 3. Cart Logic
    function refreshCartUI() {
        const cart = JSON.parse(localStorage.getItem('nexus_cart')) || [];
        const main = document.getElementById('checkout-main');
        const empty = document.getElementById('empty-state');

        if (cart.length === 0) {
            empty.style.display = 'block';
            main.style.display = 'none';
        } else {
            empty.style.display = 'none';
            main.style.display = 'block';
            renderSummary(cart);
        }
    }

    function renderSummary(cart) {
        let total = 0;
        const container = document.getElementById('cartItemsList');
        
        container.innerHTML = cart.map((item, index) => {
            const price = parseFloat(item.price) || 0;
            total += price;
            return `
                <div class="cart-item">
                    <div>
                        <div style="font-weight: 600; font-size: 0.9rem;">${item.name || item.productName}</div>
                        <button class="remove-btn" onclick="removeItem(${index})">Remove</button>
                    </div>
                    <strong>$${price.toFixed(2)}</strong>
                </div>`;
        }).join('');
        
        document.getElementById('grandTotal').innerText = `$${total.toFixed(2)}`;
    }

    function removeItem(index) {
        let cart = JSON.parse(localStorage.getItem('nexus_cart')) || [];
        cart.splice(index, 1);
        localStorage.setItem('nexus_cart', JSON.stringify(cart));
        refreshCartUI();
    }

    // 4. Navigation
    function nextStep() {
        if(!document.getElementById('name').value) return alert("Please enter your full name.");
        document.getElementById('step1').classList.remove('active');
        document.getElementById('step2').classList.add('active');
        document.getElementById('dot2').classList.add('active');
    }

    function prevStep() {
        document.getElementById('step2').classList.remove('active');
        document.getElementById('step1').classList.add('active');
        document.getElementById('dot2').classList.remove('active');
    }

    // 5. Submit Order
    async function submitFinalOrder() {
        const btn = event.target;
        if(!document.getElementById('refundAgreed').checked) return alert("Please acknowledge the hardware policy.");

        const cart = JSON.parse(localStorage.getItem('nexus_cart'));
        const totalAmount = cart.reduce((sum, item) => sum + (parseFloat(item.price) || 0), 0);

        const payload = {
            type: 'order',
            name: document.getElementById('name').value,
            email: document.getElementById('email').value,
            phone: document.getElementById('phone').value,
            address: document.getElementById('address').value,
            paymentMethod: document.getElementById('paymentMethod').value,
            items: cart,
            total: totalAmount.toFixed(2)
        };

        btn.disabled = true;
        btn.innerText = "Transmitting...";

        try {
            const res = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const data = await res.json();

            if (data.success || res.ok) {
                // Save info for success page
                sessionStorage.setItem('lastOrder', JSON.stringify({
                    id: data.id,
                    total: payload.total,
                    email: payload.email
                }));

                localStorage.removeItem('nexus_cart');
                window.location.href = 'order-success.html';
            } else {
                throw new Error(data.message || "Processor rejected the order.");
            }
        } catch (e) {
            alert("Order Error: " + e.message);
            btn.disabled = false;
            btn.innerText = "Execute Secure Checkout";
        }
    }
</script>
</body>
</html>
