<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus | Hardware Inventory</title>
    
    <script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@6.3.7/dist/amazon-cognito-identity.min.js"></script>
    <script src="auth-config.js"></script>
    <script src="header.js" defer></script>
    <script src="footer.js" defer></script>
    <link rel="stylesheet" href="style.css">

    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-light: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }

        body { 
            background: var(--bg-light); 
            color: var(--text-main); 
            margin: 0; 
            font-family: 'Inter', sans-serif; 
            padding-top: 120px;
        }

        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }

        /* Notification Toast */
        #nexus-toast {
            position: fixed; bottom: 30px; right: 30px;
            padding: 16px 24px; background: #1e293b;
            border-left: 4px solid var(--primary);
            border-radius: 8px; color: white;
            font-weight: 600; font-size: 0.9rem;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.2);
            z-index: 9999; display: none;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        /* Header Area */
        .terminal-header {
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 2px solid var(--border-color);
        }

        .terminal-header h1 {
            font-weight: 800;
            margin: 0;
            font-size: 2rem;
            color: var(--text-main);
        }

        /* Wishlist Grid & Cards */
        .wishlist-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
        }

        .wish-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .wish-card:hover {
            border-color: var(--primary);
            transform: translateY(-5px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }

        .wish-link {
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .wish-image {
            width: 100%;
            height: 200px;
            object-fit: contain;
            background: white;
            border-radius: 12px;
            margin-bottom: 15px;
        }

        .wish-name {
            font-size: 1.1rem;
            font-weight: 700;
            height: 2.8rem;
            overflow: hidden;
            margin-bottom: 8px;
            line-height: 1.4;
        }

        .wish-price {
            color: var(--text-main);
            font-weight: 800;
            font-size: 1.25rem;
            margin-bottom: 20px;
            display: block;
        }

        /* Buttons */
        .wish-actions {
            display: flex;
            gap: 12px;
            margin-top: auto;
        }

        .btn-cart {
            flex: 1;
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.2s;
        }

        .btn-cart:hover { background: var(--primary-hover); }

        .btn-remove {
            background: #fff;
            border: 1px solid var(--border-color);
            color: #ef4444;
            width: 44px;
            height: 44px;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        .btn-remove:hover {
            background: #fee2e2;
            border-color: #fecaca;
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 120px 0;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

    <div id="nexus-header-wrapper"></div>
    <div id="nexus-toast"></div>

    <main class="container">
        <div class="terminal-header">
            <h1>My Wishlist</h1>
            <p style="color: var(--text-muted); margin-top: 8px;">Review and manage your saved hardware components.</p>
        </div>

        <div id="wishlist-display" class="wishlist-grid">
            <div class="empty-state">Syncing your saved items...</div>
        </div>
    </main>
    <footer id="nexus-footer-wrapper"></footer>

    <script>
        let apiProducts = [];

        async function initWishlist() {
            const display = document.getElementById('wishlist-display');
            const savedIds = JSON.parse(localStorage.getItem('nexus_wishlist')) || [];
            
            if (savedIds.length === 0) {
                display.innerHTML = `<div class="empty-state">Your wishlist is currently empty.</div>`;
                return;
            }

            try {
                const response = await fetch(`${NEXUS_CONFIG.api.baseUrl}/products`);
                apiProducts = await response.json();

                const wishItems = apiProducts.filter(p => savedIds.includes(p.productId));

                if (wishItems.length === 0) {
                    display.innerHTML = `<div class="empty-state">No matching products found in our catalog.</div>`;
                    return;
                }

                display.innerHTML = wishItems.map(p => `
                    <div class="wish-card" id="card-${p.productId}">
                        <a href="product-details.html?id=${p.productId}" class="wish-link">
                            <img src="${p.imageUrl || 'https://via.placeholder.com/250'}" class="wish-image" alt="${p.name}">
                            <div class="wish-name">${p.name}</div>
                            <span class="wish-price">$${parseFloat(p.price).toFixed(2)}</span>
                        </a>
                        <div class="wish-actions">
                            <button class="btn-cart" onclick="transferToCart('${p.productId}')">Add to Cart</button>
                            <button class="btn-remove" onclick="removeFromWishlist('${p.productId}')" title="Remove Item">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                            </button>
                        </div>
                    </div>
                `).join('');

            } catch (err) {
                display.innerHTML = `<div class="empty-state">Error: Could not connect to the product database.</div>`;
            }
        }

        function showToast(message) {
            const toast = document.getElementById('nexus-toast');
            toast.innerText = message;
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 3000);
        }

        function removeFromWishlist(id) {
            let wishlist = JSON.parse(localStorage.getItem('nexus_wishlist')) || [];
            wishlist = wishlist.filter(itemId => itemId !== id);
            localStorage.setItem('nexus_wishlist', JSON.stringify(wishlist));
            
            const card = document.getElementById(`card-${id}`);
            if (card) {
                card.style.opacity = '0';
                card.style.transform = 'scale(0.9)';
                setTimeout(() => {
                    card.remove();
                    if (wishlist.length === 0) {
                        document.getElementById('wishlist-display').innerHTML = `<div class="empty-state">Your wishlist is currently empty.</div>`;
                    }
                }, 300);
            }
            
            showToast("Success: Item removed from wishlist");
            if (window.updateHeaderBadges) window.updateHeaderBadges();
        }

        function transferToCart(id) {
            const product = apiProducts.find(p => p.productId === id);
            if (!product) return;

            let cart = JSON.parse(localStorage.getItem('nexus_cart')) || [];
            cart.push({
                productId: product.productId,
                name: product.name,
                price: product.price,
                imageUrl: product.imageUrl
            });
            
            localStorage.setItem('nexus_cart', JSON.stringify(cart));
            if (window.updateHeaderBadges) window.updateHeaderBadges();
            showToast(`Success: ${product.name} added to cart`);
        }

        window.onload = initWishlist;
    </script>
</body>
</html>
