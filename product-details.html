<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NexusFlow | Product Specs</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .product-hero {
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            gap: 50px;
            margin-top: 40px;
            align-items: center;
        }

        .image-showcase {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 24px;
            padding: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 500px;
        }

        .image-showcase img {
            max-width: 100%;
            height: auto;
            border-radius: 12px;
            filter: drop-shadow(0 20px 50px rgba(0,0,0,0.5));
        }

        .details-panel {
            padding: 20px;
        }

        .category-label {
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.8rem;
            font-weight: 700;
            margin-bottom: 10px;
            display: block;
        }

        .price-display {
            font-size: 3rem;
            font-weight: 800;
            margin: 20px 0;
            color: var(--text-primary);
        }

        .specs-list {
            margin: 30px 0;
            list-style: none;
            padding: 0;
        }

        .specs-list li {
            padding: 12px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            color: var(--text-secondary);
            display: flex;
            justify-content: space-between;
        }

        .specs-list li span {
            color: var(--text-primary);
            font-weight: 600;
        }

        .action-area {
            display: flex;
            gap: 15px;
            margin-top: 40px;
        }

        #loading-overlay {
            text-align: center;
            padding: 100px 0;
        }
    </style>
</head>
<body>

<nav class="navbar">
    <a href="index.html" class="logo">NEXUS<span style="color:white">FLOW</span></a>
    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="shop.html">Shop</a>
        <a href="book-repair.html">Book Repair</a>
        <a href="profile.html">Profile</a>
        
        <a href="cart.html" class="cart-link" id="header-cart">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="var(--accent)">
                <path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/>
            </svg>
            <span class="cart-count" id="cart-badge">0</span>
        </a>
    </div>
</nav>

<div class="container">
    <div id="loading-overlay">
        <h2 style="color: var(--text-secondary)">Scanning Inventory...</h2>
    </div>

    <div id="displayArea" style="display: none;">
        </div>
</div>

<script>
    const API_URL = 'https://yskkdnff93.execute-api.us-east-1.amazonaws.com/prod/products';
    const params = new URLSearchParams(window.location.search);
    const idFromUrl = params.get('id');

    window.onload = function() {
        updateHeaderCart();
        fetch(API_URL)
            .then(res => res.json())
            .then(products => {
                const product = products.find(p => p.productId === idFromUrl);
                document.getElementById('loading-overlay').style.display = 'none';
                if(product) {
                    renderProduct(product);
                    document.getElementById('displayArea').style.display = 'block';
                } else {
                    document.getElementById('displayArea').innerHTML = "<h1 style='text-align:center'>404: Hardware Not Found</h1>";
                    document.getElementById('displayArea').style.display = 'block';
                }
            });
    };

    function renderProduct(p) {
        document.getElementById('displayArea').innerHTML = `
            <div class="product-hero">
                <div class="image-showcase">
                    <img src="${p.imageUrl || 'https://via.placeholder.com/600'}" alt="${p.name}">
                </div>
                <div class="details-panel">
                    <span class="category-label">Professional Grade Hardware</span>
                    <h1 style="font-size: 2.5rem; margin: 0;">${p.name}</h1>
                    <div class="badge badge-success" style="margin-top: 10px;">In Stock: ${p.stock} Units</div>
                    
                    <div class="price-display">$${p.price.toFixed(2)}</div>
                    
                    <p style="color: var(--text-secondary); font-size: 1.1rem; line-height: 1.8;">
                        ${p.description || 'Enterprise-ready component certified for high-performance NexusFlow installations.'}
                    </p>

                    <ul class="specs-list">
                        <li>Availability <span>Immediate Dispatch</span></li>
                        <li>Condition <span>Factory New / Sealed</span></li>
                        <li>Warranty <span>12 Months NexusCare</span></li>
                    </ul>
                    
                    <div class="action-area">
                        <button class="btn btn-primary" style="flex: 2; font-size: 1.1rem; padding: 20px;" onclick="addToCart('${p.productId}', '${p.name}', ${p.price})">
                            Add to System Cart
                        </button>
                        <a href="shop.html" class="btn btn-outline" style="flex: 1;">Back to Shop</a>
                    </div>
                </div>
            </div>
        `;
    }

    function addToCart(id, name, price) {
        let cart = JSON.parse(localStorage.getItem('nexus_cart')) || [];
        cart.push({ productId: id, name: name, price: price, timestamp: new Date().getTime() });
        localStorage.setItem('nexus_cart', JSON.stringify(cart));
        updateHeaderCart();
        
        // Visual confirmation before redirect
        const btn = document.querySelector('.btn-primary');
        btn.innerText = "✓ Added to Cart";
        btn.style.background = "var(--success)";
        
        setTimeout(() => { window.location.href = 'cart.html'; }, 800);
    }

    function updateHeaderCart() {
        const cart = JSON.parse(localStorage.getItem('nexus_cart')) || [];
        const badge = document.getElementById('cart-badge');
        badge.innerText = cart.length;
        badge.style.display = cart.length > 0 ? 'block' : 'none';
    }
</script>
</body>
</html>
