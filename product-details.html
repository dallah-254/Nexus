<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NexusFlow | Product Details</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f7f9; padding: 40px; }
        .main-container { max-width: 1000px; margin: auto; background: white; padding: 30px; border-radius: 15px; display: flex; gap: 40px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); }
        .image-side { flex: 1; text-align: center; }
        .image-side img { max-width: 100%; border-radius: 10px; }
        .info-side { flex: 1; }
        .price-tag { font-size: 2.2rem; color: #b12704; font-weight: bold; margin: 15px 0; }
        .stock-tag { color: #38a169; font-weight: bold; border: 1px solid #38a169; display: inline-block; padding: 2px 8px; border-radius: 4px; }
        .add-btn { background: #ff9900; color: white; border: none; padding: 15px 30px; border-radius: 8px; font-size: 1.2rem; font-weight: bold; width: 100%; cursor: pointer; margin-top: 20px; }
        .add-btn:hover { background: #e68a00; }
    </style>
</head>
<body>

<div id="displayArea" class="main-container">Loading item details...</div>

<script>
    const API_URL = 'https://yskkdnff93.execute-api.us-east-1.amazonaws.com/prod/products';
    const params = new URLSearchParams(window.location.search);
    const idFromUrl = params.get('id');

    window.onload = function() {
        fetch(API_URL)
            .then(res => res.json())
            .then(products => {
                const product = products.find(p => p.productId === idFromUrl);
                if(product) renderProduct(product);
                else document.getElementById('displayArea').innerHTML = "<h1>Product Not Found</h1>";
            });
    };

    function renderProduct(p) {
        document.getElementById('displayArea').innerHTML = `
            <div class="image-side">
                <img src="${p.imageUrl || 'https://via.placeholder.com/400'}">
            </div>
            <div class="info-side">
                <h1>${p.name}</h1>
                <div class="stock-tag">In Stock (${p.stock})</div>
                <div class="price-tag">$${p.price}</div>
                <p style="color: #555; line-height: 1.6;">${p.description || 'No description available for this item.'}</p>
                <hr>
                <button class="add-btn" onclick="addToCart('${p.productId}', '${p.name}', ${p.price})">Add to Cart</button>
            </div>
        `;
    }

    function addToCart(id, name, price) {
        // Initialize cart from localStorage or create empty array
        let cart = JSON.parse(localStorage.getItem('nexus_cart')) || [];
        
        // Add item
        cart.push({ productId: id, name: name, price: price, timestamp: new Date().getTime() });
        
        // Save back to browser storage
        localStorage.setItem('nexus_cart', JSON.stringify(cart));
        
        alert(name + " added to your cart!");
        window.location.href = 'shop.html';
    }
</script>
</body>
</html>
