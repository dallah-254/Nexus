<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusFlow | Secure Component Details</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .details-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 50px;
            margin-top: 60px;
            padding-bottom: 100px;
        }

        .product-visual {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
            min-height: 400px;
        }

        .product-visual img {
            max-width: 100%;
            max-height: 350px;
            object-fit: contain;
            filter: drop-shadow(0 0 20px rgba(0, 243, 255, 0.1));
        }

        .spec-label {
            color: var(--accent);
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            display: block;
            margin-bottom: 5px;
        }

        .price-display {
            font-size: 3rem;
            font-weight: 800;
            margin: 20px 0;
            color: var(--text-primary);
            font-family: 'JetBrains Mono', monospace;
        }

        .action-zone {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 1px solid rgba(255,255,255,0.1);
            display: flex;
            gap: 20px;
        }

        #loading-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .status-pill {
            display: inline-block;
            padding: 5px 15px;
            background: rgba(16, 185, 129, 0.1);
            color: #10b981;
            border-radius: 20px;
            font-size: 0.8rem;
            margin-bottom: 15px;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        @media (max-width: 850px) {
            .details-container { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div id="loading-screen">
    <h2 class="loading-pulse">Retrieving Data...</h2>
</div>

<nav class="navbar">
    <a href="index.html" class="logo">NEXUS<span style="color:white">FLOW</span></a>
    <div class="nav-links">
        <a href="shop.html">Shop</a>
        <a href="cart.html">Cart (<span id="cart-badge">0</span>)</a>
    </div>
</nav>

<div class="container">
    <div class="details-container" id="details-content" style="display: none;">
        <div class="product-visual">
            <img id="p-img" src="" alt="Hardware Visual">
        </div>

        <div class="product-info">
            <div class="status-pill">AUTHENTIC COMPONENT</div>
            <span class="spec-label" id="p-category">HARDWARE</span>
            <h1 id="p-name" style="font-size: 2.8rem; margin: 10px 0;">Component Name</h1>
            
            <p id="p-description" style="color: var(--text-secondary); line-height: 1.8; font-size: 1.1rem; margin: 20px 0;">
                Initializing telemetry...
            </p>

            <div class="price-display">$<span id="p-price">0.00</span></div>

            <div class="action-zone">
                <button id="add-btn" class="btn btn-primary" style="padding: 15px 40px; min-width: 200px;" onclick="addToCart()">Add to Cart</button>
                <button class="btn btn-outline" onclick="window.location.href='shop.html'">Exit View</button>
            </div>
        </div>
    </div>
</div>

<script>
    // 1. Setup URL and API Link
    const urlParams = new URLSearchParams(window.location.search);
    const productId = urlParams.get('id');
    const API_URL = `https://yskkdnff93.execute-api.us-east-1.amazonaws.com/prod/products?id=${productId}`;

    // Store product globally once loaded
    let currentProductData = null;

    window.onload = function() {
        updateBadge();
        
        if (!productId) {
            window.location.href = 'shop.html';
            return;
        }

        fetch(API_URL)
            .then(res => res.json())
            .then(product => {
                if (!product || product.error) {
                    document.getElementById('loading-screen').innerHTML = "<h2>Component not found.</h2>";
                    return;
                }

                // Map data from DynamoDB (handling both naming styles)
                currentProductData = product;
                const name = product.name || product.productName || "Unknown Hardware";
                const price = product.price ? parseFloat(product.price).toFixed(2) : "0.00";
                const img = product.imageUrl || product.imageURL || 'assets/placeholder.jpg';

                // Update HTML
                document.getElementById('p-name').innerText = name;
                document.getElementById('p-price').innerText = price;
                document.getElementById('p-category').innerText = product.category || "Hardware";
                document.getElementById('p-description').innerText = product.description || "High-performance specialized hardware part for professional deployment.";
                document.getElementById('p-img').src = img;

                // Toggle visibility
                document.getElementById('loading-screen').style.display = 'none';
                document.getElementById('details-content').style.display = 'grid';
            })
            .catch(err => {
                console.error("Fetch Error:", err);
                document.getElementById('loading-screen').innerHTML = "<h2>System Link Failure.</h2>";
            });
    };

    function addToCart() {
        if (!currentProductData) return;

        // Get existing cart or create empty
        let cart = JSON.parse(localStorage.getItem('nexus_cart')) || [];
        
        // Add item
        cart.push({
            productId: currentProductData.productId || currentProductData.id,
            name: currentProductData.name || currentProductData.productName,
            price: parseFloat(currentProductData.price),
            imageUrl: currentProductData.imageUrl || currentProductData.imageURL
        });

        // Save back to storage
        localStorage.setItem('nexus_cart', JSON.stringify(cart));
        
        // Update UI Badge
        updateBadge();

        // UI Feedback (Change button state instead of redirecting)
        const btn = document.getElementById('add-btn');
        const originalText = btn.innerText;
        btn.innerText = "✓ Added to Selection";
        btn.style.background = "#10b981";
        btn.style.borderColor = "#10b981";
        btn.disabled = true;

        // Reset button after 2 seconds
        setTimeout(() => {
            btn.innerText = originalText;
            btn.style.background = "";
            btn.style.borderColor = "";
            btn.disabled = false;
        }, 2000);
    }

    function updateBadge() {
        const cart = JSON.parse(localStorage.getItem('nexus_cart')) || [];
        const badge = document.getElementById('cart-badge');
        if (badge) badge.innerText = cart.length;
    }
</script>
</body>
</html>
