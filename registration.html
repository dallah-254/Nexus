<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusFlow | My Profile</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/aws-sdk/2.1522.0/aws-sdk.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@6.3.7/dist/amazon-cognito-identity.min.js"></script>
    
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f7f9; padding: 40px; margin: 0; }
        .container { max-width: 900px; margin: auto; }
        .card { background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 20px; }
        h1, h2 { color: #232f3e; margin-top: 0; }
        .user-details { border-bottom: 2px solid #eee; padding-bottom: 15px; margin-bottom: 15px; }
        .detail-item { padding: 8px 0; font-size: 16px; }
        .detail-item strong { color: #555; text-transform: capitalize; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th { background: #f8f9fa; text-align: left; padding: 12px; border-bottom: 2px solid #dee2e6; }
        td { padding: 12px; border-bottom: 1px solid #eee; }
        .status-badge { background: #e1f5fe; color: #01579b; padding: 4px 10px; border-radius: 20px; font-size: 13px; font-weight: bold; }
        
        .btn-logout { background: #d9534f; color: white; border: none; padding: 10px 25px; border-radius: 5px; cursor: pointer; font-weight: bold; float: right; }
        .btn-logout:hover { background: #c9302c; }
        #status-msg { color: #666; font-style: italic; }
    </style>
</head>
<body>

<div class="container">
    <button class="btn-logout" onclick="logout()">Logout</button>
    
    <div class="card">
        <h1>Welcome to NexusFlow</h1>
        <div id="user-info" class="user-details">Loading profile...</div>
    </div>

    <div class="card">
        <h2>My Booking History</h2>
        <div id="booking-status">Checking for bookings...</div>
        <table id="booking-table" style="display:none;">
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Service</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="booking-rows"></tbody>
        </table>
    </div>
</div>

<script>
    // 1. CONFIGURATION
    const poolData = { 
        UserPoolId: 'us-east-1_IK57zG64M', 
        ClientId: '668q6c6krjv8b6n81cfc78n9a4' 
    };
    const apiInvokeUrl = 'https://yskkdnff93.execute-api.us-east-1.amazonaws.com/prod/bookings';

    // 2. INITIALIZE PAGE
    window.onload = function() {
        const userPool = new AmazonCognitoIdentity.CognitoUserPool(poolData);
        const cognitoUser = userPool.getCurrentUser();

        if (cognitoUser != null) {
            cognitoUser.getSession((err, session) => {
                if (err || !session.isValid()) {
                    console.error("Session invalid");
                    window.location.href = 'login.html';
                } else {
                    console.log("Logged in successfully.");
                    loadProfile(cognitoUser);
                    loadBookings(session);
                }
            });
        } else {
            window.location.href = 'login.html';
        }
    };

    // 3. LOAD PROFILE DATA
    function loadProfile(cognitoUser) {
        cognitoUser.getUserAttributes((err, attributes) => {
            if (err) {
                document.getElementById('user-info').innerText = "Failed to load user attributes.";
                return;
            }
            let html = "";
            attributes.forEach(attr => {
                const cleanName = attr.Name.replace('custom:', '').replace('_', ' ');
                if (["email", "family_name", "middle_name", "address", "phone_number"].includes(attr.Name)) {
                    html += `<div class="detail-item"><strong>${cleanName}:</strong> ${attr.Value}</div>`;
                }
            });
            document.getElementById('user-info').innerHTML = html;
        });
    }

    // 4. LOAD BOOKINGS FROM API
    function loadBookings(session) {
        const idToken = session.getIdToken().getJwtToken();

        fetch(apiInvokeUrl, {
            method: 'GET',
            headers: {
                'Authorization': idToken,
                'Content-Type': 'application/json'
            }
        })
        .then(response => {
            if (!response.ok) throw new Error("API responded with " + response.status);
            return response.json();
        })
        .then(data => {
            const statusEl = document.getElementById('booking-status');
            const tableEl = document.getElementById('booking-table');
            const rowsEl = document.getElementById('booking-rows');

            statusEl.style.display = 'none';

            if (data.length === 0) {
                statusEl.style.display = 'block';
                statusEl.innerText = "No bookings found for your account.";
            } else {
                tableEl.style.display = 'table';
                rowsEl.innerHTML = data.map(item => `
                    <tr>
                        <td>${item.bookingDate}</td>
                        <td>${item.serviceType || 'Standard Service'}</td>
                        <td><span class="status-badge">${item.status || 'CONFIRMED'}</span></td>
                    </tr>
                `).join('');
            }
        })
        .catch(error => {
            console.error("Fetch Error:", error);
            document.getElementById('booking-status').innerText = "Unable to connect to booking service. Check Console.";
        });
    }

    // 5. LOGOUT
    function logout() {
        const userPool = new AmazonCognitoIdentity.CognitoUserPool(poolData);
        const cognitoUser = userPool.getCurrentUser();
        if (cognitoUser) cognitoUser.signOut();
        window.location.href = 'login.html';
    }
</script>

</body>
</html>
