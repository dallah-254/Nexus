<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusFlow | Create Profile</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/aws-sdk/2.1522.0/aws-sdk.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@6.3.7/dist/amazon-cognito-identity.min.js"></script>
    
    <script src="auth-config.js"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="header.css">

    <style>
        body { padding-top: 100px; } /* Uniform offset for header */

        .auth-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
            padding: 40px 20px;
        }

        .signup-card {
            width: 100%;
            max-width: 550px;
            animation: fadeIn 0.5s ease;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-cyan);
            backdrop-filter: blur(10px);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 2-Column Grid for Form */
        .registration-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .full-width { grid-column: span 2; }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-dim);
            font-family: 'JetBrains Mono', monospace;
        }

        input {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(0, 243, 255, 0.2);
            color: white;
            padding: 12px;
            border-radius: 4px;
            width: 100%;
        }

        #statusMsg {
            text-align: center;
            margin-top: 20px;
            font-size: 0.85rem;
            min-height: 20px;
            padding: 12px;
            border-radius: 6px;
            display: none;
            font-family: 'JetBrains Mono', monospace;
        }

        hr {
            border: 0;
            border-top: 1px solid rgba(0, 243, 255, 0.1);
            margin: 20px 0;
            grid-column: span 2;
        }

        .signup-title {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.8rem;
            margin: 0;
        }
    </style>
</head>
<body>


<div class="auth-container">
    <div class="card signup-card">
        <div style="text-align: center; margin-bottom: 30px;">
            <h2 class="signup-title">System <span class="text-accent">Registration</span></h2>
            <p class="text-dim" style="font-size: 0.9rem; margin-top: 8px;">Create your secure NexusFlow hardware profile.</p>
        </div>

        <form id="regForm" class="registration-grid">
            <div>
                <label>Middle Name</label>
                <input type="text" id="middleName" placeholder="e.g. Alexander" required>
            </div>
            <div>
                <label>Family Name</label>
                <input type="text" id="familyName" placeholder="e.g. Smith" required>
            </div>
            
            <div class="full-width">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="name@company.com" required>
            </div>

            <div class="full-width">
                <label>Phone Number (International)</label>
                <input type="tel" id="phone" placeholder="+2547..." required>
            </div>

            <div class="full-width">
                <label>Physical Address</label>
                <input type="text" id="address" placeholder="Building, Street, City" required>
            </div>

            <hr>

            <div class="full-width">
                <label>Secure Password</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <button type="submit" id="submitBtn" class="btn btn-primary full-width" style="padding: 15px; font-size: 1rem; margin-top: 10px;">
                Initialize Profile
            </button>
        </form>

        <div id="statusMsg"></div>

        <div style="text-align: center; margin-top: 25px; font-size: 0.9rem; color: var(--text-dim);">
            Already have an account? <a href="login.html" class="text-accent" style="text-decoration: none; font-weight: 700;">Sign In</a>
        </div>
    </div>
</div>

<script src="header.js"></script>
<script>
    // Use config from auth-config.js
    const poolData = { 
        UserPoolId: NEXUS_CONFIG.auth.UserPoolId, 
        ClientId: NEXUS_CONFIG.auth.ClientId 
    };

    window.onload = function() {
        const userPool = new AmazonCognitoIdentity.CognitoUserPool(poolData);

        document.getElementById('regForm').onsubmit = function(e) {
            e.preventDefault();
            
            const status = document.getElementById('statusMsg');
            const btn = document.getElementById('submitBtn');
            
            status.style.display = "block";
            status.style.background = "rgba(255, 255, 255, 0.05)";
            status.style.color = "var(--text-dim)";
            status.innerText = "Synchronizing with AWS Cognito...";
            btn.disabled = true;

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const middleName = document.getElementById('middleName').value;
            const familyName = document.getElementById('familyName').value;
            const phone = document.getElementById('phone').value;
            const address = document.getElementById('address').value;

            const attributeList = [
                new AmazonCognitoIdentity.CognitoUserAttribute({ Name: 'email', Value: email }),
                new AmazonCognitoIdentity.CognitoUserAttribute({ Name: 'family_name', Value: familyName }),
                new AmazonCognitoIdentity.CognitoUserAttribute({ Name: 'middle_name', Value: middleName }),
                new AmazonCognitoIdentity.CognitoUserAttribute({ Name: 'phone_number', Value: phone }),
                new AmazonCognitoIdentity.CognitoUserAttribute({ Name: 'address', Value: address })
            ];

            userPool.signUp(email, password, attributeList, null, function(err, result) {
                if (err) {
                    status.style.background = "rgba(239, 68, 68, 0.1)";
                    status.style.color = "#ff4444";
                    status.innerText = err.message || "Registration failed.";
                    btn.disabled = false;
                    return;
                }
                
                status.style.background = "rgba(16, 185, 129, 0.1)";
                status.style.color = "#10b981";
                status.innerText = "Profile created. Verify your email to activate.";
                
                localStorage.setItem('nexusEmail', email);
                setTimeout(() => { window.location.href = 'verify.html'; }, 2000);
            });
        };
    };
</script>
</body>
</html>
